---
- name: Work Item 1 - Enable EW and require successful provisioning before baseline
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Select the explicit overall EW workflow
      ansible.builtin.set_fact:
        ew_workloads_enabled: true
        ew_provision_action: apply

    - name: Reject overrides that would bypass provisioning or EW validation
      ansible.builtin.assert:
        that:
          - ew_workloads_enabled | bool
          - ew_provision_action == 'apply'

- name: Provision persistent EW resources and verify application readiness
  ansible.builtin.import_playbook: ew-provision.yml

- name: Collect the finite source baseline only after provisioning passes
  ansible.builtin.import_playbook: ew-baseline.yml

- name: Run the existing migration sequence and report
  ansible.builtin.import_playbook: migrate-to-ovn.yml
