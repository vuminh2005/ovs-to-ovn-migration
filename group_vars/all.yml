---
# V2 is designed to require no per-cloud file edits for the tested/supported scope.
# It auto-discovers the Kolla inventory path, kolla-ansible binary, source globals,
# control/OVN hosts, generated OVN DB endpoints, source resource IDs and network MTUs.

# Standard Kolla locations. Override only through environment variables when a
# deployment intentionally uses non-standard paths.
kolla_globals_path: "{{ lookup('env', 'KOLLA_GLOBALS') | default('/etc/kolla/globals.yml', true) }}"
openrc_path: "{{ lookup('env', 'KOLLA_OPENRC') | default('/etc/kolla/admin-openrc.sh', true) }}"
migration_backup_root: "{{ lookup('env', 'OVS_TO_OVN_BACKUP_ROOT') | default('/root/ovs-to-ovn-backup', true) }}"

# Supported/tested scope.
supported_openstack_release: "2024.1"
supported_kolla_ansible_regex: '.*18\.8(\.|$).*'
supported_ubuntu_release: "24.04"
source_neutron_plugin_agent: openvswitch
source_tenant_network_type: vxlan
target_neutron_plugin_agent: ovn
target_tenant_network_type: geneve
neutron_type_drivers_target: "flat,vlan,vxlan,geneve"

# Empty discovers the installed template beside the kolla-ansible executable.
# MTUs and the VXLAN/Geneve delta are calculated from effective config and
# every chassis tunnel interface; no 1450/1442 validation default is assumed.
mtu_kolla_ml2_template_path: ''

# Kolla systemd units.
neutron_server_unit: kolla-neutron_server-container.service
legacy_network_units:
  - kolla-neutron_dhcp_agent-container.service
  - kolla-neutron_l3_agent-container.service
  - kolla-neutron_metadata_agent-container.service
  - kolla-neutron_openvswitch_agent-container.service
legacy_compute_units:
  - kolla-neutron_openvswitch_agent-container.service

# ML2/OVS can leave br-int restricted to OF <= 1.4. OVN controller in the
# validated environment needs OF1.5 negotiation, so normalize it at cutover.
br_int_protocols: "OpenFlow10,OpenFlow11,OpenFlow12,OpenFlow13,OpenFlow14,OpenFlow15"

# Safety / backup.
run_mariadb_backup: true

# Dynamic Port_Binding convergence timeout. Large clouds get more time without
# requiring an edit. timeout = base + seconds_per_port * old_compute_ports,
# capped at max.
binding_timeout_base_seconds: 300
binding_timeout_seconds_per_port: 2
binding_timeout_max_seconds: 1800
binding_poll_interval_seconds: 5

# Automatic post-migration control-plane smoke test. It creates a temporary
# network, asserts that it is Geneve, then deletes it. No VM/image/flavor is
# required and no permanent tenant resource is left behind.
validation_ephemeral_network: true

# Guest VM1 tenant ICMP interval.
dataplane_probe_interval_seconds: 0.2

# Optional resume target. Leave empty to auto-pick the newest migration run.
# Prefer passing explicitly for safety:
#   -e migration_resume_run_dir=/root/ovs-to-ovn-backup/<run-id>
migration_resume_run_dir: "{{ lookup('env', 'OVS_TO_OVN_RESUME_RUN_DIR') | default('', true) }}"

# Workload POC: UUID or unambiguous name. Ubuntu cloud images must already
# contain cloud-init, Python3, ping, iproute2, systemd and ttyS0 support.
validation_workloads_enabled: true
validation_image: "{{ lookup('env', 'MIGRATION_VALIDATION_IMAGE') | default('', true) }}"
validation_flavor: "{{ lookup('env', 'MIGRATION_VALIDATION_FLAVOR') | default('', true) }}"
validation_name_prefix: ovn-validation
validation_pre_cidrs: ['10.231.0.0/24', '10.231.1.0/24']
validation_post_cidrs: ['10.232.0.0/24', '10.232.1.0/24']
validation_timeout_seconds: 300
validation_probe_lifetime_seconds: 14400
validation_console_poll_seconds: 2
# ~65 minutes of VM1 packet/health records at the default 5 packets/s.
# Nova may retain fewer lines: missing anchored sequences remain UNAVAILABLE.
validation_console_tail_lines: 20000

# Empty image/flavor overrides select automatically prepared reusable defaults.
validation_managed_image_name: ovn-validation-ubuntu-24.04
validation_managed_image_url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
validation_managed_flavor_name: ovn-validation.small
validation_image_cache_dir: /var/cache/ovs-to-ovn-validation
validation_image_download_timeout_seconds: 120
validation_image_active_timeout_seconds: 900
# Shared prerequisites are intentionally not part of normal workload cleanup.
# True is rejected before migration; remove shared resources explicitly instead.
validation_cleanup_prerequisites: false

# DHCP option 58 on owned validation ports, before their first lease.
validation_dhcp_t1_seconds: 30
# Bound rebinding to the new server after OVS DHCP disappears.
validation_dhcp_t2_seconds: 60
# Allow small scheduling/network delays in the observed renewal cadence.
validation_dhcp_renewal_tolerance_seconds: 5
validation_dhcp_convergence_timeout: 180
# Opt in only for validation-owned Pair B; Pair A is never rebooted.
validation_allow_pre_cutover_guest_reboot: false
# Independent opt-in for owned Pair-B stale DHCP state after OVN takeover.
validation_allow_post_cutover_guest_reboot: false
validation_post_cutover_dhcp_timeout_seconds: 180
# Persistent compute-local evidence, retained until successful final report.
validation_capture_directory: /var/lib/ovn-migration-validation

# Admin Nova availability-zone:host placement requests, checked after ACTIVE.
# Empty Pair-A/B lists allow scheduling, but actual compute hosts are recorded.
validation_availability_zone: nova
validation_compute_hosts:
  measure: []
  existing: []
  fresh: [compute1, compute2]

# Existing East-West application resources are NEVER validation-owned. Enable
# strict runtime discovery for an EW migration run; the general POC can still
# run without requiring this separate application topology.
ew_workloads_enabled: false
# Work Item 1: persistent EW provisioning, separate from validation ownership.
# Inspect is read-only with respect to the cloud; apply must be requested.
ew_provision_action: inspect
ew_provision_state_dir: /var/lib/ovs-to-ovn-ew-provisioning
ew_provision_timeout_seconds: 900
ew_provision_availability_zone: nova
# Optional complete JSON override. Defaults below are confirmed creation-log
# values, checked against live resources when this playbook is explicitly run.
ew_provision_spec_file: ''
ew_provision_secret_files: {}
# Reconstructed from reviewed live evidence; original scripts remain unresolved.
ew_provision_bootstrap_sources:
  ew-db:
    path: "{{ playbook_dir }}/workloads/ew-bootstrap/adapter.py"
    sha256: 39ab4c721383f1798a0903b4b99a5fd81920bcfd31aaa4252ce0af1474e26f9c
    interpreter: python3
  ew-queue:
    path: "{{ playbook_dir }}/workloads/ew-bootstrap/adapter.py"
    sha256: 39ab4c721383f1798a0903b4b99a5fd81920bcfd31aaa4252ce0af1474e26f9c
    interpreter: python3
ew_bootstrap_reference_file: /root/ew-bootstrap-live-evidence.json
ew_provision_private_dir: /root/ew-private
ew_provision_spec:
  image:
    path: /root/ew-image-build/ew-ubuntu-24.04-netfix.qcow2
    sha256: 822f3f2e3c988c7560609cdf0469f708ff3f7c6ab678d3268c8809b8b93501a8
    sha256_file: /root/ew-image-build/ew-ubuntu-24.04-netfix.qcow2.sha256
    visibility: private
    min_disk: 10
    min_ram: 2048
    properties: {os_distro: ubuntu, os_version: '24.04'}
  networks:
    ew-net-a:
      subnet: ew-subnet-a
      cidr: 192.168.101.0/24
      gateway_ip: 192.168.101.1
      allocation_pools: [{start: 192.168.101.100, end: 192.168.101.199}]
      dns_nameservers: []
      host_routes: []
    ew-net-b:
      subnet: ew-subnet-b
      cidr: 192.168.102.0/24
      gateway_ip: 192.168.102.1
      allocation_pools: [{start: 192.168.102.100, end: 192.168.102.199}]
      dns_nameservers: []
      host_routes: []
  security_group: ew-sg
  keypair: ew-key
  keypair_public_key: /root/.ssh/ew-lab.pub
  # Private local password paths, recovered separately; no inline secrets.
  # Reviewed reconstructed DB/broker adapters are the default bootstrap inputs.
  secrets: "{{ ew_provision_secret_files }}"
  bootstrap: "{{ ew_provision_bootstrap_sources }}"
# Existing SSH access only: explicitly provide trusted keys/known-hosts paths.
# Host connection addresses/users/keys normally come from the Kolla inventory.
ew_guest_ssh_user: ubuntu
ew_guest_ssh_key: ''
ew_guest_known_hosts: ''
ew_host_ssh_key: ''
ew_host_known_hosts: ''
ew_host_access: {}
ew_guest_direct_access: {}  # optional verified address keyed by exact server UUID
ew_namespace_hosts: []  # default network + compute inventory hosts
ew_baseline_seconds: 120
ew_maximum_lifetime_seconds: 3600
ew_drain_seconds: 30
ew_transport_timeout_seconds: 20
ew_collection_timeout_seconds: 300
ew_readiness_timeout_seconds: 120
ew_recovery_observation_seconds: 30
ew_probe_interval_seconds: 1
ew_api_probe_interval_seconds: 2
ew_max_jobs_per_second: 1
ew_task_slo_seconds: 10
ew_stable_samples: 5
ew_maximum_collection_bytes: 67108864
ew_tcp_experiment_enabled: true  # migration only, requires ew_workloads_enabled
ew_tcp_experiment_ports: [18080, 18081]  # must already be permitted; no SG changes
ew_mtu_preparation_pause: true  # same-run operator checkpoint after phase-06 network MTU update
ew_workload_config:
  image: ew-ubuntu-24.04-netfix
  flavor: ew.2c2g
  router: ew-router
  servers:
    - {name: ew-app, ip: 192.168.101.11, compute_host: compute1, network: ew-net-a}
    - {name: ew-client-a1, ip: 192.168.101.12, compute_host: compute1, network: ew-net-a}
    - {name: ew-client-a2, ip: 192.168.101.13, compute_host: compute2, network: ew-net-a}
    - {name: ew-queue, ip: 192.168.102.11, compute_host: compute1, network: ew-net-b}
    - {name: ew-db, ip: 192.168.102.12, compute_host: compute2, network: ew-net-b}
    - {name: ew-client-b, ip: 192.168.102.13, compute_host: compute2, network: ew-net-b}
  endpoints:
    api: {host: 192.168.101.11, port: 8080}
    postgresql: {host: 192.168.102.12, port: 5432}
    rabbitmq: {host: 192.168.102.11, port: 5672}
