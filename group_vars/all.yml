---
# V2 is designed to require no per-cloud file edits for the tested/supported scope.
# It auto-discovers the Kolla inventory path, kolla-ansible binary, source globals,
# control/OVN hosts, generated OVN DB endpoints, source resource IDs and network MTUs.

# Standard Kolla locations. Override only through environment variables when a
# deployment intentionally uses non-standard paths.
kolla_globals_path: "{{ lookup('env', 'KOLLA_GLOBALS') | default('/etc/kolla/globals.yml', true) }}"
openrc_path: "{{ lookup('env', 'KOLLA_OPENRC') | default('/etc/kolla/admin-openrc.sh', true) }}"
migration_backup_root: "{{ lookup('env', 'OVS_TO_OVN_BACKUP_ROOT') | default('/root/ovs-to-ovn-backup', true) }}"

# Supported/tested scope.
supported_openstack_release: "2024.1"
supported_kolla_ansible_regex: '.*18\.8(\.|$).*'
supported_ubuntu_release: "24.04"
source_neutron_plugin_agent: openvswitch
source_tenant_network_type: vxlan
target_neutron_plugin_agent: ovn
target_tenant_network_type: geneve
neutron_type_drivers_target: "flat,vlan,vxlan,geneve"

# VXLAN -> Geneve adds 8 bytes in the tested Neutron/Kolla configuration
# (this nested lab: VXLAN network MTU 1400 -> Geneve-safe 1392
# on a 1450-byte tunnel transport).
# Existing VXLAN networks are reduced individually by this delta; there is no
# hard-coded target requirement, so larger-MTU clouds are handled proportionally.
mtu_delta_vxlan_to_geneve: 8

# Kolla systemd units.
neutron_server_unit: kolla-neutron_server-container.service
legacy_network_units:
  - kolla-neutron_dhcp_agent-container.service
  - kolla-neutron_l3_agent-container.service
  - kolla-neutron_metadata_agent-container.service
  - kolla-neutron_openvswitch_agent-container.service
legacy_compute_units:
  - kolla-neutron_openvswitch_agent-container.service

# ML2/OVS can leave br-int restricted to OF <= 1.4. OVN controller in the
# validated environment needs OF1.5 negotiation; add support before freeze and
# only verify the prepared protocol set at cutover.
br_int_protocols: "OpenFlow10,OpenFlow11,OpenFlow12,OpenFlow13,OpenFlow14,OpenFlow15"

# Optional rollback preparation. Enable only before starting a new run.
migration_rollback_enabled: false
# Full-cluster MariaDB backup follows the rollback profile by default.
# Override independently; the frozen Neutron checkpoint is mandatory when
# migration_rollback_enabled=true even if this physical backup is disabled.
run_mariadb_backup: "{{ migration_rollback_enabled | bool }}"

# Dynamic Port_Binding convergence timeout. Large clouds get more time without
# requiring an edit. timeout = base + seconds_per_port * old_compute_ports,
# capped at max.
binding_timeout_base_seconds: 300
binding_timeout_seconds_per_port: 2
binding_timeout_max_seconds: 1800
binding_poll_interval_seconds: 5
metadata_readiness_timeout_seconds: 300

# Automatic post-migration control-plane smoke test. It creates a temporary
# network, asserts that it is Geneve, then deletes it. No VM/image/flavor is
# required and no permanent tenant resource is left behind.
validation_ephemeral_network: true

# Guest VM1 tenant ICMP interval.
dataplane_probe_interval_seconds: 0.2

# Workload POC: UUID or unambiguous name. Ubuntu cloud images must already
# contain cloud-init, Python3, ping, iproute2, systemd and ttyS0 support.
validation_workloads_enabled: true
# Default validation creates only the ICMP measurement VMs (EW and NS).
# False restores the separate DHCP/metadata and fresh-provisioning pairs.
validation_ping_only: false
# Both members of every pair must run on these distinct inventory computes.
validation_pair_compute_hosts: []  # Auto-select two ready inventory computes; explicit pair is supported.
# TCP is opt-in and requires validation_ping_only=false.
validation_pair_d_enabled: false
validation_tcp_old_port: 18080
validation_tcp_new_port: 18081
validation_tcp_control_port: 18082
validation_tcp_interval_seconds: 0.5
validation_tcp_timeout_seconds: 1.0
validation_image: "{{ lookup('env', 'MIGRATION_VALIDATION_IMAGE') | default('', true) }}"
validation_flavor: "{{ lookup('env', 'MIGRATION_VALIDATION_FLAVOR') | default('', true) }}"
validation_name_prefix: validation
validation_pre_cidrs: ['10.231.0.0/24', '10.231.1.0/24']
validation_post_cidrs: ['10.232.0.0/24', '10.232.1.0/24']
validation_timeout_seconds: 400
validation_probe_lifetime_seconds: 14400
validation_console_poll_seconds: 2
# ~65 minutes of VM1 packet/health records at the default 5 packets/s.
# Nova may retain fewer lines: missing anchored sequences remain UNAVAILABLE.
validation_console_tail_lines: 20000

# Empty image/flavor overrides select automatically prepared reusable defaults.
validation_managed_image_name: ovn-validation-ubuntu-24.04
validation_managed_image_url: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
validation_managed_flavor_name: ovn-validation.small
validation_image_cache_dir: /var/cache/ovs-to-ovn-validation
validation_image_download_timeout_seconds: 120
validation_image_active_timeout_seconds: 900
# Shared prerequisites are intentionally not part of normal workload cleanup.
# True is rejected before migration; remove shared resources explicitly instead.
validation_cleanup_prerequisites: false

# DHCP option 58 on owned validation ports, before their first lease.
validation_dhcp_t1_seconds: 30
# Bound rebinding to the new server after OVS DHCP disappears.
validation_dhcp_t2_seconds: 60
# Allow small scheduling/network delays in the observed renewal cadence.
validation_dhcp_renewal_tolerance_seconds: 5
validation_dhcp_convergence_timeout: 180
# Allow guarded remediation only for validation-owned Pair B in this lab.
# Pair A and Pair D are never rebooted; true does not force a reboot.
validation_allow_pre_cutover_guest_reboot: true
# Independently allow guarded owned Pair-B remediation after OVN takeover.
validation_allow_post_cutover_guest_reboot: true
validation_post_cutover_dhcp_timeout_seconds: 180
# Persistent compute-local evidence, retained until successful final report.
validation_capture_directory: /var/lib/ovn-migration-validation
# Nested lab: eth1 MTU 1450, VXLAN tenant MTU 1400 -> Geneve MTU 1392.
target_geneve_mtu: 1392

# NS lab defaults are in group_vars/ns-lab.yml.
validation_ns_enabled: "{{ ns_enabled }}"

# Host-side observers; byte/time limits never overwrite earlier evidence.
migration_diagnostics_enabled: false
migration_diagnostics_directory: /var/lib/ovn-migration-diagnostics
migration_diagnostics_lifetime_seconds: 18000
migration_diagnostics_max_bytes: 268435456
migration_diagnostics_reconnect_attempts: 8
migration_diagnostics_reconnect_window_seconds: 60
migration_diagnostics_external_interface: ns-ex

# Workflow barrier only; original PCAP/monotonic evidence still defines downtime.
post_restore_observation_timeout_seconds: 300

# Node-independent migration settings; optional interface overrides belong in host_vars.
# migration_tunnel_interface / migration_external_interface / migration_expected_tunnel_address
# otherwise use the rendered Kolla settings and effective OVS agent tunnel IP.
chassis_registration_timeout_seconds: 300
