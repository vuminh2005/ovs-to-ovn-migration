---
- name: Work Item 2 - Explicit generation-aware OVS reset and EW rebuild
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  become: true
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Refuse partial invocation or an unspecified reset generation
      ansible.builtin.assert:
        that:
          - reset_action in ['preflight', 'apply', 'continue', 'reconcile', 'accept']
          - reset_generation | length > 0
          - ansible_limit | default('') | length == 0
          - ansible_run_tags == ['all']
          - ansible_skip_tags | length == 0
          - ansible_inventory_sources | length == 1
          - groups['all'] | difference(groups['control'] + groups['network'] + groups['compute'] + ['localhost']) | length == 0
          - "'localhost' not in groups['all'] or hostvars['localhost'].ansible_connection | default('local') == 'local'"
        fail_msg: Use one complete inventory, an explicit reset_generation and docs-reset-ew.md; no limits/tags or partial reset are supported.

    - name: Load retained private access and credential-path mappings without printing them
      ansible.builtin.include_vars:
        file: "{{ item }}"
      loop: ["{{ reset_access_file }}", "{{ reset_credentials_file }}"]
      no_log: true

    - name: Allocate a private temporary resolved invocation outside cloud storage
      ansible.builtin.tempfile:
        state: file
        prefix: ovs-reset-spec-
      register: reset_spec_temporary
      no_log: true

    - name: Resolve effective reset and existing provisioning interfaces
      block:
        - name: Persist paths and effective overrides only; never inline secret values
          ansible.builtin.copy:
            dest: "{{ reset_spec_temporary.path }}"
            mode: '0600'
            content: >-
              {{ {'generation': reset_generation, 'generation_root': reset_generation_root,
                  'hosts': ((groups['control'] + groups['network'] + groups['compute']) | unique | list),
                  'control': groups['control'], 'network': groups['network'], 'compute': groups['compute'],
                  'inventory': reset_kolla_inventory, 'invocation_inventory': ansible_inventory_sources[0],
                  'kolla_venv': reset_kolla_venv, 'globals_path': reset_globals_path,
                  'config_path': reset_config_path, 'passwords': reset_passwords_path,
                  'openrc': openrc_path, 'source_globals': reset_source_globals, 'source_config': reset_source_config,
                  'delete_backups': reset_delete_migration_backups | bool, 'backup_root': reset_backup_root,
                  'snapshot_root': reset_snapshot_root, 'capture_root': validation_capture_directory,
                  'evidence_root': migration_backup_root, 'old_state': ew_provision_state_dir,
                  'old_guest_known_hosts': ew_guest_known_hosts, 'guest_key': ew_guest_ssh_key,
                  'host_known_hosts': ew_host_known_hosts,
                  'host_keys': ([ew_host_ssh_key] + (ew_host_access.values() | map(attribute='key', default='') | list)),
                  'required_paths': reset_required_retained_paths + ([ew_provision_spec_file] if ew_provision_spec_file | length > 0 else []),
                  'host_protected': reset_host_protected_paths, 'underlay_mtu': reset_expected_underlay_mtu | int,
                  'access_file': reset_access_file, 'credentials_file': reset_credentials_file,
                  'private_dir': ew_provision_private_dir, 'bootstrap_reference': ew_bootstrap_reference_file,
                  'provision_spec': (lookup('file', ew_provision_spec_file) | from_json) if ew_provision_spec_file | length > 0 else ew_provision_spec,
                  'topology': ew_workload_config,
                  'forward': {'ew_workload_config': ew_workload_config,
                    'ew_guest_ssh_user': ew_guest_ssh_user, 'ew_guest_ssh_key': ew_guest_ssh_key,
                    'ew_host_ssh_key': ew_host_ssh_key, 'ew_host_known_hosts': ew_host_known_hosts,
                    'ew_host_access': ew_host_access, 'ew_guest_direct_access': ew_guest_direct_access,
                    'ew_namespace_hosts': ew_namespace_hosts, 'ew_provision_timeout_seconds': ew_provision_timeout_seconds,
                    'ew_provision_availability_zone': ew_provision_availability_zone,
                    'mtu_kolla_ml2_template_path': mtu_kolla_ml2_template_path,
                    'ew_tcp_experiment_ports': ew_tcp_experiment_ports,
                    'ew_stable_samples': ew_stable_samples, 'ew_recovery_observation_seconds': ew_recovery_observation_seconds,
                    'ew_readiness_timeout_seconds': ew_readiness_timeout_seconds, 'ew_drain_seconds': ew_drain_seconds,
                    'ew_baseline_seconds': ew_baseline_seconds, 'ew_maximum_lifetime_seconds': ew_maximum_lifetime_seconds,
                    'ew_transport_timeout_seconds': ew_transport_timeout_seconds, 'ew_collection_timeout_seconds': ew_collection_timeout_seconds,
                    'ew_probe_interval_seconds': ew_probe_interval_seconds, 'ew_api_probe_interval_seconds': ew_api_probe_interval_seconds,
                    'ew_max_jobs_per_second': ew_max_jobs_per_second, 'ew_task_slo_seconds': ew_task_slo_seconds,
                    'ew_maximum_collection_bytes': ew_maximum_collection_bytes,
                    'ew_tcp_experiment_enabled': ew_tcp_experiment_enabled}} | to_nice_json }}
          no_log: true

        - name: Execute only the selected controller workflow action
          ansible.builtin.command:
            argv: >-
              {{ [reset_kolla_venv + '/bin/python', playbook_dir + '/scripts/reset_workflow.py',
                  reset_action, reset_spec_temporary.path] + (['--confirm'] if reset_lab_confirm | bool else []) }}
          register: reset_workflow_result
          changed_when: reset_action in ['apply', 'continue', 'reconcile']
          no_log: true

        - name: Show non-secret generation evidence and subsequent workflow variables
          ansible.builtin.debug:
            msg: "{{ reset_workflow_result.stdout | from_json }}"
      rescue:
        - name: Explain the private journal and fail without another destructive attempt
          ansible.builtin.fail:
            msg: >-
              Reset {{ reset_action }} failed. Inspect {{ reset_generation_root }}/{{ reset_generation }}/journal.json
              and its private stage logs locally. No automatic destroy retry or baseline/migration is authorized.
              See docs-reset-ew.md for continuation and read-only reconciliation.
              {{ reset_workflow_result.stderr | default('Resolved input preparation failed; inspect private inputs locally.') }}
      always:
        - name: Remove only this invocation's private temporary specification
          ansible.builtin.file:
            path: "{{ reset_spec_temporary.path }}"
            state: absent
          no_log: true
