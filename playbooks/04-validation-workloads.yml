---
- name: Phase 04 - Prepare routed guest validation before migration downtime
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: Mark phase 04 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '04'
          - start
      run_once: true
      changed_when: false

    - name: Verify resolved prerequisites and validation topology settings
      ansible.builtin.assert:
        that:
          - validation_prerequisites_runtime.image.id | length > 0
          - validation_prerequisites_runtime.flavor.id | length > 0
          - validation_pre_cidrs | length == 2
          - validation_post_cidrs | length == 2
          - dataplane_probe_interval_seconds | float >= 0.1
          - validation_console_tail_lines | int > 0
          - validation_dhcp_t1_seconds | int > 0
          - validation_dhcp_t2_seconds | int > validation_dhcp_t1_seconds | int
          - validation_dhcp_renewal_tolerance_seconds | float >= 0
          - validation_dhcp_convergence_timeout | int > 0
          - validation_post_cutover_dhcp_timeout_seconds | int > 0
          - validation_capture_directory is match("^/")
        fail_msg: Validation prerequisites must be resolved by 03-validation-prerequisites.yml; check topology settings.
      when: validation_workloads_enabled | bool

    - name: Load authoritative compute placement resolved during precheck
      ansible.builtin.set_fact:
        validation_placement_runtime: "{{ lookup('file', migration_run_dir + '/validation-placement.json') | from_json }}"
      when: validation_workloads_enabled | bool

    - name: Save non-secret guest validation configuration
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/validation-config.json"
        mode: '0600'
        content: "{{ {'run': migration_run_id, 'ew_matrix_enabled': validation_ew_matrix_enabled | bool, 'ns': {'enabled': validation_ns_enabled | bool, 'diagnostics_enabled': ns_diagnostics_enabled | bool, 'preserve_snat_source_port': ns_preserve_snat_source_port | bool, 'capture_interface': ns_capture_interface, 'network_hosts': groups['network'], 'endpoint_ip': ns_endpoint_ip, 'external_cidr': ns_external_cidr, 'external_gateway': ns_external_gateway, 'snat_ip': ns_router_ip, 'fip_ip': ns_floating_ip, 'physnet': ns_physnet, 'mtu': ns_underlay_mtu | int, 'tenant_cidr': ns_tenant_cidr, 'outbound_ip': ns_outbound_ip, 'inbound_ip': ns_inbound_ip, 'port': ns_tcp_port | int, 'new_port': ns_tcp_new_port | int, 'control_port': ns_tcp_control_port | int, 'icmp_enabled': ns_icmp_enabled | bool, 'icmp_sender_logging_enabled': true, 'icmp_sender_export_enabled': true}, 'placement_enabled': true, 'placement': validation_placement_runtime, 'pair_d_enabled': validation_pair_d_enabled | bool, 'pair_d_network_host': groups['network'][0], 'tcp_old_port': validation_tcp_old_port | int, 'tcp_new_port': validation_tcp_new_port | int, 'tcp_control_port': validation_tcp_control_port | int, 'tcp_interval': validation_tcp_interval_seconds | float, 'tcp_timeout': validation_tcp_timeout_seconds | float, 'image': validation_prerequisites_runtime.image.id, 'flavor': validation_prerequisites_runtime.flavor.id, 'prefix': validation_name_prefix, 'cidrs': {'pre': validation_pre_cidrs, 'post': validation_post_cidrs}, 'interval': dataplane_probe_interval_seconds | float, 'lifetime': validation_probe_lifetime_seconds | int, 'timeout': validation_timeout_seconds | int, 'console_interval': validation_console_poll_seconds | float, 'console_tail_lines': validation_console_tail_lines | int, 'dhcp_t1': validation_dhcp_t1_seconds | int, 'dhcp_t2': validation_dhcp_t2_seconds | int, 'dhcp_renewal_tolerance': validation_dhcp_renewal_tolerance_seconds | float, 'dhcp_timeout': validation_dhcp_convergence_timeout | int, 'target_mtu': target_geneve_mtu | int, 'source_mtu': (target_geneve_mtu | int) + (mtu_delta_vxlan_to_geneve | int), 'allow_pre_cutover_guest_reboot': validation_allow_pre_cutover_guest_reboot | bool, 'allow_post_cutover_guest_reboot': validation_allow_post_cutover_guest_reboot | bool, 'post_cutover_timeout': validation_post_cutover_dhcp_timeout_seconds | int, 'post_cutover_dhcp_enabled': true, 'capture_enabled': true, 'capture_directory': validation_capture_directory, 'inventory': kolla_inventory_runtime, 'ovn_cli_host': ovn_cli_host_runtime} | to_nice_json }}"
      when:
        - validation_workloads_enabled | bool
        - not (validation_retry_preparation_runtime | default(false) | bool)

    - name: Persist host observer settings for this run
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/diagnostics-config.json"
        mode: '0600'
        content: "{{ {'enabled': migration_diagnostics_enabled | bool, 'sampling_scope': 'outside-cutover', 'directory': migration_diagnostics_directory, 'lifetime': migration_diagnostics_lifetime_seconds | int, 'max_bytes': migration_diagnostics_max_bytes | int, 'reconnect_attempts': migration_diagnostics_reconnect_attempts | int, 'reconnect_window_seconds': migration_diagnostics_reconnect_window_seconds | int, 'tunnel_interface': hostvars['localhost'].get('source_kolla_globals', {}).get('tunnel_interface', 'eth1'), 'external_interface': migration_diagnostics_external_interface, 'ns_enabled': validation_ns_enabled | bool, 'endpoint_ip': ns_endpoint_ip, 'old_port': ns_tcp_port | int, 'new_port': ns_tcp_new_port | int} | to_nice_json }}"
    - name: Start bounded host observers before workload creation
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/diagnostics_control.py", start, "{{ migration_run_dir }}", --role, core]
      changed_when: false
      when: migration_diagnostics_enabled | bool

    - name: Start EW matrix and NS continuity probes prepare DHCP workload and EW TCP
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} pre {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Retain initial workload checks separately
      ansible.builtin.copy:
        src: "{{ migration_run_dir }}/pre-workload-checks.json"
        dest: "{{ migration_run_dir }}/initial-workload-checks.json"
        remote_src: true
        mode: '0600'
      when: validation_workloads_enabled | bool

    - name: Start secondary guest health console collection before downtime
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        nohup python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} collect {{ migration_run_dir | quote }} > {{ (migration_run_dir + '/collector.log') | quote }} 2>&1 < /dev/null &
        echo "$!" > {{ (migration_run_dir + '/collector.pid') | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Refresh preservation baseline including pre-migration validation VMs
      ansible.builtin.include_tasks: validation-snapshot-tasks.yml
      when: validation_workloads_enabled | bool

    - name: Capture existing network segment semantics before authoritative migration
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/network_semantics.py') | quote }} before {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash

    - name: Mark phase 04 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '04'
          - end
      run_once: true
      changed_when: false
