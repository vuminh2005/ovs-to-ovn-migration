---
- name: Phase 04 - Prepare routed guest validation before migration downtime
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 04 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '04'
          - start
      run_once: true
      changed_when: false

    - name: Verify resolved prerequisites and validation topology settings
      ansible.builtin.assert:
        that:
          - validation_prerequisites_runtime.image.id | length > 0
          - validation_prerequisites_runtime.flavor.id | length > 0
          - validation_pre_cidrs | length == 2
          - validation_post_cidrs | length == 2
          - dataplane_probe_interval_seconds | float >= 0.1
          - validation_console_tail_lines | int > 0
          - validation_dhcp_t1_seconds | int > 0
          - validation_dhcp_t2_seconds | int > validation_dhcp_t1_seconds | int
          - validation_dhcp_renewal_tolerance_seconds | float >= 0
          - validation_dhcp_convergence_timeout | int > 0
          - validation_post_cutover_dhcp_timeout_seconds | int > 0
          - validation_capture_directory is match("^/")
          - mtu_calculation_runtime.validation_source_mtu | int > 0
          - mtu_calculation_runtime.validation_target_mtu | int > 0
          - validation_compute_hosts.fresh | length == 2
          - validation_compute_hosts.fresh[0] != validation_compute_hosts.fresh[1]
          - validation_compute_hosts.fresh | difference(groups['compute']) | length == 0
          - validation_compute_hosts.measure | difference(groups['compute']) | length == 0
          - validation_compute_hosts.existing | difference(groups['compute']) | length == 0
        fail_msg: Resolve image/flavor and calculated MTUs before provisioning; requested validation hosts must belong to the inventory compute group. Check topology settings.
      when: validation_workloads_enabled | bool

    - name: Save non-secret guest validation configuration
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/validation-config.json"
        mode: '0600'
        content: "{{ {'run': migration_run_id, 'image': validation_prerequisites_runtime.image.id, 'flavor': validation_prerequisites_runtime.flavor.id, 'prefix': validation_name_prefix, 'cidrs': {'pre': validation_pre_cidrs, 'post': validation_post_cidrs}, 'interval': dataplane_probe_interval_seconds | float, 'lifetime': validation_probe_lifetime_seconds | int, 'timeout': validation_timeout_seconds | int, 'console_interval': validation_console_poll_seconds | float, 'console_tail_lines': validation_console_tail_lines | int, 'dhcp_t1': validation_dhcp_t1_seconds | int, 'dhcp_t2': validation_dhcp_t2_seconds | int, 'dhcp_renewal_tolerance': validation_dhcp_renewal_tolerance_seconds | float, 'dhcp_timeout': validation_dhcp_convergence_timeout | int, 'mtu_schema_version': 1, 'target_mtu': mtu_calculation_runtime.validation_target_mtu | int, 'source_mtu': mtu_calculation_runtime.validation_source_mtu | int, 'compute_hosts': validation_compute_hosts, 'availability_zone': validation_availability_zone, 'placement_required': true, 'ew_workloads_enabled': ew_workloads_enabled | bool, 'ew_workload_config': ew_workload_config, 'allow_pre_cutover_guest_reboot': validation_allow_pre_cutover_guest_reboot | bool, 'allow_post_cutover_guest_reboot': validation_allow_post_cutover_guest_reboot | bool, 'post_cutover_timeout': validation_post_cutover_dhcp_timeout_seconds | int, 'post_cutover_dhcp_enabled': true, 'capture_enabled': true, 'capture_directory': validation_capture_directory, 'inventory': kolla_inventory_runtime, 'ovn_cli_host': ovn_cli_host_runtime} | to_nice_json }}"
      when: validation_workloads_enabled | bool

    - name: Start continuous Pair A measurement then prepare existing Pair B workloads
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} pre {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Retain initial workload checks separately
      ansible.builtin.copy:
        src: "{{ migration_run_dir }}/pre-workload-checks.json"
        dest: "{{ migration_run_dir }}/initial-workload-checks.json"
        remote_src: true
        mode: '0600'
      when: validation_workloads_enabled | bool

    - name: Start secondary guest health console collection before downtime
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        nohup python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} collect {{ migration_run_dir | quote }} > {{ (migration_run_dir + '/collector.log') | quote }} 2>&1 < /dev/null &
        echo "$!" > {{ (migration_run_dir + '/collector.pid') | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Refresh preservation baseline including pre-migration validation VMs
      ansible.builtin.include_tasks: validation-snapshot-tasks.yml
      when: validation_workloads_enabled | bool

    - name: Capture existing network segment semantics before authoritative migration
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/network_semantics.py') | quote }} before {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash

    - name: Configure optional EW measurement using checkpointed external resources
      ansible.builtin.include_tasks: ew-config-tasks.yml
      when: ew_workloads_enabled | bool

    - name: Verify six EW guests and start independent continuous application measurement
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/ew_workload.py') | quote }} start {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: ew_workloads_enabled | bool

    - name: Mark phase 04 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '04'
          - end
      run_once: true
      changed_when: false
