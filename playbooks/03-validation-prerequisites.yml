- name: "Phase 03 - Prepare validation image and flavor"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[03] [TIMER] Start phase 03"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '03'
          - start
      run_once: true
      changed_when: false

    - name: "[03] Check reusable image and flavor retention"
      ansible.builtin.assert:
        that:
          - not (validation_cleanup_prerequisites | bool)
        fail_msg: Automatic prerequisite deletion is not supported; retain the shared image/flavor and remove explicitly if needed.
      when: validation_workloads_enabled | bool

    - name: "[03] [SAVE] Save image and flavor preparation settings"
      ansible.builtin.copy:
        dest: "{{ migration_run_dir | run_file('validation-prerequisites-config.json') }}"
        mode: '0600'
        content: "{{ {'image': validation_image, 'flavor': validation_flavor, 'managed_image_name': validation_managed_image_name, 'managed_flavor_name': validation_managed_flavor_name,
          'image_url': validation_managed_image_url, 'cache_dir': validation_image_cache_dir, 'download_timeout': validation_image_download_timeout_seconds | int,
          'image_active_timeout': validation_image_active_timeout_seconds | int} | to_nice_json }}"
      when: validation_workloads_enabled | bool

    - name: "[03] Prepare and verify validation image and flavor"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/validation_prerequisites.py') | quote }} {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: "[03] Load resolved image and flavor IDs"
      ansible.builtin.set_fact:
        validation_prerequisites_runtime: "{{ lookup('file', (migration_run_dir | run_file('validation-prerequisites.json'))) | from_json }}"
      when: validation_workloads_enabled | bool

    - name: "[03] [TIMER] End phase 03"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '03'
          - end
      run_once: true
      changed_when: false
