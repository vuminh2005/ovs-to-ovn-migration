---
- name: Phase 11 - Validate state consistency and ML2/OVN control plane
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 11 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '11'
          - start
      run_once: true
      changed_when: false

    - name: Observe recovery of original continuity traffic before AFTER snapshots or new resources
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/live_recovery.py') | quote }} {{ migration_run_dir | quote }} --timeout {{ post_restore_observation_timeout_seconds | int }}
      args:
        executable: /bin/bash
      changed_when: false
      when:
        - validation_workloads_enabled | bool
        - lookup('fileglob', migration_run_dir + '/metrics/phase11.end') | length == 0

    - name: Resume supplementary diagnostic sampling only after traffic recovery
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/diagnostics_control.py", snapshot,
               "{{ migration_run_dir }}", --label, post-traffic-recovery]
      changed_when: false
      failed_when: false
      when: migration_diagnostics_enabled | bool

    - name: Snapshot post-migration resources before creating any smoke-test resource
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        openstack network list -f json > {{ migration_run_dir }}/networks.after.json
        openstack subnet list -f json > {{ migration_run_dir }}/subnets.after.json
        openstack router list -f json > {{ migration_run_dir }}/routers.after.json
        openstack server list --all-projects -f json > {{ migration_run_dir }}/servers.after.json
        openstack port list -f json > {{ migration_run_dir }}/ports.after.json
        openstack port list --device-owner compute:nova -f json > {{ migration_run_dir }}/compute-ports.after.json
        openstack network agent list -f json > {{ migration_run_dir }}/agents.after.json
      args:
        executable: /bin/bash
      changed_when: false

    - name: Compare critical resource identity sets before and after migration
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import json, pathlib, sys
        root = pathlib.Path("{{ migration_run_dir }}")
        pairs = {
          'networks': ('networks.before.json','networks.after.json'),
          'subnets': ('subnets.before.json','subnets.after.json'),
          'routers': ('routers.before.json','routers.after.json'),
          'servers': ('servers.before.json','servers.after.json'),
          'compute_ports': ('compute-ports.before.json','compute-ports.after.json'),
        }
        result = {}
        ok = True
        # A late retry may retain the retained fresh validation pair.
        # Exclude only its checkpointed UUIDs from additions; all original
        # identities and all unrelated additions remain guarded.
        state_path = root/'validation-resources.json'
        state = json.loads(state_path.read_text()) if state_path.exists() else {}
        post = state.get('post', {})
        owned = {k:set() for k in pairs}
        if post.get('router'): owned['routers'].add(post['router'])
        fresh = post.get('fresh', post)
        for vm in (fresh.get('0', {}), fresh.get('1', {})):
          for kind, field in [('networks','network'),('subnets','subnet'),('servers','server'),('compute_ports','port')]:
            if vm.get(field): owned[kind].add(vm[field])
        for key,(bf,af) in pairs.items():
          b = json.loads((root/bf).read_text())
          a = json.loads((root/af).read_text())
          def ids(rows):
            out=set()
            for r in rows:
              v = r.get('ID') or r.get('Id') or r.get('id')
              if v: out.add(v)
            return out
          bi, ai = ids(b), ids(a)
          excluded = sorted((ai-bi) & owned[key])
          missing = sorted(bi-ai)
          added = sorted((ai-bi)-owned[key])
          result[key] = {'before':len(bi),'after':len(ai),'missing':missing,'added':added,'preserved':not missing,'unchanged':not missing and not added,'owned_post_validation_excluded':excluded}
          if missing or added: ok=False
        (root/'resource-consistency.json').write_text(json.dumps(result, indent=2, sort_keys=True))
        if not ok:
          print(json.dumps(result, indent=2), file=sys.stderr)
          sys.exit(1)
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify pre-existing demo VMs ports routers and FIP mappings remain intact
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/source_topology.py') | quote }} verify {{ migration_run_dir | quote }} --scope after-migration
      args:
        executable: /bin/bash
      changed_when: false
      when: (lookup('file', migration_run_dir + '/runtime.json', errors='ignore') | default('{}', true) | from_json).get('preexisting_preservation_enabled', false) or lookup('fileglob', migration_run_dir + '/source-topology-before.json') | length > 0

    - name: Automatically create and delete a temporary network to prove new tenant type is Geneve
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        name=ovn-migration-smoke-{{ migration_run_id }}
        id=$(openstack network create "$name" -f value -c id)
        trap 'openstack network delete "$id" >/dev/null 2>&1 || true' EXIT
        type=$(openstack network show "$id" -f value -c provider:network_type)
        mtu=$(openstack network show "$id" -f value -c mtu)
        test "$type" = geneve
        printf '{"network_id":"%s","network_type":"%s","mtu":%s}\n' "$id" "$type" "$mtu" > {{ migration_run_dir }}/new-network-smoke.json
      args:
        executable: /bin/bash
      when: validation_ephemeral_network | bool

- name: Phase 11 - Validate legacy dataplane is gone and OVN dataplane exists
  hosts: network:compute
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Assert br-tun is absent and an OVN Geneve interface exists
      ansible.builtin.shell: |
        set -euo pipefail
        ! docker exec openvswitch_vswitchd ovs-vsctl br-exists br-tun
        if [ {{ hostvars['localhost']['chassis_count_runtime'] | int }} -gt 1 ]; then
          docker exec openvswitch_vswitchd ovs-vsctl --columns=name,type list Interface | grep -A1 -E 'name[[:space:]]*: ovn-' | grep -F geneve >/dev/null
        fi
      args:
        executable: /bin/bash
      changed_when: false


- name: Phase 11 - Validate gateway role and legacy-agent shutdown
  hosts: network
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: Assert network chassis has gateway CMS option and no old namespaces
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec openvswitch_vswitchd ovs-vsctl get Open_vSwitch . external_ids:ovn-cms-options | grep -F enable-chassis-as-gw >/dev/null
        ! ip netns list | grep -E '^(qrouter-|qdhcp-)' >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify shared underlay and target OVN physnet gateway mapping
      ansible.builtin.command:
        argv: [python3, /root/ns-underlay-check.py, deployed, "{{ {'address': ns_underlay_ip, 'mtu': ns_underlay_mtu | int, 'physnet': ns_physnet, 'ovn': true} | to_json }}"]
      changed_when: false
      when: validation_ns_enabled | bool

- name: Phase 11 - Validate OVN metadata agents
  hosts: neutron-ovn-metadata-agent
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Assert OVN metadata container is running
      ansible.builtin.shell: |
        docker inspect neutron_ovn_metadata_agent | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
      changed_when: false

    - name: Mark phase 11 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '11'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
