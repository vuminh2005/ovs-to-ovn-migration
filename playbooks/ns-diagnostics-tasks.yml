---
- name: "[N-S] Manage N-S TCP captures and connection evidence"
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "[N-S] Create run-owned N-S capture directory"
      ansible.builtin.file:
        path: "{{ ns_diag_checkpoint.config.directory }}"
        state: directory
        mode: '0700'
      delegate_to: "{{ ns_diag_checkpoint.host }}"
      when: ns_diag_action in ['start', 'inspect']

    - name: "[N-S] Stage N-S diagnostic helpers"
      ansible.builtin.copy:
        src: "../scripts/{{ item }}"
        dest: "{{ ns_diag_checkpoint.config.directory }}/{{ item }}"
        mode: '0700'
      loop: [ns_diagnostics.py, dataplane_capture.py]
      delegate_to: "{{ ns_diag_checkpoint.host }}"
      when: ns_diag_action in ['start', 'inspect']

    - name: "[N-S] Run N-S capture control operation"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ ns_diag_checkpoint.config.directory }}/ns_diagnostics.py"
          - "agent-{{ ns_diag_action }}"
          - "{{ ns_diag_checkpoint.config.directory }}"
          - "{{ ns_diag_checkpoint.config | to_json }}"
      register: ns_diag_operation
      delegate_to: "{{ ns_diag_checkpoint.host }}"
      when: ns_diag_action != 'conntrack'

    - name: "[N-S] Read legacy and OVN connection tracking state"
      ansible.builtin.script:
        cmd: "../scripts/ns_diagnostics.py conntrack /tmp {{ ns_diag_checkpoint.config | to_json | quote }}"
        executable: python3
      register: ns_diag_conntrack
      delegate_to: "{{ ns_diag_checkpoint.host }}"
      when: ns_diag_action == 'conntrack'

    - name: "[N-S] [SAVE] Save N-S diagnostic result"
      ansible.builtin.copy:
        dest: "{{ ns_diag_operation_file }}"
        content: "{{ ns_diag_conntrack.stdout if ns_diag_action == 'conntrack' else ns_diag_operation.stdout }}"
        mode: '0600'

    - name: "[N-S] Fetch stopped N-S captures and logs"
      ansible.builtin.fetch:
        src: "{{ ns_diag_checkpoint.config.directory }}/{{ item }}"
        dest: "{{ ns_diag_local_directory }}/{{ item }}"
        flat: true
      loop: [tcp.pcap, tcpdump.log, tcp-capture-state.json, supervisor.log]
      delegate_to: "{{ ns_diag_checkpoint.host }}"
      when: ns_diag_action == 'stop' and ns_diag_checkpoint.kind != 'endpoint'
