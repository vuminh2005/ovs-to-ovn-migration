---
- name: Read only effective non-secret Neutron MTU and ML2 settings
  ansible.builtin.shell: |
    set -euo pipefail
    {% if mtu_config_mode == 'source' %}
    docker exec -i neutron_server python3 - <<'PYCODE'
    {% else %}
    python3 - <<'PYCODE'
    {% endif %}
    import configparser,datetime,json
    n=configparser.ConfigParser(interpolation=None); m=configparser.ConfigParser(interpolation=None)
    {% if mtu_config_mode == 'source' %}
    neutron='/etc/neutron/neutron.conf'; ml2='/etc/neutron/plugins/ml2/ml2_conf.ini'
    {% else %}
    neutron='/etc/kolla/neutron-server/neutron.conf'; ml2='/etc/kolla/neutron-server/ml2_conf.ini'
    {% endif %}
    with open(neutron) as stream: n.read_file(stream)
    with open(ml2) as stream: m.read_file(stream)
    settings=dict(global_physnet_mtu=n.getint('DEFAULT','global_physnet_mtu',fallback=1500),
        path_mtu=m.getint('ml2','path_mtu',fallback=0),
        overlay_ip_version=m.getint('ml2','overlay_ip_version',fallback=4),
        geneve_max_header_size=m.getint('ml2_type_geneve','max_header_size',fallback=30),
        mechanism_drivers=m.get('ml2','mechanism_drivers',fallback=''),
        tenant_network_types=m.get('ml2','tenant_network_types',fallback=''))
    {% if mtu_config_pre_freeze | default(false) %}
    print(json.dumps(dict(settings=settings,
        controller={{ inventory_hostname | to_json }},
        collection_id={{ hostvars['localhost']['mtu_pre_freeze_collection']['collection_id'] | to_json }},
        collected_at=datetime.datetime.now(datetime.timezone.utc).isoformat())))
    {% else %}
    print(json.dumps(settings))
    {% endif %}
    PYCODE
  args:
    executable: /bin/bash
  register: mtu_configuration_query
  changed_when: false

- name: Publish compact effective MTU settings for this controller
  ansible.builtin.set_fact:
    mtu_configuration_runtime: "{{ (mtu_configuration_query.stdout | from_json).settings if (mtu_config_pre_freeze | default(false) | bool) else (mtu_configuration_query.stdout | from_json) }}"

- name: Publish fresh pre-freeze controller identity settings and collection timestamp
  ansible.builtin.set_fact:
    mtu_pre_freeze_configuration_runtime: "{{ mtu_configuration_query.stdout | from_json }}"
  when: mtu_config_pre_freeze | default(false) | bool
