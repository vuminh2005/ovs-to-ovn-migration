---
- name: "Phase 05 - Deploy OVN central services alongside ML2/OVS"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[05] [TIMER] Start phase 05"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '05'
          - start
      run_once: true
      changed_when: false

    - name: "[05] Enable OVN services while keeping ML2/OVS active"
      ansible.builtin.lineinfile:
        path: "{{ kolla_globals_path }}"
        regexp: "^{{ item.key }}:"
        line: '{{ item.key }}: "{{ item.value }}"'
        insertafter: EOF
      loop:
        - { key: enable_ovn, value: 'yes' }
        - { key: neutron_plugin_agent, value: 'openvswitch' }

    - name: "[05] Prepare target container images before downtime"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/migration/prepare_migration_images.py"
          - "{{ migration_run_dir }}"
          - --kolla-ansible
          - "{{ kolla_ansible_bin_runtime }}"
          - --inventory
          - "{{ kolla_inventory_runtime }}"
          - --globals
          - "{{ kolla_globals_path }}"

    - name: "[05] Deploy OVN databases and northd"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} deploy --tags ovn-db
      args:
        executable: /bin/bash

- name: "Phase 05 - Check OVN central service"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[05] Check northd container is running"
      ansible.builtin.shell: |
        docker inspect ovn_northd | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"

    - name: "[05] [TIMER] End phase 05"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '05'
          - end
      run_once: true
      changed_when: false
