---
- name: Phase 05 - Stage OVN central while Neutron remains ML2/OVS
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 05 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '05'
          - start
      run_once: true
      changed_when: false

    - name: Enable OVN infrastructure but keep Neutron on OVS
      ansible.builtin.lineinfile:
        path: "{{ kolla_globals_path }}"
        regexp: "^{{ item.key }}:"
        line: '{{ item.key }}: "{{ item.value }}"'
        insertafter: EOF
      loop:
        - { key: enable_ovn, value: 'yes' }
        - { key: neutron_plugin_agent, value: 'openvswitch' }

    - name: Pull OVN DB images only
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} pull --tags ovn-db
      args:
        executable: /bin/bash

    - name: Deploy OVN NB/SB DB and northd only
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} deploy --tags ovn-db
      args:
        executable: /bin/bash

- name: Phase 05 - Verify OVN central process is present
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify northd container is running
      ansible.builtin.shell: |
        docker inspect ovn_northd | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"

    - name: Mark phase 05 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '05'
          - end
      run_once: true
      changed_when: false
