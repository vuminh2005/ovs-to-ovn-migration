---
- name: "[PAIR D] Check or arm Pair D probes"
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "[PAIR D] Send Pair D command through owned router"
      ansible.builtin.script:
        cmd: "../scripts/tcp_trigger.py {{ pair_d_trigger | to_json | quote }}"
        executable: python3
      delegate_to: "{{ pair_d_network_host }}"
      register: pair_d_arm
    - name: "[PAIR D] [SAVE] Save Pair D arm acknowledgement"
      ansible.builtin.copy:
        dest: "{{ pair_d_root }}/{{ pair_d_ack_filename }}"
        content: "{{ pair_d_arm.stdout | trim | from_json | to_nice_json }}"
        mode: '0600'
