---
- name: Request asynchronous read-only diagnostics checkpoint
  ansible.builtin.command:
    argv:
      - python3
      - "{{ playbook_dir }}/../scripts/diagnostics_control.py"
      - snapshot
      - "{{ hostvars['localhost']['migration_run_dir'] }}"
      - --label
      - "{{ diagnostic_checkpoint_label }}"
  delegate_to: localhost
  run_once: true
  changed_when: false
  failed_when: false
  when: migration_diagnostics_enabled | default(true) | bool
