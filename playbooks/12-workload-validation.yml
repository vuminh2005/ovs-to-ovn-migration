---
- name: Phase 12 - Collect OVN logical-switch and chassis encapsulation evidence
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 12 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '12'
          - start
      run_once: true
      changed_when: false

    - name: Read OVN logical switch names
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-nbctl --db={{ hostvars['localhost']['ovn_nb_connection_runtime'] | quote }} --format=json --columns=name list Logical_Switch
      args:
        executable: /bin/bash
      register: validation_switches
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Read registered chassis encapsulation types
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-sbctl --db={{ hostvars['localhost']['ovn_sb_connection_runtime'] | quote }} --format=json --columns=type list Encap
      args:
        executable: /bin/bash
      register: validation_encaps
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Persist OVN evidence on deployment host
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] }}/{{ item.name }}"
        content: "{{ item.content }}"
        mode: '0600'
      loop:
        - {name: ovn-logical-switches.json, content: "{{ validation_switches.stdout }}"}
        - {name: ovn-encaps.json, content: "{{ validation_encaps.stdout }}"}

- name: Phase 12 - Validate surviving and fresh workloads without automatic rollback
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Audit existing VXLAN to Geneve segment conversion
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/network_semantics.py') | quote }} after {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: semantics_result
      failed_when: false

    - name: Apply independent post-cutover remediation opt-in to persisted configuration
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} {{ (validation_allow_post_cutover_guest_reboot | bool | string) | quote }} {{ validation_post_cutover_dhcp_timeout_seconds | int }} {{ {'ovn_nb': ovn_nb_connection_runtime, 'ovn_sb': ovn_sb_connection_runtime, 'ovn_cli_host': ovn_cli_host_runtime, 'inventory': kolla_inventory_runtime} | to_json | quote }} <<'PYCODE'
        import json, pathlib, sys
        root=pathlib.Path(sys.argv[1]); path=root/'validation-config.json'
        cfg=json.loads(path.read_text())
        cfg.update(json.loads(sys.argv[4]))
        cfg.update(allow_post_cutover_guest_reboot=sys.argv[2].lower()=='true',
                   post_cutover_timeout=int(sys.argv[3]),post_cutover_dhcp_enabled=True)
        temp=path.with_suffix('.tmp'); temp.write_text(json.dumps(cfg,indent=2)); temp.chmod(0o600); temp.replace(path)
        PYCODE
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Recover Pair A packets validate Pair B and provision fresh Pair C
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} post {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: workload_result
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: Record orchestration failures for final report
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/validation-orchestration.json"
        mode: '0600'
        content: "{{ {'semantics_rc': semantics_result.rc, 'semantics_error': semantics_result.stderr, 'workload_rc': workload_result.rc | default(none), 'workload_error': workload_result.stderr | default('disabled')} | to_nice_json }}"

- name: Phase 12 - Verify fresh VM OVN Southbound bindings before cleanup
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Load fresh workload UUID checkpoint from deployment host
      ansible.builtin.set_fact:
        fresh_state: "{{ lookup('file', hostvars['localhost']['migration_run_dir'] + '/validation-resources.json', errors='ignore') | default('{}', true) | from_json }}"
    - name: Resolve fresh Pair C checkpoint with historical fallback
      ansible.builtin.set_fact:
        fresh_pair_checkpoint: "{{ fresh_state.get('post', {}).get('fresh', fresh_state.get('post', {})) }}"
    - name: Check each fresh port has an OVN chassis and up true
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-sbctl --db={{ hostvars['localhost']['ovn_sb_connection_runtime'] | quote }} --format=json --columns=chassis,up find Port_Binding logical_port={{ item | quote }} | python3 -c 'import json,sys; rows=json.load(sys.stdin)["data"]; assert len(rows)==1 and rows[0][0][0]=="uuid" and rows[0][1] is True'
      args:
        executable: /bin/bash
      loop: "{{ [fresh_pair_checkpoint.get('0', {}).get('port'), fresh_pair_checkpoint.get('1', {}).get('port')] | reject('equalto', none) | list if not fresh_state.get('post', {}).get('cleaned') else [] }}"
      register: fresh_bindings
      failed_when: false
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Persist fresh binding evidence
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] }}/post-ovn-bindings.json"
        mode: '0600'
        content: "{{ {'status': ('PASS' if (fresh_bindings.results | default([]) | length == 2 and fresh_bindings.results | map(attribute='rc') | select('equalto', 0) | list | length == 2) else 'UNAVAILABLE'), 'results': fresh_bindings.results | default([])} | to_nice_json }}"


- name: Phase 12 - Stop owned console collector after validation
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Stop only this run's Nova console collector after all validation evidence is collected
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} <<'PYCODE'
        import pathlib, sys, os, signal
        root = pathlib.Path(sys.argv[1])
        p = root/'collector.pid'
        if p.exists():
            pid = int(p.read_text())
            cmd = pathlib.Path('/proc')/str(pid)/'cmdline'
            if cmd.exists():
                parts = cmd.read_bytes().split(b'\0')
                if b'collect' in parts and str(root).encode() in parts and any(b'workload_validation.py' in x for x in parts):
                    os.kill(pid, signal.SIGTERM)
        PYCODE
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool


- name: Phase 12 - Finalize authoritative Pair A capture after all validation
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify independent fresh N-S recovery after restoration without application reconciliation dependency
      ansible.builtin.include_tasks: ns-operation-tasks.yml
      vars:
        ns_action: recovery
        ns_failure_is_evidence: true
      when: hostvars['localhost']['ns_enabled'] | default(false) | bool

    - name: Observe bounded EW recovery while existing continuous probes remain active
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/ew_workload.py') | quote }} recovery {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: ew_recovery_result
      failed_when: false  # retain failure evidence and complete the existing Pair-A capture/report flow
      when: ew_workloads_enabled | bool

    - name: Stop owned compute capture fetch raw PCAP and calculate strict metrics
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} capture-finish {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: capture_finish_result
      failed_when: false
      when: validation_workloads_enabled | bool
    - name: Preserve capture finalization failure as unavailable evidence
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} {{ (capture_finish_result.stderr | default('')) | quote }} <<'PYCODE'
        import json, pathlib, sys
        root=pathlib.Path(sys.argv[1]); path=root/'tenant-dataplane-probe.json'
        value=json.loads(path.read_text()) if path.exists() else {}
        if value.get('evidence_source')!='compute-tap-pcap': value={}
        value.update(status='UNAVAILABLE',evidence_source='compute-tap-pcap',measurement_workload='Pair A',
                     packet_loss_percent=None,actual_dataplane_outage_seconds=None,
                     reason=sys.argv[2] or value.get('reason','Capture finalization failed'))
        path.write_text(json.dumps(value,indent=2))
        PYCODE
      args:
        executable: /bin/bash
      when:
        - validation_workloads_enabled | bool
        - capture_finish_result.rc | default(0) != 0

    - name: Mark phase 12 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '12'
          - end
      run_once: true
      changed_when: false
