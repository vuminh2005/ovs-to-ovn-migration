- name: "Phase 12 - Collect OVN network evidence"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[12] [TIMER] Start phase 12"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '12'
          - start
      run_once: true
      changed_when: false

    - name: "[12] Read OVN logical switch names"
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-nbctl --db={{ hostvars['localhost']['ovn_nb_connection_runtime'] | quote }} --format=json --columns=name list Logical_Switch
      args:
        executable: /bin/bash
      register: validation_switches
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[12] Read OVN host encapsulation types"
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-sbctl --db={{ hostvars['localhost']['ovn_sb_connection_runtime'] | quote }} --format=json --columns=type list Encap
      args:
        executable: /bin/bash
      register: validation_encaps
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[12] [SAVE] Save OVN network evidence"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file(item.name) }}"
        content: "{{ item.content }}"
        mode: '0600'
      loop:
        - {name: ovn-logical-switches.json, content: "{{ validation_switches.stdout }}"}
        - {name: ovn-encaps.json, content: "{{ validation_encaps.stdout }}"}

- name: "Phase 12 - Validate existing and newly created workloads"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[12] Check VXLAN-to-Geneve segment conversion"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/network_semantics.py') | quote }} after {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: semantics_result
      failed_when: false

    - name: "[12] Load post-cutover remediation policy"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} {{ (validation_allow_post_cutover_guest_reboot | bool | string) | quote }} {{ validation_post_cutover_dhcp_timeout_seconds | int }} {{ {'ovn_nb': ovn_nb_connection_runtime, 'ovn_sb': ovn_sb_connection_runtime, 'ovn_cli_host': ovn_cli_host_runtime, 'inventory': kolla_inventory_runtime} | to_json | quote }} <<'PYCODE'
        import sys
        sys.path.insert(0, '{{ playbook_dir }}/../scripts')
        from run_layout import run_path, run_glob
        import json, pathlib, sys
        root=pathlib.Path(sys.argv[1]); path=run_path(root, 'validation-config.json')
        cfg=json.loads(path.read_text())
        cfg.update(json.loads(sys.argv[4]))
        cfg.update(allow_post_cutover_guest_reboot=sys.argv[2].lower()=='true',
                   post_cutover_timeout=int(sys.argv[3]),post_cutover_dhcp_enabled=True)
        temp=path.with_suffix('.tmp'); temp.write_text(json.dumps(cfg,indent=2)); temp.chmod(0o600); temp.replace(path)
        PYCODE
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: "[12] Validate existing EW/N-S traffic and create fresh workloads"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} post {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: workload_result
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: "[12] [SAVE] Record workload validation failures"
      ansible.builtin.copy:
        dest: "{{ migration_run_dir | run_file('validation-orchestration.json') }}"
        mode: '0600'
        content: "{{ {'semantics_rc': semantics_result.rc, 'semantics_error': semantics_result.stderr, 'workload_rc': workload_result.rc | default(none), 'workload_error':
          workload_result.stderr | default('disabled')} | to_nice_json }}"

- name: "Phase 12 - Check fresh VM port bindings before cleanup"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[12] Load fresh workload checkpoint"
      ansible.builtin.set_fact:
        fresh_state: "{{ lookup('file', (hostvars['localhost']['migration_run_dir'] | run_file('validation-resources.json')), errors='ignore') | default('{}', true)
          | from_json }}"
    - name: "[12] Resolve Group C resources with legacy checkpoint support"
      ansible.builtin.set_fact:
        fresh_pair_checkpoint: "{{ fresh_state.get('post', {}).get('fresh', fresh_state.get('post', {})) }}"
    - name: "[12] Check fresh VM ports are bound and up in OVN"
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-sbctl --db={{ hostvars['localhost']['ovn_sb_connection_runtime'] | quote }} --format=json --columns=chassis,up find Port_Binding logical_port={{ item | quote }} | python3 -c 'import json,sys; rows=json.load(sys.stdin)["data"]; assert len(rows)==1 and rows[0][0][0]=="uuid" and rows[0][1] is True'
      args:
        executable: /bin/bash
      loop: "{{ [fresh_pair_checkpoint.get('0', {}).get('port'), fresh_pair_checkpoint.get('1', {}).get('port')] | reject('equalto', none) | list if not fresh_state.get('post',
        {}).get('cleaned') else [] }}"
      register: fresh_bindings
      failed_when: false
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[12] [SAVE] Save fresh VM binding evidence"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('post-ovn-bindings.json') }}"
        mode: '0600'
        content: "{{ {'status': ('PASS' if (fresh_bindings.results | default([]) | length == 2 and fresh_bindings.results | map(attribute='rc') | select('equalto',
          0) | list | length == 2) else 'UNAVAILABLE'), 'results': fresh_bindings.results | default([])} | to_nice_json }}"


- name: "Phase 12 - Stop host observers and collect diagnostics"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[12] Stop observers and collect evidence on success or failure"
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/diagnostics_control.py", stop, "{{ migration_run_dir }}"]
      changed_when: false
      failed_when: false
      when: migration_diagnostics_enabled | bool

- name: "Phase 12 - Stop VM console health collection"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[12] Stop this run's VM console collector"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} <<'PYCODE'
        import sys
        sys.path.insert(0, '{{ playbook_dir }}/../scripts')
        from run_layout import run_path, run_glob
        import pathlib, sys, os, signal
        root = pathlib.Path(sys.argv[1])
        p = run_path(root, 'collector.pid')
        if p.exists():
            pid = int(p.read_text())
            cmd = pathlib.Path('/proc')/str(pid)/'cmdline'
            if cmd.exists():
                parts = cmd.read_bytes().split(b'\0')
                if b'collect' in parts and str(root).encode() in parts and any(b'workload_validation.py' in x for x in parts):
                    os.kill(pid, signal.SIGTERM)
        PYCODE
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool


- name: "Phase 12 - Finish packet captures and calculate traffic metrics"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[12] [SAVE] Collect post-validation N-S connection state"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/ns_diagnostics.py"
          - post-validation
          - "{{ migration_run_dir }}"
      register: ns_diag_snapshot_result
      changed_when: false
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: "[12] Stop and collect N-S TCP captures"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/ns_diagnostics.py"
          - finish
          - "{{ migration_run_dir }}"
      register: ns_diag_finish_result
      changed_when: false
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: "[12] Stop Group A capture, fetch PCAP and calculate metrics"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} capture-finish {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: capture_finish_result
      failed_when: false
      when: validation_workloads_enabled | bool
    - name: "[12] [SAVE] Record capture finalization failure"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} {{ (capture_finish_result.stderr | default('')) | quote }} <<'PYCODE'
        import sys
        sys.path.insert(0, '{{ playbook_dir }}/../scripts')
        from run_layout import run_path, run_glob
        import json, pathlib, sys
        root=pathlib.Path(sys.argv[1]); path=run_path(root, 'tenant-dataplane-probe.json')
        value=json.loads(path.read_text()) if path.exists() else {}
        if value.get('evidence_source')!='compute-tap-pcap': value={}
        value.update(status='UNAVAILABLE',evidence_source='compute-tap-pcap',measurement_workload='Pair A',
                     packet_loss_percent=None,actual_dataplane_outage_seconds=None,
                     reason=sys.argv[2] or value.get('reason','Capture finalization failed'))
        path.write_text(json.dumps(value,indent=2))
        PYCODE
      args:
        executable: /bin/bash
      when:
        - validation_workloads_enabled | bool
        - capture_finish_result.rc | default(0) != 0

    - name: "[12] [TIMER] End phase 12"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '12'
          - end
      run_once: true
      changed_when: false
