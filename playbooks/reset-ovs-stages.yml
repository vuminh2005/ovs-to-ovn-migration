---
- name: Work Item 2 - Require a selected generation journal before internal stages
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
  - name: Require internal workflow variables
    ansible.builtin.assert:
      that:
      - reset_stage is defined
      - reset_generation_dir is defined
      - reset_bound_spec is defined
  - name: Require a durable started operation or a completed deployment readiness boundary
    ansible.builtin.shell: |
      set -euo pipefail
      python3 - {{ reset_generation_dir | quote }} {{ reset_stage | quote }} <<'PY'
      import json,pathlib,sys
      root=pathlib.Path(sys.argv[1]); stage=sys.argv[2]
      journal=json.loads((root/'journal.json').read_text())
      assert journal['schema_version']==1
      if stage=='source-ready':
          assert all(journal['stages'][s]['status']=='COMPLETE' for s in ('destroy','post-deploy'))
      else:
          assert journal['stages'][stage]['status']=='STARTED', 'Not a journal-authorized started operation'
      PY
    args:
      executable: /bin/bash
    changed_when: false
  - name: Read authoritative retained source settings
    ansible.builtin.set_fact:
      reset_source_settings: '{{ lookup(''file'', reset_bound_spec.source_globals) | from_yaml }}'
  - name: Publish source settings for remote residue checks
    ansible.builtin.set_fact:
      reset_source_settings: '{{ hostvars[''localhost''][''reset_source_settings''] }}'
    delegate_to: '{{ item }}'
    delegate_facts: true
    loop: '{{ reset_bound_spec.hosts }}'
- name: Work Item 2 - Verify exact current host identity before a journal-selected operation
  hosts: control:network:compute
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
  tasks:
  - name: Inspect current DMI identity and boot without service changes
    ansible.builtin.script:
      cmd: '{{ playbook_dir }}/../scripts/reset_host_preflight.py eyJhY3Rpb24iOiAiaWRlbnRpdHkifQ=='
      executable: python3
    register: reset_current_identity
    changed_when: false
  - name: Require original five host identities
    ansible.builtin.assert:
      that:
      - (reset_current_identity.stdout | from_json).identity == reset_bound_identities[inventory_hostname]
- name: Work Item 2 - Stop running libvirt guests before Kolla destroy
  hosts: compute
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected stop-guests stage
    block:
    - name: Stop all running guests only when nova_libvirt container exists
      ansible.builtin.shell: |
        set -euo pipefail

        if [ -n "$(docker ps -q --filter name=^/nova_libvirt$)" ]; then
          running="$(docker exec nova_libvirt virsh list --name)"
          if [ -n "$running" ]; then
            while IFS= read -r vm; do
              [ -n "$vm" ] || continue
              docker exec nova_libvirt virsh destroy "$vm"
            done <<< "$running"
          fi
        fi
      args:
        executable: /bin/bash
      changed_when: true
    when: reset_stage == 'stop-guests'
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Destroy the current Kolla deployment from the deployment host
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected destroy stage
    block:
    - name: Run the reviewed Kolla destroy with exact bound storage inputs
      ansible.builtin.command:
        argv:
        - '{{ reset_bound_spec.kolla_venv }}/bin/kolla-ansible'
        - -i
        - '{{ reset_bound_spec.inventory }}'
        - --configdir
        - '{{ reset_bound_spec.globals_path | dirname }}'
        - --passwords
        - '{{ reset_bound_spec.passwords }}'
        - --limit
        - '{{ reset_bound_spec.hosts | join('':'') }}'
        - -e
        - '@{{ reset_generation_dir }}/destroy-vars.json'
        - destroy
        - --yes-i-really-really-mean-it
    when: reset_stage == 'destroy'
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Verify Kolla runtime residue after destroy
  hosts: control:network:compute
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected residue stage
    block:
    - name: List remaining containers
      ansible.builtin.command: docker ps -a
      register: reset_containers
      changed_when: false
    - name: List remaining Docker volumes
      ansible.builtin.command: docker volume ls
      register: reset_volumes
      changed_when: false
    - name: Show remaining Docker objects for inspection
      ansible.builtin.debug:
        msg:
        - 'Containers on {{ inventory_hostname }}:'
        - '{{ reset_containers.stdout }}'
        - 'Volumes on {{ inventory_hostname }}:'
        - '{{ reset_volumes.stdout }}'
    - name: Check for residual RabbitMQ Docker volumes
      ansible.builtin.shell: |
        set -euo pipefail
        docker volume ls -q | grep -i 'rabbitmq' || true
      args:
        executable: /bin/bash
      register: reset_rabbitmq_residual_volumes
      changed_when: false
    - name: Fail if RabbitMQ persistent volume survived destroy
      ansible.builtin.assert:
        that:
        - reset_rabbitmq_residual_volumes.stdout | trim == ''
        fail_msg: 'RabbitMQ persistent Docker volume(s) remain after kolla-ansible destroy: {{ reset_rabbitmq_residual_volumes.stdout_lines
          }}. A clean lab reset must not reuse old RabbitMQ Mnesia/Raft state.'
    - name: Require all reset-scoped Docker containers and volumes to be gone
      ansible.builtin.shell: |
        set -euo pipefail
        test -z "$(docker ps -aq)"
        test -z "$(docker volume ls -q)"
      args:
        executable: /bin/bash
      changed_when: false
    when: reset_stage == 'residue'
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Verify Neutron namespaces are gone after destroy
  hosts: network:compute
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected residue stage
    block:
    - name: Fail if qrouter qdhcp or ovnmeta namespaces remain
      ansible.builtin.shell: |
        set -euo pipefail
        bad="$(ip netns list 2>/dev/null \
          | awk '{print $1}' \
          | grep -E '^(qrouter-|qdhcp-|ovnmeta-)' || true)"

        if [ -n "$bad" ]; then
          echo "Residual namespaces:"
          echo "$bad"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
    when: reset_stage == 'residue'
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Reboot network and compute nodes to clear kernel datapath residue
  hosts: network:compute
  gather_facts: false
  become: true
  serial: 1
  tasks:
  - name: Run only the journal-selected reboot stage
    block:
    - name: Reboot host and wait for it to return
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 10
        post_reboot_delay: 10
      when: (reset_current_identity.stdout | from_json).boot == reset_bound_boots[inventory_hostname]
    when: reset_stage == 'reboot-' + inventory_hostname
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Verify clean host networking after reboot
  hosts: network:compute
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected reboot stage
    block:
    - name: Show compact interface state
      ansible.builtin.command: ip -br link
      register: reset_links
      changed_when: false
    - name: Print compact interface state
      ansible.builtin.debug:
        var: reset_links.stdout_lines
    - name: Verify reviewed source management and tunnel interfaces
      ansible.builtin.command: ip link show {{ item }}
      loop:
      - '{{ reset_source_settings.network_interface }}'
      - '{{ reset_source_settings.tunnel_interface }}'
      changed_when: false
    - name: Verify network host retains neutron-ext
      ansible.builtin.command: ip link show {{ reset_source_settings.neutron_external_interface }}
      when: inventory_hostname in groups.get('network', [])
      changed_when: false
    - name: Fail if OVS OVN datapath residue remains
      ansible.builtin.shell: |
        set -euo pipefail
        bad="$(ip -o link show \
          | awk -F': ' '{print $2}' \
          | cut -d@ -f1 \
          | grep -E '^(br-int|br-ex|br-tun|genev_sys_6081)$' || true)"

        if [ -n "$bad" ]; then
          echo "Residual datapath interfaces:"
          echo "$bad"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
    - name: Recheck Neutron namespaces after reboot
      ansible.builtin.shell: |
        set -euo pipefail
        bad="$(ip netns list 2>/dev/null \
          | awk '{print $1}' \
          | grep -E '^(qrouter-|qdhcp-|ovnmeta-)' || true)"

        if [ -n "$bad" ]; then
          echo "Residual namespaces:"
          echo "$bad"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
    when: reset_stage == 'reboot-' + inventory_hostname
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Restore retained authoritative OVS source configuration
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
  - name: Apply source files only before deployment
    when: reset_stage == 'source-config'
    block:
    - name: Restore reviewed source globals
      ansible.builtin.copy:
        src: '{{ reset_bound_spec.source_globals }}'
        dest: '{{ reset_bound_spec.globals_path }}'
        owner: root
        group: root
        mode: '0644'
    - name: Remove only preflight-checked live custom overrides
      ansible.builtin.file:
        path: '{{ reset_bound_spec.config_path }}'
        state: absent
    - name: Restore reviewed source custom overrides
      ansible.builtin.copy:
        src: '{{ reset_bound_spec.source_config }}/'
        dest: '{{ reset_bound_spec.config_path }}/'
        owner: root
        group: root
        mode: preserve
- name: Work Item 2 - Reconcile Kolla deployment stages without another destroy
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
  - name: Bootstrap intended source hosts
    block:
    - name: Bootstrap servers
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_bound_spec.kolla_venv + '/bin/activate') | quote }}
        kolla-ansible --configdir {{ (reset_bound_spec.globals_path | dirname) | quote }} --passwords {{ reset_bound_spec.passwords | quote }} -i {{ reset_bound_spec.inventory | quote }} --limit {{ (reset_bound_spec.hosts | join(':')) | quote }} -e {{ ('@' + reset_generation_dir + '/management-trust-vars.json') | quote }} bootstrap-servers
      args:
        executable: /bin/bash
      changed_when: true
    when: reset_stage == 'bootstrap-servers'
  - name: Precheck intended source deployment
    block:
    - name: Run Kolla prechecks
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_bound_spec.kolla_venv + '/bin/activate') | quote }}
        kolla-ansible --configdir {{ (reset_bound_spec.globals_path | dirname) | quote }} --passwords {{ reset_bound_spec.passwords | quote }} -i {{ reset_bound_spec.inventory | quote }} --limit {{ (reset_bound_spec.hosts | join(':')) | quote }} -e {{ ('@' + reset_generation_dir + '/management-trust-vars.json') | quote }} prechecks
      args:
        executable: /bin/bash
      changed_when: false
    when: reset_stage == 'prechecks'
  - name: Deploy and verify original RabbitMQ quorum gates
    block:
    - name: Record RabbitMQ log offset before deploy
      ansible.builtin.shell: |
        set -euo pipefail
        log="/var/log/kolla/rabbitmq/rabbit@$(hostname -s).log"
        if [ -f "$log" ]; then
          wc -l < "$log"
        else
          echo 0
        fi
      args:
        executable: /bin/bash
      register: reset_rabbitmq_log_offset
      changed_when: false
    - name: Deploy OpenStack
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_bound_spec.kolla_venv + '/bin/activate') | quote }}
        kolla-ansible --configdir {{ (reset_bound_spec.globals_path | dirname) | quote }} --passwords {{ reset_bound_spec.passwords | quote }} -i {{ reset_bound_spec.inventory | quote }} --limit {{ (reset_bound_spec.hosts | join(':')) | quote }} -e {{ ('@' + reset_generation_dir + '/management-trust-vars.json') | quote }} deploy
      args:
        executable: /bin/bash
      register: reset_deploy
      changed_when: true
      failed_when: false
    - name: Verify RabbitMQ container is running after deploy attempt
      ansible.builtin.shell: |
        set -euo pipefail
        test -n "$(docker ps -q --filter name=^/rabbitmq$)"
      args:
        executable: /bin/bash
      register: reset_rabbitmq_container
      changed_when: false
      failed_when: false
    - name: Wait for RabbitMQ application startup
      ansible.builtin.command:
        argv:
        - docker
        - exec
        - rabbitmq
        - rabbitmqctl
        - await_startup
      register: reset_rabbitmq_await
      changed_when: false
      failed_when: false
      when: reset_rabbitmq_container.rc == 0
    - name: Read RabbitMQ cluster status
      ansible.builtin.command:
        argv:
        - docker
        - exec
        - rabbitmq
        - rabbitmqctl
        - cluster_status
      register: reset_rabbitmq_cluster
      changed_when: false
      failed_when: false
      when:
      - reset_rabbitmq_container.rc == 0
      - reset_rabbitmq_await.rc | default(1) == 0
    - name: Read RabbitMQ queue state
      ansible.builtin.command:
        argv:
        - docker
        - exec
        - rabbitmq
        - rabbitmqctl
        - list_queues
        - name
        - type
        - state
      register: reset_rabbitmq_queues
      changed_when: false
      failed_when: false
      when:
      - reset_rabbitmq_container.rc == 0
      - reset_rabbitmq_await.rc | default(1) == 0
    - name: Verify Nova conductor quorum queue is running
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec rabbitmq rabbitmqctl -q list_queues name type state           | awk '
              $1 == "conductor" && $2 == "quorum" && $3 == "running" { ok=1 }
              END { exit(ok ? 0 : 1) }
            '
      args:
        executable: /bin/bash
      register: reset_rabbitmq_conductor_queue
      changed_when: false
      failed_when: false
      when:
      - reset_rabbitmq_container.rc == 0
      - reset_rabbitmq_await.rc | default(1) == 0
    - name: Check new RabbitMQ log lines for quorum Raft failures
      ansible.builtin.shell: |
        set -euo pipefail
        log="/var/log/kolla/rabbitmq/rabbit@$(hostname -s).log"
        start=$(( {{ reset_rabbitmq_log_offset.stdout | int }} + 1 ))

        if [ ! -f "$log" ]; then
          exit 0
        fi

        tail -n +"$start" "$log"           | grep -Ei "cluster_not_formed|already_started|failed to form a new cluster"           || true
      args:
        executable: /bin/bash
      register: reset_rabbitmq_raft_errors
      changed_when: false
      failed_when: false
    - name: Show RabbitMQ diagnostics after deploy attempt
      ansible.builtin.debug:
        msg:
        - kolla-ansible deploy rc={{ reset_deploy.rc }}
        - RabbitMQ container running rc={{ reset_rabbitmq_container.rc }}
        - RabbitMQ await_startup rc={{ reset_rabbitmq_await.rc | default('not-run') }}
        - 'RabbitMQ cluster status:'
        - '{{ reset_rabbitmq_cluster.stdout_lines | default([]) }}'
        - 'RabbitMQ queues:'
        - '{{ reset_rabbitmq_queues.stdout_lines | default([]) }}'
        - 'New RabbitMQ quorum/Raft errors:'
        - '{{ reset_rabbitmq_raft_errors.stdout_lines | default([]) }}'
    - name: Fail when deploy or RabbitMQ validation failed
      ansible.builtin.assert:
        that:
        - reset_deploy.rc == 0
        - reset_rabbitmq_container.rc == 0
        - reset_rabbitmq_await.rc | default(1) == 0
        - reset_rabbitmq_cluster.rc | default(1) == 0
        - reset_rabbitmq_queues.rc | default(1) == 0
        - reset_rabbitmq_conductor_queue.rc | default(1) == 0
        - reset_rabbitmq_raft_errors.stdout | default('') | trim == ''
        fail_msg: Deployment or RabbitMQ validation failed. Inspect the diagnostics above. In particular, cluster_not_formed
          / already_started / failed-to-form errors indicate stale or broken RabbitMQ quorum/Raft state.
    when: reset_stage == 'deploy'
  - name: Finalize source deployment endpoints
    block:
    - name: Run post-deploy
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_bound_spec.kolla_venv + '/bin/activate') | quote }}
        kolla-ansible --configdir {{ (reset_bound_spec.globals_path | dirname) | quote }} --passwords {{ reset_bound_spec.passwords | quote }} -i {{ reset_bound_spec.inventory | quote }} -e {{ ('@' + reset_generation_dir + '/management-trust-vars.json') | quote }} post-deploy
      args:
        executable: /bin/bash
      changed_when: true
    when: reset_stage == 'post-deploy'
  any_errors_fatal: true
- name: Work Item 2 - Verify source ML2 OVS service containers
  hosts: network:compute
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected source-ready stage
    block:
    - name: Verify neutron_openvswitch_agent is running
      ansible.builtin.shell: |
        set -euo pipefail
        test -n "$(docker ps -q --filter name=^/neutron_openvswitch_agent$)"
      args:
        executable: /bin/bash
      changed_when: false
    - name: Verify no OVN runtime containers are running
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "$(docker ps -q --filter name=ovn)" ]; then
          echo "Unexpected OVN containers:"
          docker ps --filter name=ovn
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false
    when: reset_stage == 'source-ready'
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Work Item 2 - Verify source ML2 OVS network services
  hosts: network
  gather_facts: false
  become: true
  tasks:
  - name: Run only the journal-selected source-ready stage
    block:
    - name: Verify DHCP L3 and metadata agents are running
      ansible.builtin.shell: |
        set -euo pipefail
        for c in \
          neutron_dhcp_agent \
          neutron_l3_agent \
          neutron_metadata_agent \
          neutron_openvswitch_agent
        do
          if [ -z "$(docker ps -q --filter name=^/${c}$)" ]; then
            echo "Required source container is not running: $c"
            exit 1
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false
    - name: Verify generated OVS firewall driver
      ansible.builtin.shell: |
        set -euo pipefail
        grep -Eq '^[[:space:]]*firewall_driver[[:space:]]*=[[:space:]]*openvswitch[[:space:]]*$' \
          /etc/kolla/neutron-openvswitch-agent/openvswitch_agent.ini
      args:
        executable: /bin/bash
      changed_when: false
    when: reset_stage == 'source-ready'
  any_errors_fatal: true
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}
- name: Collect full source runtime before EW provisioning
  ansible.builtin.import_playbook: 00-bootstrap.yml
  when: reset_stage == 'source-ready'
  vars:
    kolla_globals_path: '{{ reset_bound_spec.globals_path }}'
    openrc_path: '{{ reset_bound_spec.openrc }}'
    migration_backup_root: '{{ reset_bound_spec.backup_root }}'
    ew_workloads_enabled: false
- name: Reuse effective source scope and MTU gates
  ansible.builtin.import_playbook: 02-precheck.yml
  when: reset_stage == 'source-ready'
  vars:
    kolla_globals_path: '{{ reset_bound_spec.globals_path }}'
    openrc_path: '{{ reset_bound_spec.openrc }}'
    migration_backup_root: '{{ reset_bound_spec.backup_root }}'
    ew_workloads_enabled: false
    ew_provisioning_precheck: true
- name: Work Item 2 - Prove empty/generation-owned source scope and required service placement
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
  - name: Require APIs services and original source MTU before EW apply
    when: reset_stage == 'source-ready'
    ansible.builtin.shell: |
      set -euo pipefail
      source {{ reset_bound_spec.openrc | quote }}
      python3 {{ (playbook_dir + '/../scripts/reset_source_ready.py') | quote }} {{ reset_generation_dir | quote }} {{ migration_run_dir | quote }}
    args:
      executable: /bin/bash
    changed_when: false
