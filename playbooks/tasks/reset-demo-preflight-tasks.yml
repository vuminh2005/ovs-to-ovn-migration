- name: Save reset-owned shared external and console demo settings before destroy
  ansible.builtin.copy:
    dest: "{{ reset_run_dir }}/reset-demo-config.json"
    mode: '0600'
    content: >-
      {{ {'enabled': reset_demo_enabled | bool, 'prefix': reset_demo_prefix,
          'cidrs': reset_demo_cidrs, 'compute_hosts': reset_demo_compute_hosts,
          'router_ip': reset_demo_router_ip, 'floating_ip': reset_demo_floating_ip,
          'console_user': reset_demo_console_user, 'console_password': reset_demo_console_password,
          'source_mtu': reset_source_mtu | int, 'endpoint_ip': ns_endpoint_ip,
          'timeout': reset_demo_timeout_seconds | int,
          'workload_cidrs': (validation_pre_cidrs | default(['10.231.0.0/24','10.231.1.0/24'])) +
                            (validation_post_cidrs | default(['10.232.0.0/24','10.232.1.0/24'])) + [ns_tenant_cidr],
          'external': {'network': ns_shared_external_name, 'subnet': ns_shared_external_subnet_name,
             'cidr': ns_external_cidr, 'gateway_ip': ns_external_gateway, 'physnet': ns_physnet,
             'mtu': ns_underlay_mtu | int, 'pool_start': ns_shared_pool_start, 'pool_end': ns_shared_pool_end,
             'snat_ip': ns_router_ip, 'fip_ip': ns_floating_ip}} | to_nice_json }}
  no_log: true
  diff: false

- name: Validate demo CIDRs pool and independent fixed IPs before stopping guests
  ansible.builtin.command:
    argv: [python3, "{{ playbook_dir }}/scripts/reset/reset_demo.py", validate, "{{ reset_run_dir }}/reset-demo-config.json"]
  changed_when: false
