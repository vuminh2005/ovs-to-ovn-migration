---
- name: "[N-S] Check or arm N-S probes before network cutover"
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "[N-S] Send N-S probe command through owned router"
      ansible.builtin.script:
        cmd: "../../scripts/probes/ns_control.py {{ ns_control_payload | to_json | quote }}"
        executable: python3
      delegate_to: "{{ ns_control_host }}"
      register: ns_control_reply
      no_log: true
    - name: "[N-S] [SAVE] Save N-S probe acknowledgement"
      ansible.builtin.copy:
        dest: "{{ ns_control_ack_path }}"
        content: "{{ ns_control_reply.stdout | trim | from_json | to_nice_json }}"
        mode: '0600'
