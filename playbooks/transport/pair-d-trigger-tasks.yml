- name: "[GROUP D] Check or arm Group D probes"
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "[GROUP D] Send Group D command through owned router"
      ansible.builtin.script:
        cmd: "../../scripts/probes/tcp_trigger.py {{ pair_d_trigger | to_json | quote }}"
        executable: python3
      delegate_to: "{{ pair_d_network_host }}"
      register: pair_d_arm
    - name: "[GROUP D] [SAVE] Save Group D arm acknowledgement"
      ansible.builtin.copy:
        dest: "{{ pair_d_root | run_file(pair_d_ack_filename) }}"
        content: "{{ pair_d_arm.stdout | trim | from_json | to_nice_json }}"
        mode: '0600'
