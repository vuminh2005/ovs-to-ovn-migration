- name: "Phase 02 - Check deployment host and supported source topology"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: "[02] [TIMER] Start phase 02"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '02'
          - start
      run_once: true
      changed_when: false

    - name: "[02] Check required inventory groups"
      ansible.builtin.assert:
        that:
          - "'control' in groups and groups['control'] | length > 0"
          - "'network' in groups and groups['network'] | length > 0"
          - "'compute' in groups and groups['compute'] | length > 0"
          - "'ovn-controller' in groups"
          - "'ovn-database' in groups"
          - "'neutron-ovn-metadata-agent' in groups"
        fail_msg: "Inventory is missing standard Kolla control/network/compute/OVN groups."

    - name: "[02] Read Kolla-Ansible version"
      ansible.builtin.command: "{{ kolla_ansible_bin_runtime }} --version"
      register: kolla_version
      changed_when: false

    - name: "[02] Check supported release and source architecture"
      ansible.builtin.assert:
        that:
          - kolla_version.stdout is regex(supported_kolla_ansible_regex)
          - (source_kolla_globals.openstack_release | string) == supported_openstack_release
          - (source_kolla_globals.neutron_plugin_agent | default('')) == source_neutron_plugin_agent
          - source_tenant_network_type in (source_kolla_globals.neutron_tenant_network_types | default(''))
          - not (source_kolla_globals.enable_neutron_dvr | default(false) | bool)
          - not (source_kolla_globals.enable_neutron_agent_ha | default(false) | bool)
          - not (source_kolla_globals.enable_neutron_provider_networks | default(false) | bool)
          - (source_kolla_globals.tunnel_interface | default('') | length) > 0
        fail_msg: >-
          Source cloud is outside v2 supported scope: Kolla 18.8.x / OpenStack 2024.1,
          ML2/OVS VXLAN, DVR off, Neutron agent HA off, provider networks off.

    - name: "[02] Check OpenStack credentials and API"
      ansible.builtin.shell: |
        set -euo pipefail
        test -r {{ openrc_path }}
        source {{ openrc_path }}
        openstack network list >/dev/null
        openstack server list --all-projects >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[02] [SAVE] Save shared external network and N-S IP settings"
      ansible.builtin.copy:
        dest: "{{ migration_run_dir | run_file('source-topology-config.json') }}"
        mode: '0600'
        content: "{{ {'network': ns_shared_external_name, 'cidr': ns_external_cidr, 'gateway_ip': ns_external_gateway, 'physnet': ns_physnet, 'mtu': ns_underlay_mtu
          | int, 'snat_ip': ns_router_ip, 'fip_ip': ns_floating_ip, 'mtu_delta': mtu_delta_vxlan_to_geneve | int, 'reserve_ns_ips': (validation_workloads_enabled
          | bool) and (validation_ns_enabled | bool)} | to_nice_json }}"

    - name: "[02] Check existing networks, gateways and floating IPs"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/migration/source_topology.py') | quote }} before {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[02] Record deployment host checks complete"
      ansible.builtin.debug:
        msg: "Source cloud matches the currently validated migration scope."

- name: "Phase 02 - Check source hosts and OVS networking"
  hosts: control:network:compute
  any_errors_fatal: true
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  vars:
    validation_effective_tunnel_interface: "{{ ('br-underlay' if inventory_hostname in groups['network'] else 'eth1') if validation_ns_enabled | bool else hostvars['localhost']['source_kolla_globals'].tunnel_interface
      }}"
  tasks:
    - name: "[02] Check Ubuntu 24.04 on migration hosts"
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version(supported_ubuntu_release, '==')

    - name: "[02] Check tunnel interface and IPv4 address"
      ansible.builtin.shell: |
        set -euo pipefail
        iface='{{ validation_effective_tunnel_interface }}'
        ip -4 -o addr show dev "$iface" | grep -F ' inet ' >/dev/null
      args:
        executable: /bin/bash
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

    - name: "[02] Resolve effective tunnel interface per host"
      ansible.builtin.assert:
        that:
          - (lookup('template', kolla_globals_path) | from_yaml).tunnel_interface == validation_effective_tunnel_interface
          - inventory_hostname not in groups['network'] or (lookup('template', kolla_globals_path) | from_yaml).neutron_external_interface == 'ns-ex'
      when:
        - validation_ns_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: "[02] Read tunnel MTU and IPv4 address"
      ansible.builtin.command:
        argv: [ip, -j, -4, addr, show, dev, "{{ validation_effective_tunnel_interface }}"]
      register: validation_tunnel_interface
      changed_when: false
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: "[02] Check transport MTU for source VXLAN traffic"
      ansible.builtin.assert:
        that:
          - (validation_tunnel_interface.stdout | from_json)[0].mtu | int >= (target_geneve_mtu | int) + (mtu_delta_vxlan_to_geneve | int) + 50
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: "[02] Set tunnel addresses for connectivity checks"
      ansible.builtin.set_fact:
        validation_tunnel_ip: "{{ ((validation_tunnel_interface.stdout | from_json)[0].addr_info | selectattr('family', 'equalto', 'inet') | list)[0].local }}"
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: "[02] Check br-int on network and compute hosts"
      ansible.builtin.shell: docker exec openvswitch_vswitchd ovs-vsctl br-exists br-int
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

    - name: "[02] Check source OVS firewall driver"
      ansible.builtin.shell: |
        set -euo pipefail
        cfg=/etc/kolla/neutron-openvswitch-agent/openvswitch_agent.ini
        test ! -f "$cfg" || grep -Eq '^firewall_driver[[:space:]]*=[[:space:]]*openvswitch' "$cfg"
      args:
        executable: /bin/bash
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

- name: "Phase 02 - Check optional SNAT source-port experiment"
  hosts: network
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: "[02] Check effective SNAT experiment settings"
      ansible.builtin.include_tasks: tasks/ns-source-profile-tasks.yml
      vars:
        ns_profile_evidence_directory: "{{ hostvars['localhost']['migration_run_dir'] }}"
      when:
        - validation_ns_enabled | bool
        - ns_preserve_snat_source_port | bool

- name: "Phase 02 - Check tunnel connectivity and capture tools"
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  vars:
    validation_effective_tunnel_interface: "{{ ('br-underlay' if inventory_hostname in groups['network'] else 'eth1') if validation_ns_enabled | bool else hostvars['localhost']['source_kolla_globals'].tunnel_interface
      }}"
  tasks:
    - name: "[02] Check all tunnel paths without fragmentation"
      ansible.builtin.command:
        argv: [ping, -I, "{{ validation_effective_tunnel_interface }}", -M, do, -s, "{{ (target_geneve_mtu | int) + (mtu_delta_vxlan_to_geneve | int) + 50 - 28
              }}", -c, '3', -W, '2', "{{ hostvars[item]['validation_tunnel_ip'] }}"]
      loop: "{{ ((groups['network'] + groups['compute']) | unique | list) | difference([inventory_hostname]) }}"
      when: validation_workloads_enabled | bool
      changed_when: false
    - name: "[02] Check tcpdump on both workload computes"
      ansible.builtin.command: tcpdump --version
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in validation_pair_compute_hosts
      changed_when: false

- name: "Phase 02 - Resolve workload compute placement"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: "[02] Validate workload topology and TCP test settings"
      ansible.builtin.assert:
        that:
          - validation_pair_compute_hosts | length == 2
          - validation_pair_compute_hosts | unique | length == 2
          - validation_pair_compute_hosts | difference(groups['compute']) | length == 0
          - not (validation_pair_d_enabled | bool) or groups['network'] | length == 1
          - "[validation_tcp_old_port, validation_tcp_new_port, validation_tcp_control_port] | unique | length == 3"
          - validation_tcp_old_port | int > 1024 and validation_tcp_old_port | int <= 65535
          - validation_tcp_new_port | int > 1024 and validation_tcp_new_port | int <= 65535
          - validation_tcp_control_port | int > 1024 and validation_tcp_control_port | int <= 65535
          - validation_tcp_interval_seconds | float >= 0.1
          - validation_tcp_timeout_seconds | float > 0
        fail_msg: Workload validation needs two compute targets; automatic D requires one network node and three distinct TCP ports.
      when: validation_workloads_enabled | bool
    - name: "[02] Prepare compute identity lookup"
      ansible.builtin.set_fact:
        validation_placement_request:
          pair_hosts: "{{ validation_pair_compute_hosts }}"
          compute_hosts: "{{ groups['compute'] }}"
          identities: {}
      when: validation_workloads_enabled | bool
    - name: "[02] Add gathered compute hostnames"
      ansible.builtin.set_fact:
        validation_placement_request: "{{ validation_placement_request | combine({'identities': {item: [hostvars[item]['ansible_hostname'], hostvars[item]['ansible_fqdn']]}},
          recursive=true) }}"
      loop: "{{ validation_pair_compute_hosts }}"
      when: validation_workloads_enabled | bool
    - name: "[02] Match Nova computes to source OVS hosts"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/validation_placement.py') | quote }} {{ migration_run_dir | quote }} {{ validation_placement_request | to_json | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool
      changed_when: false

- name: "Phase 02 - Check persistent external uplink"
  hosts: network
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: "[02] [SAVE] Install uplink inspection helper"
      ansible.builtin.copy:
        src: ../scripts/reset/ns_underlay.py
        dest: /root/ns-underlay-check.py
        mode: '0700'
      when: validation_ns_enabled | bool
    - name: "[02] Check uplink addressing and bridge mapping"
      ansible.builtin.command:
        argv: [python3, /root/ns-underlay-check.py, deployed, "{{ {'address': ns_underlay_ip, 'mtu': ns_underlay_mtu | int, 'physnet': ns_physnet, 'ovn': false}
              | to_json }}"]
      changed_when: false
      when: validation_ns_enabled | bool
    - name: "[02] Check connectivity to controller endpoint"
      ansible.builtin.command:
        argv: [ping, -I, br-underlay, -c, '3', -W, '2', "{{ ns_endpoint_ip }}"]
      changed_when: false
      when: validation_ns_enabled | bool

- name: "Phase 02 - Check controller N-S endpoint address"
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: "[02] Check N-S endpoint IP belongs to this controller"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ ns_endpoint_ip | quote }} <<'PYCODE'
        import json, subprocess, sys
        rows=json.loads(subprocess.check_output(['ip','-j','-4','addr','show'], text=True))
        assert sum(a.get('local')==sys.argv[1] for r in rows for a in r['addr_info'])==1, 'NS endpoint address missing/ambiguous'
        PYCODE
      args:
        executable: /bin/bash
      changed_when: false
      when: validation_ns_enabled | bool

    - name: "[02] Check controller N-S listener port is free"
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/validation/ns_endpoint.py", "{{ ns_endpoint_ip }}", "{{ ns_tcp_port | int }}"]
      changed_when: false
      when: validation_ns_enabled | bool

- name: "Phase 02 - Check database migration utility"
  hosts: control
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/ns-lab.yml
  tasks:
    - name: "[02] Check neutron-ovn-db-sync-util migrate support"
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec neutron_server test -x /var/lib/kolla/venv/bin/neutron-ovn-db-sync-util
        docker exec neutron_server neutron-ovn-db-sync-util --help 2>&1 | grep -F ovn-neutron_sync_mode >/dev/null
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false

    - name: "[02] [TIMER] End phase 02"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '02'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
