---
- name: Phase 02 - Precheck deployment host and supported source scope
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 02 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '02'
          - start
      run_once: true
      changed_when: false

    - name: Verify required standard Kolla inventory groups exist
      ansible.builtin.assert:
        that:
          - "'control' in groups and groups['control'] | length > 0"
          - "'network' in groups and groups['network'] | length > 0"
          - "'compute' in groups and groups['compute'] | length > 0"
          - "'ovn-controller' in groups"
          - "'ovn-database' in groups"
          - "'neutron-ovn-metadata-agent' in groups"
        fail_msg: "Inventory is missing standard Kolla control/network/compute/OVN groups."

    - name: Read kolla-ansible version
      ansible.builtin.command: "{{ kolla_ansible_bin_runtime }} --version"
      register: kolla_version
      changed_when: false

    - name: Assert tested Kolla/OpenStack/source architecture scope
      ansible.builtin.assert:
        that:
          - kolla_version.stdout is regex(supported_kolla_ansible_regex)
          - (source_kolla_globals.openstack_release | string) == supported_openstack_release
          - (source_kolla_globals.neutron_plugin_agent | default('')) == source_neutron_plugin_agent
          - source_tenant_network_type in (source_kolla_globals.neutron_tenant_network_types | default(''))
          - not (source_kolla_globals.enable_neutron_dvr | default(false) | bool)
          - not (source_kolla_globals.enable_neutron_agent_ha | default(false) | bool)
          - not (source_kolla_globals.enable_neutron_provider_networks | default(false) | bool)
          - (source_kolla_globals.tunnel_interface | default('') | length) > 0
        fail_msg: >-
          Source cloud is outside v2 supported scope: Kolla 18.8.x / OpenStack 2024.1,
          ML2/OVS VXLAN, DVR off, Neutron agent HA off, provider networks off.

    - name: Verify admin OpenStack credentials are present and API is healthy
      ansible.builtin.shell: |
        set -euo pipefail
        test -r {{ openrc_path }}
        source {{ openrc_path }}
        openstack network list >/dev/null
        openstack server list --all-projects >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Fail if external/provider/FIP topology is present in unsupported v2 scope
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        for id in $(openstack network list -f value -c ID); do
          ext=$(openstack network show "$id" -f value -c router:external)
          case "${ext,,}" in true|yes|1) echo "External network $id detected" >&2; exit 1;; esac
        done
        test "$(openstack floating ip list -f value -c ID | wc -l)" -eq 0
        for id in $(openstack router list -f value -c ID); do
          ext=$(openstack router show "$id" -f value -c external_gateway_info)
          case "$ext" in ""|None|null|'{}') ;; *) echo "Router $id has external gateway: $ext" >&2; exit 1;; esac
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify all existing tenant overlay networks are VXLAN in supported scope
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        for id in $(openstack network list -f value -c ID); do
          t=$(openstack network show "$id" -f value -c provider:network_type)
          test "$t" = "{{ source_tenant_network_type }}"
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Mark precheck deployment-host portion complete
      ansible.builtin.debug:
        msg: "Source cloud matches the currently validated migration scope."

- name: Phase 02 - Precheck Kolla hosts and OVS source dataplane
  hosts: control:network:compute
  any_errors_fatal: true
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Assert Ubuntu 24.04 on migration hosts
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version(supported_ubuntu_release, '==')

    - name: Verify configured tunnel interface exists and has IPv4 on network/compute chassis
      ansible.builtin.shell: |
        set -euo pipefail
        iface='{{ hostvars['localhost']['source_kolla_globals'].tunnel_interface }}'
        ip -4 -o addr show dev "$iface" | grep -q ' inet '
      args:
        executable: /bin/bash
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

    - name: Read effective tunnel interface MTU and IPv4 address
      ansible.builtin.command:
        argv: [ip, -j, -4, addr, show, dev, "{{ hostvars['localhost']['source_kolla_globals'].tunnel_interface }}"]
      register: validation_tunnel_interface
      changed_when: false
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: Verify transport MTU can carry the source validation VXLAN profile
      ansible.builtin.assert:
        that:
          - (validation_tunnel_interface.stdout | from_json)[0].mtu | int >= (target_geneve_mtu | int) + (mtu_delta_vxlan_to_geneve | int) + 50
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: Save exact tunnel IPv4 address for full mesh probes
      ansible.builtin.set_fact:
        validation_tunnel_ip: "{{ ((validation_tunnel_interface.stdout | from_json)[0].addr_info | selectattr('family', 'equalto', 'inet') | list)[0].local }}"
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in (groups['network'] + groups['compute'])

    - name: Verify br-int exists on network/compute chassis
      ansible.builtin.shell: docker exec openvswitch_vswitchd ovs-vsctl br-exists br-int
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

    - name: Verify source OVS firewall driver where OVS agent config exists
      ansible.builtin.shell: |
        set -euo pipefail
        cfg=/etc/kolla/neutron-openvswitch-agent/openvswitch_agent.ini
        test ! -f "$cfg" || grep -Eq '^firewall_driver[[:space:]]*=[[:space:]]*openvswitch' "$cfg"
      args:
        executable: /bin/bash
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

- name: Phase 02 - Verify cross-node tunnel transport and packet capture tool
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify full mesh tunnel transport with no fragmentation
      ansible.builtin.command:
        argv: [ping, -I, "{{ hostvars['localhost']['source_kolla_globals'].tunnel_interface }}", -M, do,
               -s, "{{ (target_geneve_mtu | int) + (mtu_delta_vxlan_to_geneve | int) + 50 - 28 }}",
               -c, '3', -W, '2', "{{ hostvars[item]['validation_tunnel_ip'] }}"]
      loop: "{{ ((groups['network'] + groups['compute']) | unique | list) | difference([inventory_hostname]) }}"
      when: validation_workloads_enabled | bool
      changed_when: false
    - name: Require tcpdump on both placement computes
      ansible.builtin.command: tcpdump --version
      when:
        - validation_workloads_enabled | bool
        - inventory_hostname in validation_pair_compute_hosts
      changed_when: false

- name: Phase 02 - Resolve exact workload placement before any resource creation
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require two distinct compute targets and supported automatic D topology
      ansible.builtin.assert:
        that:
          - validation_pair_compute_hosts | length == 2
          - validation_pair_compute_hosts | unique | length == 2
          - validation_pair_compute_hosts | difference(groups['compute']) | length == 0
          - not (validation_pair_d_enabled | bool) or groups['network'] | length == 1
          - "[validation_tcp_old_port, validation_tcp_new_port, validation_tcp_control_port] | unique | length == 3"
          - validation_tcp_old_port | int > 1024 and validation_tcp_old_port | int <= 65535
          - validation_tcp_new_port | int > 1024 and validation_tcp_new_port | int <= 65535
          - validation_tcp_control_port | int > 1024 and validation_tcp_control_port | int <= 65535
          - validation_tcp_interval_seconds | float >= 0.1
          - validation_tcp_timeout_seconds | float > 0
        fail_msg: Workload validation needs two compute targets; automatic D requires one network node and three distinct TCP ports.
      when: validation_workloads_enabled | bool
    - name: Build inventory and gathered host identity request
      ansible.builtin.set_fact:
        validation_placement_request:
          pair_hosts: "{{ validation_pair_compute_hosts }}"
          compute_hosts: "{{ groups['compute'] }}"
          identities: {}
      when: validation_workloads_enabled | bool
    - name: Include exact hostnames gathered from each target compute
      ansible.builtin.set_fact:
        validation_placement_request: "{{ validation_placement_request | combine({'identities': {item: [hostvars[item]['ansible_hostname'], hostvars[item]['ansible_fqdn']]}}, recursive=true) }}"
      loop: "{{ validation_pair_compute_hosts }}"
      when: validation_workloads_enabled | bool
    - name: Resolve enabled Nova computes hypervisors and source OVS binding hosts
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation_placement.py') | quote }} {{ migration_run_dir | quote }} {{ validation_placement_request | to_json | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool
      changed_when: false

- name: Phase 02 - Verify DB sync utility on first control host
  hosts: control
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify migration utility and migrate mode
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec neutron_server test -x /var/lib/kolla/venv/bin/neutron-ovn-db-sync-util
        docker exec neutron_server neutron-ovn-db-sync-util --help 2>&1 | grep -q ovn-neutron_sync_mode
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false

    - name: Mark phase 02 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '02'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
