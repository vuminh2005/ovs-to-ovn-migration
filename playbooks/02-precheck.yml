---
- name: Phase 02 - Precheck deployment host and supported source scope
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 02 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '02'
          - start
      run_once: true
      changed_when: false

    - name: Verify required standard Kolla inventory groups exist
      ansible.builtin.assert:
        that:
          - "'control' in groups and groups['control'] | length > 0"
          - "'network' in groups and groups['network'] | length > 0"
          - "'compute' in groups and groups['compute'] | length > 0"
          - "'ovn-controller' in groups"
          - "'ovn-database' in groups"
          - "'neutron-ovn-metadata-agent' in groups"
        fail_msg: "Inventory is missing standard Kolla control/network/compute/OVN groups."

    - name: Read kolla-ansible version
      ansible.builtin.command: "{{ kolla_ansible_bin_runtime }} --version"
      register: kolla_version
      changed_when: false

    - name: Assert tested Kolla/OpenStack/source architecture scope
      ansible.builtin.assert:
        that:
          - kolla_version.stdout is regex(supported_kolla_ansible_regex)
          - (source_kolla_globals.openstack_release | string) == supported_openstack_release
          - (source_kolla_globals.neutron_plugin_agent | default('')) == source_neutron_plugin_agent
          - source_tenant_network_type in (source_kolla_globals.neutron_tenant_network_types | default(''))
          - not (source_kolla_globals.enable_neutron_dvr | default(false) | bool)
          - not (source_kolla_globals.enable_neutron_agent_ha | default(false) | bool)
          - not (source_kolla_globals.enable_neutron_provider_networks | default(false) | bool)
          - (source_kolla_globals.tunnel_interface | default('') | length) > 0
        fail_msg: >-
          Source cloud is outside v2 supported scope: Kolla 18.8.x / OpenStack 2024.1,
          ML2/OVS VXLAN, DVR off, Neutron agent HA off, provider networks off.

    - name: Verify admin OpenStack credentials are present and API is healthy
      ansible.builtin.shell: |
        set -euo pipefail
        test -r {{ openrc_path }}
        source {{ openrc_path }}
        openstack network list >/dev/null
        openstack server list --all-projects >/dev/null
      args:
        executable: /bin/bash
      changed_when: false

    - name: Fail if external/provider/FIP topology is present in unsupported v2 scope
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        for id in $(openstack network list -f value -c ID); do
          ext=$(openstack network show "$id" -f value -c router:external)
          case "${ext,,}" in true|yes|1) echo "External network $id detected" >&2; exit 1;; esac
        done
        test "$(openstack floating ip list -f value -c ID | wc -l)" -eq 0
        for id in $(openstack router list -f value -c ID); do
          ext=$(openstack router show "$id" -f value -c external_gateway_info)
          case "$ext" in ""|None|null|'{}') ;; *) echo "Router $id has external gateway: $ext" >&2; exit 1;; esac
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify all existing tenant overlay networks are VXLAN in supported scope
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        for id in $(openstack network list -f value -c ID); do
          t=$(openstack network show "$id" -f value -c provider:network_type)
          test "$t" = "{{ source_tenant_network_type }}"
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Mark precheck deployment-host portion complete
      ansible.builtin.debug:
        msg: "Source cloud matches the currently validated migration scope."

- name: Phase 02 - Precheck Kolla hosts and OVS source dataplane
  hosts: control:network:compute
  any_errors_fatal: true
  gather_facts: true
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Assert Ubuntu 24.04 on migration hosts
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version(supported_ubuntu_release, '==')

    - name: Verify configured tunnel interface exists and has IPv4 on network/compute chassis
      ansible.builtin.shell: |
        set -euo pipefail
        iface='{{ hostvars['localhost']['source_kolla_globals'].tunnel_interface }}'
        ip -4 -o addr show dev "$iface" | grep -q ' inet '
      args:
        executable: /bin/bash
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

    - name: Verify br-int exists on network/compute chassis
      ansible.builtin.shell: docker exec openvswitch_vswitchd ovs-vsctl br-exists br-int
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

    - name: Record tunnel-interface MTU and IPv4 constraints on every chassis
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ hostvars['localhost']['source_kolla_globals'].tunnel_interface | quote }} <<'PYCODE'
        import json,subprocess,sys
        iface=sys.argv[1]
        links=json.loads(subprocess.check_output(['ip','-j','link','show','dev',iface],text=True))
        addresses=json.loads(subprocess.check_output(['ip','-j','-4','addr','show','dev',iface],text=True))
        assert len(links)==1 and len(addresses)==1, 'Expected one configured tunnel interface'
        print(json.dumps(dict(interface=iface,mtu=links[0]['mtu'],
            ipv4=[a['local'] for a in addresses[0]['addr_info'] if a['family']=='inet'])))
        PYCODE
      args:
        executable: /bin/bash
      register: mtu_underlay_query
      when: inventory_hostname in hostvars['localhost']['chassis_hosts_runtime']
      changed_when: false

    - name: Publish tunnel-interface constraints for this chassis
      ansible.builtin.set_fact:
        mtu_underlay_runtime: "{{ mtu_underlay_query.stdout | from_json }}"
      when: inventory_hostname in hostvars['localhost']['chassis_hosts_runtime']

    - name: Verify source OVS firewall driver where OVS agent config exists
      ansible.builtin.shell: |
        set -euo pipefail
        cfg=/etc/kolla/neutron-openvswitch-agent/openvswitch_agent.ini
        test ! -f "$cfg" || grep -Eq '^firewall_driver[[:space:]]*=[[:space:]]*openvswitch' "$cfg"
      args:
        executable: /bin/bash
      when: inventory_hostname in (groups['network'] + groups['compute'])
      changed_when: false

- name: Phase 02 - Verify DB sync utility on first control host
  hosts: control
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Inspect running source Neutron MTU configuration on every controller
      ansible.builtin.include_tasks: mtu-config-read-tasks.yml
      vars:
        mtu_config_mode: source

    - name: Verify migration utility and migrate mode
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec neutron_server test -x /var/lib/kolla/venv/bin/neutron-ovn-db-sync-util
        docker exec neutron_server neutron-ovn-db-sync-util --help 2>&1 | grep -q ovn-neutron_sync_mode
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false

- name: Phase 02 - Calculate overlay MTUs and checkpoint existing EW resources
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Read Geneve header size from the installed Kolla ML2 template
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ kolla_ansible_bin_runtime | quote }} {{ mtu_kolla_ml2_template_path | quote }} {{ (playbook_dir + '/../scripts') | quote }} <<'PYCODE'
        import json,pathlib,sys
        sys.path.insert(0,sys.argv[3]); from mtu_plan import template_header
        path=pathlib.Path(sys.argv[2]) if sys.argv[2] else pathlib.Path(sys.argv[1]).resolve().parents[1]/'share/kolla-ansible/ansible/roles/neutron/templates/ml2_conf.ini.j2'
        print(json.dumps(dict(path=str(path),geneve_max_header_size=template_header(path.read_text()))))
        PYCODE
      args:
        executable: /bin/bash
      register: mtu_template_query
      changed_when: false

    - name: Persist effective MTU inputs without configuration secrets
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/mtu-inputs.json"
        mode: '0600'
        content: "{{ {'source_configs': dict(groups['control'] | zip(groups['control'] | map('extract', hostvars, 'mtu_configuration_runtime'))), 'underlay': dict(chassis_hosts_runtime | zip(chassis_hosts_runtime | map('extract', hostvars, 'mtu_underlay_runtime'))), 'geneve_max_header_size': (mtu_template_query.stdout | from_json).geneve_max_header_size, 'template_path': (mtu_template_query.stdout | from_json).path} | to_nice_json }}"

    - name: Calculate safe validation and new Geneve network MTUs before provisioning
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/mtu_plan.py", calculate, "{{ migration_run_dir }}"]
      changed_when: false

    - name: Publish resolved MTU calculation for workload provisioning
      ansible.builtin.set_fact:
        mtu_calculation_runtime: "{{ lookup('file', migration_run_dir + '/mtu-calculation.json') | from_json }}"

    - name: Save non-secret existing East-West topology configuration
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/ew-config.json"
        mode: '0600'
        content: "{{ ew_workload_config | to_nice_json }}"
      when: ew_workloads_enabled | bool

    - name: Resolve unique EW resource UUIDs and preserve their external ownership
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_resources.py') | quote }} {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when:
        - ew_workloads_enabled | bool
        - not (ew_provisioning_precheck | default(false) | bool)

    - name: Mark phase 02 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '02'
          - end
      run_once: true
      changed_when: false
