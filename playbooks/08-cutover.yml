- name: "Phase 08 - Begin network takeover by OVN"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] [TIMER] Start phase 08 and OVN port takeover measurement"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '08'
          - start
          - --also
          - dataplane_convergence.start
      run_once: true
      changed_when: false
    - name: "[08] Verify original cutover checkpoint"
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/migration/cutover_preparation.py", verify, "{{ hostvars['localhost']['migration_run_dir'] }}"]
      register: prepared_cutover_checkpoint
      changed_when: false
    - name: "[08] Load original port checkpoint and timeout"
      ansible.builtin.set_fact:
        cutover_preparation_runtime: "{{ prepared_cutover_checkpoint.stdout | from_json }}"
        metadata_preparation_runtime: "{{ lookup('file', (migration_run_dir | run_file('metadata-preparation.json'))) | from_json }}"

    - name: "[08] Require original metadata preparation and complete host coverage"
      ansible.builtin.assert:
        that:
          - metadata_preparation_runtime.status == 'PASS'
          - metadata_preparation_runtime.run == migration_run_id
          - metadata_preparation_runtime.hosts.keys() | list | sort == groups['neutron-ovn-metadata-agent'] | sort

- name: "Phase 08 - Activate prepared metadata immediately after its legacy agent stops"
  hosts: neutron-ovn-metadata-agent
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
    - name: "[08] Verify metadata preparation on every host before any socket handoff"
      ansible.builtin.script:
        cmd: "../scripts/migration/metadata_handoff.py verify {{ {'run': hostvars['localhost']['migration_run_id'], 'expected': hostvars['localhost']['metadata_preparation_runtime'].hosts[inventory_hostname]} | to_json | quote }}"
        executable: python3
      changed_when: false

    - name: "[08] Stop legacy metadata and start prepared OVN metadata without waiting for chassis"
      ansible.builtin.script:
        cmd: "../scripts/migration/metadata_handoff.py start {{ {'run': hostvars['localhost']['migration_run_id'], 'expected': hostvars['localhost']['metadata_preparation_runtime'].hosts[inventory_hostname]} | to_json | quote }}"
        executable: python3

- name: "Phase 08 - Stop legacy agents on network hosts"
  hosts: network
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] Stop and disable legacy network agents"
      ansible.builtin.shell: |
        set -euo pipefail
        if systemctl cat {{ item }} >/dev/null 2>&1; then
          systemctl disable --now {{ item }}
          test "$(systemctl is-active {{ item }} || true)" != active
        fi
      args:
        executable: /bin/bash
      loop: "{{ legacy_network_units }}"

- name: "Phase 08 - Stop legacy OVS agents on compute hosts"
  hosts: compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] Stop and disable legacy compute agents"
      ansible.builtin.shell: |
        set -euo pipefail
        if systemctl cat {{ item }} >/dev/null 2>&1; then
          systemctl disable --now {{ item }}
          test "$(systemctl is-active {{ item }} || true)" != active
        fi
      args:
        executable: /bin/bash
      loop: "{{ legacy_compute_units }}"

- name: "Phase 08 - Check br-int readiness for OVN takeover"
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] Verify prepared OpenFlow support on br-int"
      ansible.builtin.include_tasks: tasks/openflow-preparation-tasks.yml
      vars:
        openflow_protocols: "{{ br_int_protocols }}"
        openflow_check_only: true
        openflow_evidence_stage: cutover-check
        openflow_evidence_directory: "{{ hostvars['localhost']['migration_run_dir'] }}"

- name: "Phase 08 - Deploy OVN controller while metadata agents await chassis"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] Deploy OVN controller"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} deploy --tags ovn-controller
      args:
        executable: /bin/bash

- name: "Phase 08 - Wait for OVN to take over existing VM ports"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] Check expected hosts are registered in OVN"
      ansible.builtin.script:
        cmd: "../scripts/migration/ovn_ready.py chassis {{ {'sb': ovn_sb_connection_runtime, 'hosts': lookup('file', (migration_run_dir | run_file('host-topology.json'))) | from_json, 'timeout': chassis_registration_timeout_seconds | int, 'poll': binding_poll_interval_seconds | float} | to_json | quote }}"
        executable: python3
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
      when: lookup('fileglob', (migration_run_dir | run_file('host-topology.json'))) | length > 0

    - name: "[08] Check chassis count for historical checkpoints without host identities"
      ansible.builtin.shell: |
        set -euo pipefail
        actual=$(docker exec ovn_northd ovn-sbctl --db='{{ hostvars['localhost']['ovn_sb_connection_runtime'] }}' list Chassis | grep -c '^_uuid')
        test "$actual" -ge {{ hostvars['localhost']['chassis_count_runtime'] | int }}
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
      when: lookup('fileglob', (migration_run_dir | run_file('host-topology.json'))) | length == 0

    - name: "[08] Wait for all existing VM ports to bind and become up"
      ansible.builtin.script:
        cmd: "../scripts/migration/ovn_ready.py bindings {{ {'sb': ovn_sb_connection_runtime, 'ports_path': cutover_preparation_runtime.ports_path, 'ports_sha256': cutover_preparation_runtime.ports_sha256, 'timeout': cutover_preparation_runtime.binding_timeout | int, 'poll': binding_poll_interval_seconds | float} | to_json | quote }}"
        executable: python3
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[08] [TIMER] End OVN port takeover measurement"
      ansible.builtin.shell: date +%s.%N > {{ hostvars['localhost']['migration_run_dir'] | run_file('metrics') }}/dataplane_convergence.end
      run_once: true
      changed_when: false

- name: "Phase 08 - Check OVN services after network takeover"
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[08] Check ovn-controller containers are running"
      ansible.builtin.shell: |
        docker inspect ovn_controller | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
      changed_when: false

    - name: "[08] [SAVE] Collect N-S connection state before legacy cleanup"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/diagnostics/ns_diagnostics.py"
          - post-cutover
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: "[08] [TIMER] End phase 08"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '08'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
