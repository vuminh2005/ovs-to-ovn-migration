---
- name: Phase 08 - Start dataplane convergence and tenant packet measurement
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 08 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '08'
          - start
          - --also
          - dataplane_convergence.start
      run_once: true
      changed_when: false
    - name: Verify immutable cutover preparation from the original run
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/cutover_preparation.py", verify,
               "{{ hostvars['localhost']['migration_run_dir'] }}"]
      register: prepared_cutover_checkpoint
      changed_when: false
    - name: Load original timeout and run-owned VM port checkpoint for normal or resumed cutover
      ansible.builtin.set_fact:
        cutover_preparation_runtime: "{{ prepared_cutover_checkpoint.stdout | from_json }}"

- name: Phase 08 - Stop legacy Neutron agents on network nodes
  hosts: network
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Disable and stop legacy network-node agents when installed
      ansible.builtin.shell: |
        set -euo pipefail
        if systemctl cat {{ item }} >/dev/null 2>&1; then
          systemctl disable --now {{ item }}
          test "$(systemctl is-active {{ item }} || true)" != active
        fi
      args:
        executable: /bin/bash
      loop: "{{ legacy_network_units }}"

- name: Phase 08 - Stop legacy OVS agent on compute nodes
  hosts: compute
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Disable and stop legacy compute agents when installed
      ansible.builtin.shell: |
        set -euo pipefail
        if systemctl cat {{ item }} >/dev/null 2>&1; then
          systemctl disable --now {{ item }}
          test "$(systemctl is-active {{ item }} || true)" != active
        fi
      args:
        executable: /bin/bash
      loop: "{{ legacy_compute_units }}"

- name: Phase 08 - Normalize br-int for OVN takeover
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify prepared OpenFlow support without reconfiguring br-int during cutover
      ansible.builtin.include_tasks: openflow-preparation-tasks.yml
      vars:
        openflow_protocols: "{{ br_int_protocols }}"
        openflow_check_only: true
        openflow_evidence_stage: cutover-check
        openflow_evidence_directory: "{{ hostvars['localhost']['migration_run_dir'] }}"

- name: Phase 08 - Deploy OVN controller and metadata through Kolla
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Deploy OVN controller
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} deploy --tags ovn-controller
      args:
        executable: /bin/bash

    - name: Deploy OVN metadata agents only
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} deploy --tags neutron --limit neutron-ovn-metadata-agent
      args:
        executable: /bin/bash

- name: Phase 08 - Wait for OVN workload takeover using SB Port_Binding
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify expected unique OVN chassis registered in Southbound DB
      ansible.builtin.shell: |
        set -euo pipefail
        actual=$(docker exec ovn_northd ovn-sbctl --db='{{ hostvars['localhost']['ovn_sb_connection_runtime'] }}' list Chassis | grep -c '^_uuid')
        test "$actual" -ge {{ hostvars['localhost']['chassis_count_runtime'] | int }}
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Wait until every pre-existing VM port has chassis and up=true
      ansible.builtin.shell: |
        set -euo pipefail
        ports={{ hostvars['localhost']['cutover_preparation_runtime'].ports_path | quote }}
        printf '%s  %s\n' {{ hostvars['localhost']['cutover_preparation_runtime'].ports_sha256 | quote }} "$ports" | sha256sum --check --status
        deadline=$(( $(date +%s) + {{ hostvars['localhost']['cutover_preparation_runtime'].binding_timeout | int }} ))
        while true; do
          bad=0
          while read -r port; do
            [ -n "$port" ] || continue
            out=$(docker exec ovn_northd ovn-sbctl --db='{{ hostvars['localhost']['ovn_sb_connection_runtime'] }}' \
              --columns=logical_port,chassis,up find Port_Binding logical_port="$port")
            echo "$out" | grep -E '^chassis[[:space:]]*:[[:space:]]*[0-9a-f-]+' >/dev/null || bad=$((bad+1))
            echo "$out" | grep -E '^up[[:space:]]*:[[:space:]]*true' >/dev/null || bad=$((bad+1))
          done < "$ports"
          [ "$bad" -eq 0 ] && exit 0
          [ "$(date +%s)" -lt "$deadline" ] || exit 1
          sleep {{ binding_poll_interval_seconds }}
        done
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Mark dataplane convergence end
      ansible.builtin.shell: date +%s.%N > {{ hostvars['localhost']['migration_run_dir'] }}/metrics/dataplane_convergence.end
      run_once: true
      changed_when: false

- name: Phase 08 - Verify chassis-side services and finish cutover
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify ovn-controller container is running
      ansible.builtin.shell: |
        docker inspect ovn_controller | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
      changed_when: false

    - name: Archive read-only N-S conntrack after OVN takeover before legacy cleanup
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/ns_diagnostics.py"
          - post-cutover
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: Mark phase 08 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '08'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
