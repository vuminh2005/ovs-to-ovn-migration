---
- name: "[DIAGNOSTICS] Manage host observers"
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: "[DIAGNOSTICS] Resolve run-owned observer checkpoint"
      ansible.builtin.set_fact:
        diagnostic_entry: "{{ diagnostics_entries[inventory_hostname] }}"
    - name: "[DIAGNOSTICS] Create observer directory"
      ansible.builtin.file:
        path: "{{ diagnostic_entry.remote_directory }}"
        state: directory
        mode: '0700'
      when: diagnostics_action == 'start'
    - name: "[DIAGNOSTICS] [SAVE] Stage host observer helper"
      ansible.builtin.copy:
        src: "../scripts/{{ item }}"
        dest: "{{ diagnostic_entry.remote_directory }}/{{ item }}"
        mode: '0700'
      loop: [migration_diagnostics.py, run_layout.py]
      when: diagnostics_action == 'start'
    - name: "[DIAGNOSTICS] Run observer control operation"
      ansible.builtin.command:
        argv: "{{ ['python3', diagnostic_entry.remote_directory + '/migration_diagnostics.py', diagnostics_action, diagnostic_entry.remote_directory] + (['--config', diagnostic_entry.config | to_json] if diagnostics_action == 'start' else []) + (['--label', diagnostics_label] if diagnostics_action in ['snapshot', 'snapshot-wait'] else []) }}"
      register: diagnostic_operation
      changed_when: false
      failed_when: false
    - name: "[DIAGNOSTICS] [SAVE] Save observer transport result"
      ansible.builtin.copy:
        dest: "{{ diagnostics_root }}/{{ inventory_hostname }}-{{ diagnostic_entry.role }}-{{ diagnostics_action }}.json"
        content: "{{ diagnostic_operation | to_nice_json }}"
        mode: '0600'
      delegate_to: localhost
    - name: "[DIAGNOSTICS] Archive observer evidence on success or failure"
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ diagnostic_entry.remote_directory }}.tar.gz"
          - -C
          - "{{ diagnostic_entry.remote_directory }}"
          - .
      register: diagnostic_archive
      changed_when: false
      failed_when: false
      when: diagnostics_action == 'stop'
    - name: "[DIAGNOSTICS] [SAVE] Fetch host evidence before workload cleanup"
      ansible.builtin.fetch:
        src: "{{ diagnostic_entry.remote_directory }}.tar.gz"
        dest: "{{ diagnostics_root }}/{{ diagnostic_entry.archive_name | default(inventory_hostname + '-' + diagnostic_entry.role + '.tar.gz') }}"
        flat: true
      when: diagnostics_action == 'stop' and diagnostic_archive.rc == 0
    - name: "[DIAGNOSTICS] Check observers are running before API freeze"
      ansible.builtin.assert:
        that: diagnostic_operation.rc == 0
        fail_msg: "Observer unavailable; inspect saved diagnostics result before cutover."
      when: diagnostics_action in ['start', 'check', 'snapshot-wait']
