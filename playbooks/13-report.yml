---
- name: "Phase 13 - Finalize workloads and publish migration report"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[13] [TIMER] Start phase 13"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - report-start
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
      run_once: true
      changed_when: false

    - name: "[13] Build initial JSON and text reports"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 {{ (playbook_dir + '/../scripts/migration_report.py') | quote }} {{ migration_run_dir | quote }} {{ migration_run_id | quote }} {{ kolla_inventory_runtime | quote }}
      args:
        executable: /bin/bash
      register: migration_report_output
      changed_when: false

    - name: "[13] Finalize and clean up owned workloads when checks pass"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} finalize {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: validation_finalize
      failed_when: false
      when: validation_workloads_enabled | bool

    - name: "[13] Check demo and shared external resources survive cleanup"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/source_topology.py') | quote }} verify {{ migration_run_dir | quote }} --scope after-workload-cleanup
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      when: (lookup('file', migration_run_dir + '/runtime.json', errors='ignore') | default('{}', true) | from_json).get('preexisting_preservation_enabled', false) or lookup('fileglob', migration_run_dir + '/source-topology-before.json') | length > 0

    - name: "[13] Update reports with workload cleanup results"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 {{ (playbook_dir + '/../scripts/migration_report.py') | quote }} {{ migration_run_dir | quote }} {{ migration_run_id | quote }} {{ kolla_inventory_runtime | quote }}
      args:
        executable: /bin/bash
      register: migration_report_output
      changed_when: false

    - name: "[13] Remove compute capture copy after reports are saved"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} capture-cleanup {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: "[13] [TIMER] End phase 13 and total migration measurement"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - finish
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
      run_once: true
      changed_when: false

    - name: "[13] Update reports with final timing results"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 {{ (playbook_dir + '/../scripts/migration_report.py') | quote }} {{ migration_run_dir | quote }} {{ migration_run_id | quote }} {{ kolla_inventory_runtime | quote }}
      args:
        executable: /bin/bash
      register: migration_report_output
      changed_when: false

    - name: "[13] Show final report paths"
      ansible.builtin.debug:
        msg: "{{ migration_report_output.stdout_lines }}"

    - name: "[13] Return exit status from final report"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - {{ migration_run_dir | quote }} <<'PYCODE'
        import json, pathlib, sys
        report=json.loads((pathlib.Path(sys.argv[1])/'migration-report.json').read_text())
        sys.exit(report['result'] not in ('SUCCESS','SUCCESS_WITH_REMEDIATION'))
        PYCODE
      args:
        executable: /bin/bash
      changed_when: false
