---
- name: Phase 09 - Mark legacy cleanup start
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 09 start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '09'
          - start
      run_once: true
      changed_when: false

- name: Phase 09 - Remove legacy ML2/OVS tunnel dataplane
  hosts: network:compute
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Delete br-tun and patch-tun
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-br br-tun
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-int patch-tun
      args:
        executable: /bin/bash

- name: Phase 09 - Remove legacy network namespaces and namespace-owned OVS ports
  hosts: network
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Delete only qrouter/qdhcp namespaces and their ports
      ansible.builtin.shell: |
        set -euo pipefail
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        for ns in $(ip netns list | awk '{print $1}' | grep -E '^(qrouter-|qdhcp-)' || true); do
          ip netns exec "$ns" ip -o link show | awk -F': ' '{print $2}' | sed 's/@.*//' | grep -v '^lo$' >> "$tmp" || true
        done
        for ns in $(ip netns list | awk '{print $1}' | grep -E '^(qrouter-|qdhcp-)' || true); do
          ip netns delete "$ns"
        done
        sort -u "$tmp" | while read -r port; do
          [ -n "$port" ] || continue
          docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-int "$port"
          docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-ex "$port"
        done
      args:
        executable: /bin/bash

    - name: Remove old OVS-agent br-int/br-ex patch pair in provider-disabled supported scope
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-int int-br-ex
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-ex phy-br-ex
      args:
        executable: /bin/bash

    - name: Verify legacy namespaces are gone without requiring local OVN metadata namespaces
      ansible.builtin.shell: |
        set -euo pipefail
        ! ip netns list | grep -Eq '^(qrouter-|qdhcp-)'
        # ovnmeta-* is intentionally not deleted. It is chassis/local-datapath
        # dependent and therefore is not required to exist on every network node.
        ip netns list | awk '{print $1}' | grep '^ovnmeta-' || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Mark phase 09 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '09'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
