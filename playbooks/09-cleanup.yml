---
- name: "Phase 09 - Begin legacy ML2/OVS network cleanup"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[09] [TIMER] Start phase 09"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '09'
          - start
      run_once: true
      changed_when: false

- name: "Phase 09 - Remove legacy OVS tunnel bridges"
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[09] Delete br-tun and patch-tun"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/rollback_host.py event {{ {'run': hostvars['localhost']['migration_run_id'], 'host': inventory_hostname, 'stage': 'cleanup-tunnels', 'edge': 'intent'} | to_json | quote }}
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-br br-tun
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-int patch-tun
      args:
        executable: /bin/bash

- name: "Phase 09 - Remove legacy namespaces and OVS ports"
  hosts: network
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[09] Delete qrouter/qdhcp namespaces and their ports"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/rollback_host.py event {{ {'run': hostvars['localhost']['migration_run_id'], 'host': inventory_hostname, 'stage': 'cleanup-namespaces', 'edge': 'intent'} | to_json | quote }}
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        for ns in $(ip netns list | awk '{print $1}' | grep -E '^(qrouter-|qdhcp-)' || true); do
          ip netns exec "$ns" ip -o link show | awk -F': ' '{print $2}' | sed 's/@.*//' | grep -v '^lo$' >> "$tmp" || true
        done
        for ns in $(ip netns list | awk '{print $1}' | grep -E '^(qrouter-|qdhcp-)' || true); do
          ip netns delete "$ns"
        done
        sort -u "$tmp" | while read -r port; do
          [ -n "$port" ] || continue
          docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-int "$port"
          docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-ex "$port"
        done
      args:
        executable: /bin/bash

    - name: "[09] Remove legacy br-int/br-ex patch ports"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/rollback_host.py event {{ {'run': hostvars['localhost']['migration_run_id'], 'host': inventory_hostname, 'stage': 'cleanup-patches', 'edge': 'intent'} | to_json | quote }}
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-int int-br-ex
        docker exec openvswitch_vswitchd ovs-vsctl --if-exists del-port br-ex phy-br-ex
      args:
        executable: /bin/bash

    - name: "[09] Check legacy namespaces are removed"
      ansible.builtin.shell: |
        set -euo pipefail
        ! ip netns list | grep -E '^(qrouter-|qdhcp-)' >/dev/null
        # ovnmeta-* is intentionally not deleted. It is chassis/local-datapath
        # dependent and therefore is not required to exist on every network node.
        ip netns list | awk '{print $1}' | grep '^ovnmeta-' || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[09] Verify legacy gateway attachments and L3 agent are withdrawn"
      ansible.builtin.shell: |
        set -euo pipefail
        namespaces=$(ip netns list)
        if grep -E '^(qrouter-|qdhcp-|snat-|fip-)' <<< "$namespaces" >/dev/null; then exit 1; fi
        interfaces=$(docker exec openvswitch_vswitchd ovs-vsctl --data=bare --no-heading --columns=name list Interface)
        if tr -d '"' <<< "$interfaces" | grep -E '^(qg-|qr-|ha-|rfp-|fpr-|int-br-ex$|phy-br-ex$)' >/dev/null; then exit 1; fi
        containers=$(docker ps -a --format '{% raw %}{{.Names}}{% endraw %}')
        if grep -Fx neutron_l3_agent <<< "$containers" >/dev/null; then
          test "$(docker inspect neutron_l3_agent --format '{% raw %}{{.State.Running}}{% endraw %}')" = false
        fi
      args:
        executable: /bin/bash
      register: gateway_withdrawal_check
      changed_when: false

    - name: "[09] Publish per-host legacy gateway withdrawal result"
      ansible.builtin.set_fact:
        gateway_cleanup_verified: "{{ gateway_withdrawal_check.rc == 0 }}"

    - name: "[09] [TIMER] End phase 09"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '09'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
