---
- name: "Phase 10 - Begin Neutron API restart with ML2/OVN"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[10] [TIMER] Start phase 10"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '10'
          - start
      run_once: true
      changed_when: false

- name: "Phase 10 - Attempt early gateway scheduling after legacy cleanup"
  hosts: control
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[10] Check every Neutron API container remains stopped"
      ansible.builtin.command:
        argv: [docker, inspect, neutron_server, --format, '{% raw %}{{.State.Running}}{% endraw %}']
      register: gateway_api_stopped_check
      changed_when: false
      failed_when: false

    - name: "[10] Publish per-host API freeze verification"
      ansible.builtin.set_fact:
        gateway_api_stopped: "{{ gateway_api_stopped_check.rc == 0 and gateway_api_stopped_check.stdout == 'false' }}"

    - name: "[10] Attempt bounded native gateway scheduling before Neutron API restart"
      block:
        - name: "[10] Require verified gateway withdrawal on every network host"
          ansible.builtin.assert:
            that:
              - groups.get('network', []) | length > 0
              - groups['network'] | map('extract', hostvars, 'gateway_cleanup_verified') | select('equalto', true) | list | length == groups['network'] | length
              - groups['control'] | map('extract', hostvars, 'gateway_api_stopped') | select('equalto', true) | list | length == groups['control'] | length

        - name: "[10] Schedule unhosted gateways using the prepared native helper"
          ansible.builtin.command:
            argv:
              - python3
              - "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}/gateway_scheduling.py"
              - schedule
              - "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}"
              - "{{ hostvars['localhost']['cutover_preparation_runtime'] | to_json }}"
              - --cleanup-verified
              - --journal
              - "/var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/events.jsonl"
          register: gateway_scheduling_attempt
          changed_when: gateway_scheduling_attempt.rc == 0 and (gateway_scheduling_attempt.stdout | from_json).native.changed_count | int > 0

        - name: "[10] [SAVE] Save successful early gateway scheduling evidence"
          ansible.builtin.copy:
            dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('gateway-scheduling.json') }}"
            content: "{{ gateway_scheduling_attempt.stdout }}\n"
            mode: '0600'
          delegate_to: localhost
      rescue:
        - name: "[10] [SAVE] Record early scheduling fallback and continue API restoration"
          ansible.builtin.copy:
            dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('gateway-scheduling.json') }}"
            content: "{{ {'status': 'FALLBACK', 'reason': 'Early scheduling failed or cleanup was not verified; restore API and use the normal Neutron scheduler', 'attempt': gateway_scheduling_attempt | default({})} | to_nice_json }}\n"
            mode: '0600'
          delegate_to: localhost
          failed_when: false
      run_once: true

- name: "Phase 10 - Start Neutron API workers with OVN configuration"
  hosts: control
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: '[10] Record API restart intent'
      ansible.builtin.command:
        argv:
        - python3
        - '{{ playbook_dir }}/../scripts/recovery/rollback_controller.py'
        - event
        - '{{ hostvars[''localhost''][''migration_run_dir''] }}'
        - '{"stage":"api-restore","edge":"intent"}'
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: "[10] Enable and start neutron-server"
      ansible.builtin.systemd_service:
        name: "{{ neutron_server_unit }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: "[10] Wait for neutron-server container health"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! docker inspect neutron_server >/dev/null 2>&1; then exit 0; fi
        deadline=$(( $(date +%s) + 300 ))
        while true; do
          status=$(docker inspect neutron_server | python3 -c 'import json,sys; d=json.load(sys.stdin)[0]["State"]; print(d.get("Health",{}).get("Status",""))')
          [ "$status" = healthy ] && exit 0
          [ "$(date +%s)" -lt "$deadline" ] || exit 1
          sleep 5
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[10] Check neutron-server uses ML2/OVN"
      ansible.builtin.shell: |
        set -euo pipefail
        if docker inspect neutron_server >/dev/null 2>&1; then
          docker exec neutron_server grep -Eq '^mechanism_drivers[[:space:]]*=[[:space:]]*ovn' /etc/neutron/plugins/ml2/ml2_conf.ini
          docker exec neutron_server grep -Eq '^service_plugins[[:space:]]*=[[:space:]]*ovn-router' /etc/neutron/neutron.conf
        fi
      args:
        executable: /bin/bash
      changed_when: false

- name: "Phase 10 - Wait for usable Neutron API"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[10] Wait for a successful Neutron network list"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        openstack network list >/dev/null
      args:
        executable: /bin/bash
      register: neutron_api_ready
      retries: 60
      delay: 5
      until: neutron_api_ready.rc == 0
      changed_when: false

    - name: "[10] [TIMER] End Neutron API downtime"
      ansible.builtin.shell: |
        date +%s.%N > {{ migration_run_dir }}/metrics/control_plane_downtime.end
      changed_when: false

    - name: "[10] [TIMER] End phase 10"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '10'
          - end
          - --timestamp-file
          - "{{ hostvars['localhost']['migration_run_dir'] }}/metrics/control_plane_downtime.end"
      run_once: true
      changed_when: false
