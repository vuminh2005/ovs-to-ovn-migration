---
- name: Phase 07 - Start control-plane downtime metric
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Mark phase 07 entry before the pre-freeze readiness gate
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - phase-entry
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '07'
      run_once: true
      changed_when: false

- name: Phase 07 - Stage immutable cutover inputs before Neutron freeze
  hosts: control
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Discover neutron-server image on DB sync host
      ansible.builtin.command:
        argv: [docker, inspect, neutron_server, --format, '{% raw %}{{.Config.Image}}{% endraw %}']
      register: neutron_server_image
      run_once: true
      changed_when: false

    - name: Persist run-scoped preparation inputs before freeze
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/cutover_preparation.py", prepare,
               "{{ hostvars['localhost']['migration_run_dir'] }}", --image, "{{ neutron_server_image.stdout }}",
               --base, "{{ binding_timeout_base_seconds | int }}", --per-port, "{{ binding_timeout_seconds_per_port | int }}",
               --maximum, "{{ binding_timeout_max_seconds | int }}"]
      delegate_to: localhost
      register: cutover_preparation_result
      run_once: true
      changed_when: false

    - name: Publish prepared cutover values on the deployment host
      ansible.builtin.set_fact:
        cutover_preparation_runtime: "{{ cutover_preparation_result.stdout | from_json }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: Create private run-owned provider helper directory
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}"
        state: directory
        mode: '0700'
      run_once: true

    - name: Persist preparation directory ownership before staging files
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}/owner.json"
        content: "{{ hostvars['localhost']['cutover_preparation_runtime'] | to_nice_json }}"
        mode: '0600'
      run_once: true

    - name: Stage provider association helper on the DB sync host
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}/provider_associations.py"
        content: "{{ lookup('file', playbook_dir + '/../scripts/provider_associations.py') }}"
        mode: '0600'
      run_once: true

- name: Phase 07 - Prepare VM port checkpoint on the selected OVN CLI host
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Create private run-owned OVN CLI preparation directory
      ansible.builtin.file:
        path: "{{ cutover_preparation_runtime.directory }}"
        state: directory
        mode: '0700'
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Preserve OVN CLI preparation ownership
      ansible.builtin.copy:
        dest: "{{ cutover_preparation_runtime.directory }}/owner.json"
        content: "{{ cutover_preparation_runtime | to_nice_json }}"
        mode: '0600'
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Copy pre-existing VM port IDs before freeze
      ansible.builtin.copy:
        src: "{{ migration_run_dir }}/compute-port-ids.txt"
        dest: "{{ cutover_preparation_runtime.ports_path }}"
        mode: '0600'
      delegate_to: "{{ ovn_cli_host_runtime }}"

- name: Phase 07 - Prepare OpenFlow support while legacy agents and API are running
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Add OpenFlow15 before the final pre-freeze readiness checks
      ansible.builtin.include_tasks: openflow-preparation-tasks.yml
      vars:
        openflow_protocols: "{{ br_int_protocols }}"
        openflow_evidence_directory: "{{ hostvars['localhost']['migration_run_dir'] }}"

- name: Phase 07 - Complete readiness before starting the freeze timer
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Require authoritative Pair B MTU and workload readiness before any Neutron freeze
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} precutover-ready {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Check the original Pair A capture and anchor without resetting measurement
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} anchor-check {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: Mark phase 07 and control-plane downtime start
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '07'
          - start
          - --freeze-start
      run_once: true
      changed_when: false

- name: Phase 07 - Freeze all Neutron API workers
  hosts: control
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Stop and disable neutron-server through Kolla systemd
      ansible.builtin.systemd_service:
        name: "{{ neutron_server_unit }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Assert neutron-server container is stopped where present
      ansible.builtin.shell: |
        set -euo pipefail
        if docker inspect neutron_server >/dev/null 2>&1; then
          test "$(docker inspect neutron_server | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["State"]["Running"])')" = "False"
        fi
      args:
        executable: /bin/bash
      changed_when: false

- name: Phase 07 - Arm TCP probes after API freeze and before dataplane cutover
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Open the additional Pair D listener and retain its original TCP session
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} d-arm {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

- name: Phase 07 - Open additional N-S listeners after API freeze
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Open additional SNAT and FIP listeners while retaining held sessions
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/workload_validation.py') | quote }} ns-arm {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

- name: Phase 07 - Run Neutron to OVN DB migration exactly once
  hosts: control
  any_errors_fatal: true  # a failed DB sync/compatibility gate must block later plays on every host
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    provider_association_entrypoint: |
      set -euo pipefail
      kolla_set_configs
      exec /var/lib/kolla/venv/bin/python /opt/provider_associations.py "$@"
    provider_association_container_command: >-
      docker run --rm --network host --user root
      -e KOLLA_CONFIG_STRATEGY=COPY_ALWAYS
      -e KOLLA_SERVICE_NAME=neutron-server
      -v /etc/kolla/neutron-server:/var/lib/kolla/config_files:ro
      -v kolla_logs:/var/log/kolla
      -v {{ (hostvars['localhost']['cutover_preparation_runtime'].directory + '/provider_associations.py:/opt/provider_associations.py:ro') | quote }}
      --entrypoint /bin/bash {{ hostvars['localhost']['cutover_preparation_runtime'].neutron_image | quote }}
      -lc {{ provider_association_entrypoint | quote }} provider-associations
  tasks:
    - name: Snapshot ProviderResourceAssociation before authoritative migrate mode
      ansible.builtin.shell: |
        set -euo pipefail
        {{ provider_association_container_command }} snapshot
      args:
        executable: /bin/bash
      register: provider_associations_before
      run_once: true
      changed_when: false

    - name: Persist provider associations BEFORE on the deployment host
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] }}/provider-associations.before.json"
        content: "{{ provider_associations_before.stdout }}\n"
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: Mark DB migration start
      ansible.builtin.shell: |
        set -euo pipefail
        date +%s.%N > {{ (hostvars['localhost']['migration_run_dir'] + '/metrics/db_migration.start') | quote }}
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: Run neutron-ovn-db-sync-util migrate
      ansible.builtin.shell: |
        set -euo pipefail
        docker run --rm \
          --network host \
          --user root \
          -e KOLLA_CONFIG_STRATEGY=COPY_ALWAYS \
          -e KOLLA_SERVICE_NAME=neutron-server \
          -v /etc/kolla/neutron-server:/var/lib/kolla/config_files:ro \
          -v kolla_logs:/var/log/kolla \
          --entrypoint /bin/bash \
          {{ hostvars['localhost']['cutover_preparation_runtime'].neutron_image | quote }} \
          -lc '
            kolla_set_configs &&
            neutron-ovn-db-sync-util \
              --config-file /etc/neutron/neutron.conf \
              --config-file /etc/neutron/plugins/ml2/ml2_conf.ini \
              --ovn-neutron_sync_mode migrate
          '
      args:
        executable: /bin/bash
      register: db_sync_migrate
      failed_when: false  # persist both streams and return code, then fail before any compatibility update
      run_once: true

    - name: Persist authoritative migrate stdout stderr and return code
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] }}/db-sync-migrate.log"
        content: |
          returncode: {{ db_sync_migrate.rc }}
          --- stdout ---
          {{ db_sync_migrate.stdout }}
          --- stderr ---
          {{ db_sync_migrate.stderr }}
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: Stop Phase 07 immediately after a failed authoritative migration
      ansible.builtin.assert:
        that: db_sync_migrate.rc == 0
        fail_msg: "neutron-ovn-db-sync-util migrate failed (rc={{ db_sync_migrate.rc }}); see db-sync-migrate.log. Cutover is prohibited."
      run_once: true

    # Neutron 24.2.x migrate mode does not convert legacy L3 service provider
    # associations. Use the same in-place model UPDATE as newer upstream Neutron.
    - name: Apply Caracal L3 provider-association compatibility migration
      ansible.builtin.shell: |
        set -euo pipefail
        {{ provider_association_container_command }} migrate
      args:
        executable: /bin/bash
      register: provider_associations_migration
      changed_when: provider_associations_migration.rc == 0 and (provider_associations_migration.stdout | from_json).changed_count | int > 0
      run_once: true

    - name: Persist provider compatibility changed count on the deployment host
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] }}/provider-associations-compatibility.json"
        content: "{{ provider_associations_migration.stdout }}\n"
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: Snapshot ProviderResourceAssociation after compatibility conversion commits
      ansible.builtin.shell: |
        set -euo pipefail
        {{ provider_association_container_command }} snapshot
      args:
        executable: /bin/bash
      register: provider_associations_after
      run_once: true
      changed_when: false

    - name: Persist provider associations AFTER on the deployment host
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] }}/provider-associations.after.json"
        content: "{{ provider_associations_after.stdout }}\n"
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: Persist and enforce fail-closed verification of legacy provider associations
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/provider_associations.py"
          - verify
          - --run-dir
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
      delegate_to: localhost
      run_once: true

    - name: Mark DB migration end
      ansible.builtin.shell: |
        set -euo pipefail
        date +%s.%N > {{ (hostvars['localhost']['migration_run_dir'] + '/metrics/db_migration.end') | quote }}
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true
      changed_when: false

- name: Phase 07 - Verify migrated OVN topology exists
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Verify NB logical topology and SB datapaths
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-nbctl --db='{{ hostvars['localhost']['ovn_nb_connection_runtime'] }}' show | grep -E 'switch|router' >/dev/null
        test "$(docker exec ovn_northd ovn-sbctl --db='{{ hostvars['localhost']['ovn_sb_connection_runtime'] }}' list Datapath_Binding | grep -c '^_uuid')" -gt 0
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: Mark phase 07 end
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '07'
          - end
      run_once: true
      changed_when: false
