- name: "Phase 07 - Prepare Neutron API freeze and database migration"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] [TIMER] Start phase 07 before readiness checks"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - phase-entry
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '07'
      run_once: true
      changed_when: false

- name: "Phase 07 - Prepare database migration inputs before API freeze"
  hosts: control
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Resolve neutron-server image"
      ansible.builtin.command:
        argv: [docker, inspect, neutron_server, --format, '{% raw %}{{.Config.Image}}{% endraw %}']
      register: neutron_server_image
      run_once: true
      changed_when: false

    - name: "[07] [SAVE] Save cutover inputs and timeouts"
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/migration/cutover_preparation.py", prepare, "{{ hostvars['localhost']['migration_run_dir'] }}", --image, "{{ neutron_server_image.stdout
              }}", --base, "{{ binding_timeout_base_seconds | int }}", --per-port, "{{ binding_timeout_seconds_per_port | int }}", --maximum, "{{ binding_timeout_max_seconds
              | int }}"]
      delegate_to: localhost
      register: cutover_preparation_result
      run_once: true
      changed_when: false

    - name: "[07] Load prepared cutover settings"
      ansible.builtin.set_fact:
        cutover_preparation_runtime: "{{ cutover_preparation_result.stdout | from_json }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: "[07] Create run-owned router backend helper directory"
      ansible.builtin.file:
        path: "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}"
        state: directory
        mode: '0700'
      run_once: true

    - name: "[07] [SAVE] Save router backend helper ownership"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}/owner.json"
        content: "{{ hostvars['localhost']['cutover_preparation_runtime'] | to_nice_json }}"
        mode: '0600'
      run_once: true

    - name: "[07] [SAVE] Stage router backend association helper"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['cutover_preparation_runtime'].directory }}/provider_associations.py"
        content: "{{ lookup('file', playbook_dir + '/../scripts/migration/provider_associations.py') }}"
        mode: '0600'
      run_once: true

- name: "Phase 07 - Prepare existing VM port checkpoint"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Create run-owned OVN CLI directory"
      ansible.builtin.file:
        path: "{{ cutover_preparation_runtime.directory }}"
        state: directory
        mode: '0700'
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[07] [SAVE] Save OVN CLI directory ownership"
      ansible.builtin.copy:
        dest: "{{ cutover_preparation_runtime.directory }}/owner.json"
        content: "{{ cutover_preparation_runtime | to_nice_json }}"
        mode: '0600'
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[07] [SAVE] Copy existing VM port IDs to OVN CLI host"
      ansible.builtin.copy:
        src: "{{ migration_run_dir | run_file('compute-port-ids.txt') }}"
        dest: "{{ cutover_preparation_runtime.ports_path }}"
        mode: '0600'
      delegate_to: "{{ ovn_cli_host_runtime }}"


- name: "Phase 07 - Prepare OpenFlow support before API freeze"
  hosts: network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Enable OpenFlow15 on br-int"
      ansible.builtin.include_tasks: tasks/openflow-preparation-tasks.yml
      vars:
        openflow_protocols: "{{ br_int_protocols }}"
        openflow_evidence_directory: "{{ hostvars['localhost']['migration_run_dir'] }}"

- name: "Phase 07 - Verify metadata remains prepared without changing source service"
  hosts: neutron-ovn-metadata-agent
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
    - name: "[07] Verify prepared metadata container and disabled service before freeze"
      ansible.builtin.script:
        cmd: "../scripts/migration/metadata_handoff.py verify {{ {'run': hostvars['localhost']['migration_run_id'], 'expected': (hostvars['localhost']['metadata_preparation_result'].stdout | from_json).hosts[inventory_hostname]} | to_json | quote }}"
        executable: python3
      changed_when: false

- name: "Phase 07 - Check workloads before stopping Neutron API"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Check Group B MTU and workload readiness"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/workload_validation.py') | quote }} precutover-ready {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: "[07] Check original Group A capture and measurement anchor"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/workload_validation.py') | quote }} anchor-check {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: "[07] [TIMER] Start Neutron API downtime"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '07'
          - start
          - --freeze-start
      run_once: true
      changed_when: false

- name: "Phase 07 - Stop Neutron API workers"
  hosts: control
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Stop and disable neutron-server"
      ansible.builtin.systemd_service:
        name: "{{ neutron_server_unit }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: "[07] Check neutron-server containers are stopped"
      ansible.builtin.shell: |
        set -euo pipefail
        if docker inspect neutron_server >/dev/null 2>&1; then
          test "$(docker inspect neutron_server | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["State"]["Running"])')" = "False"
        fi
      args:
        executable: /bin/bash
      changed_when: false

- name: "Phase 07 - Arm Group D TCP probes after API freeze"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Open additional Group D listener and establish its session"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/workload_validation.py') | quote }} d-arm {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

- name: "Phase 07 - Arm N-S TCP probes after API freeze"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Open additional SNAT and FIP listeners"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/workload_validation.py') | quote }} ns-arm {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

- name: "Phase 07 - Migrate Neutron database to OVN"
  hosts: control
  any_errors_fatal: true # a failed DB sync/compatibility gate must block later plays on every host
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    provider_association_entrypoint: |
      set -euo pipefail
      kolla_set_configs
      exec /var/lib/kolla/venv/bin/python /opt/provider_associations.py "$@"
    provider_association_container_command: >-
      docker run --rm --network host --user root
      -e KOLLA_CONFIG_STRATEGY=COPY_ALWAYS
      -e KOLLA_SERVICE_NAME=neutron-server
      -v /etc/kolla/neutron-server:/var/lib/kolla/config_files:ro
      -v kolla_logs:/var/log/kolla
      -v {{ (hostvars['localhost']['cutover_preparation_runtime'].directory + '/provider_associations.py:/opt/provider_associations.py:ro') | quote }}
      --entrypoint /bin/bash {{ hostvars['localhost']['cutover_preparation_runtime'].neutron_image | quote }}
      -lc {{ provider_association_entrypoint | quote }} provider-associations
  tasks:
    - name: "[07] Read router service backend associations before migration"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ provider_association_container_command }} snapshot
      args:
        executable: /bin/bash
      register: provider_associations_before
      run_once: true
      changed_when: false

    - name: "[07] [SAVE] Save router service backend associations before migration"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('provider-associations.before.json') }}"
        content: "{{ provider_associations_before.stdout }}\n"
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: "[07] [TIMER] Start database migration measurement"
      ansible.builtin.shell: |
        set -euo pipefail
        date +%s.%N > {{ ((hostvars['localhost']['migration_run_dir'] | run_file('metrics/db_migration.start'))) | quote }}
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true
      changed_when: false

    - name: "[07] Run neutron-ovn-db-sync-util migrate"
      ansible.builtin.shell: |
        set -euo pipefail
        docker run --rm \
          --network host \
          --user root \
          -e KOLLA_CONFIG_STRATEGY=COPY_ALWAYS \
          -e KOLLA_SERVICE_NAME=neutron-server \
          -v /etc/kolla/neutron-server:/var/lib/kolla/config_files:ro \
          -v kolla_logs:/var/log/kolla \
          --entrypoint /bin/bash \
          {{ hostvars['localhost']['cutover_preparation_runtime'].neutron_image | quote }} \
          -lc '
            kolla_set_configs &&
            neutron-ovn-db-sync-util \
              --config-file /etc/neutron/neutron.conf \
              --config-file /etc/neutron/plugins/ml2/ml2_conf.ini \
              --ovn-neutron_sync_mode migrate
          '
      args:
        executable: /bin/bash
      register: db_sync_migrate
      failed_when: false # persist both streams and return code, then fail before any compatibility update
      run_once: true

    - name: "[07] [SAVE] Save database migration output and return code"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('db-sync-migrate.log') }}"
        content: |
          returncode: {{ db_sync_migrate.rc }}
          --- stdout ---
          {{ db_sync_migrate.stdout }}
          --- stderr ---
          {{ db_sync_migrate.stderr }}
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: "[07] Check database migration succeeded"
      ansible.builtin.assert:
        that: db_sync_migrate.rc == 0
        fail_msg: "neutron-ovn-db-sync-util migrate failed (rc={{ db_sync_migrate.rc }}); see db-sync-migrate.log. Cutover is prohibited."
      run_once: true

  # Neutron 24.2.x migrate mode does not convert legacy L3 service provider
  # associations. Use the same in-place model UPDATE as newer upstream Neutron.
    - name: "[07] Switch router service backend associations to OVN"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ provider_association_container_command }} migrate
      args:
        executable: /bin/bash
      register: provider_associations_migration
      changed_when: provider_associations_migration.rc == 0 and (provider_associations_migration.stdout | from_json).changed_count | int > 0
      run_once: true

    - name: "[07] [SAVE] Save router backend conversion result"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('provider-associations-compatibility.json') }}"
        content: "{{ provider_associations_migration.stdout }}\n"
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: "[07] Read router service backend associations after conversion"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ provider_association_container_command }} snapshot
      args:
        executable: /bin/bash
      register: provider_associations_after
      run_once: true
      changed_when: false

    - name: "[07] [SAVE] Save router service backend associations after conversion"
      ansible.builtin.copy:
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file('provider-associations.after.json') }}"
        content: "{{ provider_associations_after.stdout }}\n"
        mode: '0600'
      delegate_to: localhost
      run_once: true

    - name: "[07] Verify router backend conversion and save result"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/migration/provider_associations.py"
          - verify
          - --run-dir
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
      delegate_to: localhost
      run_once: true

    - name: "[07] [TIMER] End database migration measurement"
      ansible.builtin.shell: |
        set -euo pipefail
        date +%s.%N > {{ ((hostvars['localhost']['migration_run_dir'] | run_file('metrics/db_migration.end'))) | quote }}
      args:
        executable: /bin/bash
      delegate_to: localhost
      run_once: true
      changed_when: false

- name: "Phase 07 - Check migrated OVN topology"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[07] Check OVN logical topology and datapaths"
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec ovn_northd ovn-nbctl --db='{{ hostvars['localhost']['ovn_nb_connection_runtime'] }}' show | grep -E 'switch|router' >/dev/null
        test "$(docker exec ovn_northd ovn-sbctl --db='{{ hostvars['localhost']['ovn_sb_connection_runtime'] }}' list Datapath_Binding | grep -c '^_uuid')" -gt 0
      args:
        executable: /bin/bash
      run_once: true
      changed_when: false
      delegate_to: "{{ ovn_cli_host_runtime }}"
    - name: "[07] [TIMER] End phase 07"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '07'
          - end
      run_once: true
      changed_when: false
