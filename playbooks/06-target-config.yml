- name: "Phase 06 - Prepare OVN configuration and network MTU"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[06] [TIMER] Start phase 06"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '06'
          - start
      run_once: true
      changed_when: false

    - name: "[06] Write target ML2/OVN settings"
      ansible.builtin.lineinfile:
        path: "{{ kolla_globals_path }}"
        regexp: "^{{ item.key }}:"
        line: '{{ item.key }}: "{{ item.value }}"'
        insertafter: EOF
      loop:
        - {key: neutron_plugin_agent, value: "{{ target_neutron_plugin_agent }}"}
        - {key: neutron_type_drivers, value: "{{ neutron_type_drivers_target }}"}
        - {key: neutron_tenant_network_types, value: "{{ target_tenant_network_type }}"}
        - {key: enable_ovn, value: 'yes'}
        - {key: enable_openvswitch, value: 'yes'}
        - {key: neutron_ovn_dhcp_agent, value: 'no'}
        - {key: neutron_ovn_distributed_fip, value: 'no'}
        - {key: neutron_enable_ovn_agent, value: 'no'}
        - {key: enable_neutron_dvr, value: 'no'}
        - {key: enable_neutron_agent_ha, value: 'no'}

    - name: "[06] Reduce VXLAN network MTU for Geneve"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        # Retain original-to-target pairs across preparation retries.
        mtu_journal={{ ((migration_run_dir | run_file('network-mtu-migration.tsv'))) | quote }}
        touch "$mtu_journal"
        for id in $(openstack network list -f value -c ID); do
          type=$(openstack network show "$id" -f value -c provider:network_type)
          [ "$type" = "{{ source_tenant_network_type }}" ] || continue
          old=$(openstack network show "$id" -f value -c mtu)
          new=$(awk -v id="$id" '$1 == id {print $3}' "$mtu_journal")
          if [ -z "$new" ]; then
            new=$((old - {{ mtu_delta_vxlan_to_geneve }}))
            printf '%s\t%s\t%s\n' "$id" "$old" "$new" >> "$mtu_journal"
          fi
          test "$new" -gt 0
          if [ "$old" -ne "$new" ]; then
            openstack network set --mtu "$new" "$id"
          fi
        done
      args:
        executable: /bin/bash

    - name: "[06] Check validation VM MTU convergence before API freeze"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/../scripts/validation/workload_validation.py') | quote }} prepare-dhcp {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      when: validation_workloads_enabled | bool

    - name: "[06] Generate target Neutron configuration without restart"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} genconfig --tags neutron
      args:
        executable: /bin/bash

- name: "Phase 06 - Finish metadata preparation and target configuration"
  import_playbook: 06-prepared-metadata.yml
