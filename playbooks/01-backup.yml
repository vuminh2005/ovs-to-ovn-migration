- name: "Phase 01 - Back up source configuration and resource identities"
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: "[01] [TIMER] Start phase 01"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '01'
          - start
      run_once: true
      changed_when: false

    - name: "[01] [SAVE] Back up Kolla configuration and inventory"
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0600"
      loop:
        - {src: "{{ kolla_globals_path }}", dest: "{{ migration_run_dir | run_file('globals.yml.before') }}"}
        - {src: "{{ kolla_inventory_runtime }}", dest: "{{ migration_run_dir | run_file('inventory.before') }}"}

    - name: "[01] [SAVE] Record source resource identities"
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        openstack network list -f json > {{ migration_run_dir | run_file('networks.before.json') }}
        openstack subnet list -f json > {{ migration_run_dir | run_file('subnets.before.json') }}
        openstack router list -f json > {{ migration_run_dir | run_file('routers.before.json') }}
        openstack server list --all-projects -f json > {{ migration_run_dir | run_file('servers.before.json') }}
        openstack port list -f json > {{ migration_run_dir | run_file('ports.before.json') }}
        openstack port list --device-owner compute:nova -f json > {{ migration_run_dir | run_file('compute-ports.before.json') }}
        openstack port list --device-owner compute:nova -f value -c ID | sort > {{ migration_run_dir | run_file('compute-port-ids.txt') }}
        openstack network agent list -f json > {{ migration_run_dir | run_file('agents.before.json') }}
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[01] [SAVE] Save source resource counts"
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import sys
        sys.path.insert(0, '{{ playbook_dir }}/../scripts')
        from _paths import configure; configure()
        from run_layout import run_path, run_glob
        import json, pathlib
        root = pathlib.Path("{{ migration_run_dir }}")
        keys = {
          "networks": "networks.before.json",
          "subnets": "subnets.before.json",
          "routers": "routers.before.json",
          "servers": "servers.before.json",
          "ports": "ports.before.json",
          "compute_ports": "compute-ports.before.json",
        }
        out = {k: len(json.loads((run_path(root, f)).read_text())) for k,f in keys.items()}
        (run_path(root, "resource-counts.before.json")).write_text(json.dumps(out, indent=2, sort_keys=True))
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[01] Load source network count"
      ansible.builtin.set_fact:
        source_network_count_runtime: "{{ (lookup('file', (migration_run_dir | run_file('resource-counts.before.json'))) | from_json).networks | int }}"

    - name: "[01] [SAVE] Back up MariaDB through Kolla"
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} mariadb_backup
      args:
        executable: /bin/bash
      when: run_mariadb_backup | bool

    - name: "[01] Locate MariaDB backup volumes"
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json, pathlib, socket, subprocess, time
        proc = subprocess.run(['docker', 'volume', 'inspect', 'mariadb_backup'], capture_output=True, text=True)
        result = dict(host=socket.gethostname(), volume='mariadb_backup', collected_at=time.time(), files=[])
        if proc.returncode:
            if 'no such volume' not in proc.stderr.lower():
                raise RuntimeError('Cannot inspect MariaDB backup volume')
            result['status'] = 'NOT_PRESENT'
        else:
            volume = json.loads(proc.stdout)[0]
            directory = pathlib.Path(volume['Mountpoint'])
            result.update(status='PRESENT', mountpoint=str(directory))
            result['files'] = [dict(name=str(p.relative_to(directory)), size_bytes=p.stat().st_size,
                                    modified_at=p.stat().st_mtime)
                               for p in sorted(directory.rglob('*')) if p.is_file() and not p.is_symlink()]
        print(json.dumps(result))
        PY
      args:
        executable: /bin/bash
      delegate_to: "{{ item }}"
      loop: "{{ groups['mariadb'] | default(groups['control']) }}"
      register: mariadb_backup_locations
      changed_when: false
      when: run_mariadb_backup | bool

    - name: "[01] [SAVE] Save MariaDB backup locations"
      ansible.builtin.copy:
        dest: "{{ migration_run_dir | run_file('mariadb-backup.json') }}"
        mode: '0600'
        content: "{{ {'enabled': run_mariadb_backup | bool, 'volume': 'mariadb_backup', 'locations': mariadb_backup_locations.results | default([]) | selectattr('stdout', 'defined') | map(attribute='stdout') | map('from_json') | list, 'scope': 'Location and file metadata only; database backups remain in Kolla volumes'} | to_nice_json }}"


- name: Phase 01 - Initialize source rollback coverage
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
  - name: '[01] Build complete rollback host roles'
    ansible.builtin.set_fact:
      rollback_hosts: '{{ rollback_hosts | default({}) | combine({item: {''control'': item in groups[''control''], ''network'': item in groups[''network''],
        ''compute'': item in groups[''compute''], ''chassis'': item in (groups[''network''] + groups[''compute'']), ''database'': rollback_database_name
        | default(''neutron'')}}) }}'
    loop: '{{ (groups[''control''] + groups[''network''] + groups[''compute''] + (groups[''mariadb''] | default(groups[''control'']))) | unique
      | list }}'
  - name: '[01] Initialize immutable rollback specification'
    ansible.builtin.command:
      argv:
      - python3
      - '{{ playbook_dir }}/../scripts/recovery/rollback_controller.py'
      - init
      - '{{ migration_run_dir }}'
      - '{{ {''db_host'': (groups[''mariadb''] | default(groups[''control'']))[0], ''database'': rollback_database_name | default(''neutron''),
        ''shadow_size'': rollback_shadow_tmpfs_size | default(''2g''), ''hosts'': rollback_hosts, ''openrc'': openrc_path} | to_json }}'
    changed_when: false
  vars_files:
  - ../group_vars/all.yml
- name: Phase 01 - Snapshot original per-host configuration
  hosts: control:network:compute:mariadb
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
  - name: '[01] Create private source rollback directory'
    ansible.builtin.file:
      path: /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}
      state: directory
      mode: '0700'
  - name: '[01] [SAVE] Stage standalone rollback helpers'
    ansible.builtin.copy:
      src: '../scripts/recovery/{{ item }}'
      dest: /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/{{ item }}
      mode: '0600'
    loop:
    - rollback_common.py
    - rollback_host.py
    - rollback_database.py
    - rollback_nova_native.py
  - name: '[01] Capture original per-host config and container identities'
    ansible.builtin.command:
      argv:
      - python3
      - /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/rollback_host.py
      - source
      - '{{ rollback_source_config | to_json }}'
    changed_when: false
  - name: '[01] [SAVE] Fetch private original configuration and manifest'
    ansible.builtin.fetch:
      src: /var/lib/ovs-to-ovn-rollback/{{ hostvars['localhost']['migration_run_id'] }}/{{ item.src }}
      dest: '{{ hostvars[''localhost''][''migration_run_dir''] }}/rollback/source/{{ inventory_hostname }}.{{ item.suffix }}'
      flat: true
    loop:
    - src: source.json
      suffix: json
    - src: source.tar
      suffix: tar
  vars:
    rollback_source_config:
      run: '{{ hostvars[''localhost''][''migration_run_id''] }}'
      host: '{{ inventory_hostname }}'
      control: '{{ inventory_hostname in groups[''control''] }}'
      compute: '{{ inventory_hostname in groups[''compute''] }}'
      chassis: '{{ inventory_hostname in (groups[''network''] + groups[''compute'']) }}'
      network: '{{ inventory_hostname in groups[''network''] }}'
      database: '{{ rollback_database_name | default(''neutron'') }}'

- name: Phase 01 - Complete source backup
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  tasks:
  - name: '[01] [TIMER] End phase 01'
    ansible.builtin.command:
      argv:
      - python3
      - '{{ playbook_dir }}/../scripts/common/phase_schema.py'
      - mark
      - '{{ hostvars[''localhost''][''migration_run_dir''] }}'
      - '01'
      - end
    run_once: true
    changed_when: false
