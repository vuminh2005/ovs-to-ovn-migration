---
- name: Phase 1 - Backup source configuration and resource identity
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Mark backup phase start
      ansible.builtin.shell: date +%s.%N > {{ migration_run_dir }}/metrics/phase01.start
      changed_when: false

    - name: Backup Kolla globals and actual inventory source
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        remote_src: true
        mode: "0600"
      loop:
        - { src: "{{ kolla_globals_path }}", dest: "{{ migration_run_dir }}/globals.yml.before" }
        - { src: "{{ kolla_inventory_runtime }}", dest: "{{ migration_run_dir }}/inventory.before" }

    - name: Snapshot source OpenStack resources in machine-readable form
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path }}
        openstack network list -f json > {{ migration_run_dir }}/networks.before.json
        openstack subnet list -f json > {{ migration_run_dir }}/subnets.before.json
        openstack router list -f json > {{ migration_run_dir }}/routers.before.json
        openstack server list --all-projects -f json > {{ migration_run_dir }}/servers.before.json
        openstack port list -f json > {{ migration_run_dir }}/ports.before.json
        openstack port list --device-owner compute:nova -f json > {{ migration_run_dir }}/compute-ports.before.json
        openstack port list --device-owner compute:nova -f value -c ID | sort > {{ migration_run_dir }}/compute-port-ids.txt
        openstack network agent list -f json > {{ migration_run_dir }}/agents.before.json
      args:
        executable: /bin/bash
      changed_when: false

    - name: Save compact source resource counts
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import json, pathlib
        root = pathlib.Path("{{ migration_run_dir }}")
        keys = {
          "networks": "networks.before.json",
          "subnets": "subnets.before.json",
          "routers": "routers.before.json",
          "servers": "servers.before.json",
          "ports": "ports.before.json",
          "compute_ports": "compute-ports.before.json",
        }
        out = {k: len(json.loads((root/f).read_text())) for k,f in keys.items()}
        (root/"resource-counts.before.json").write_text(json.dumps(out, indent=2, sort_keys=True))
        PY
      args:
        executable: /bin/bash
      changed_when: false

    - name: Publish source network count for remote validation guards
      ansible.builtin.set_fact:
        source_network_count_runtime: "{{ (lookup('file', migration_run_dir + '/resource-counts.before.json') | from_json).networks | int }}"

    - name: Run Kolla MariaDB backup
      ansible.builtin.shell: |
        set -euo pipefail
        {{ kolla_ansible_bin_runtime }} -i {{ kolla_inventory_runtime }} mariadb_backup
      args:
        executable: /bin/bash
      when: run_mariadb_backup | bool

    - name: Mark backup phase end
      ansible.builtin.shell: date +%s.%N > {{ migration_run_dir }}/metrics/phase01.end
      changed_when: false
