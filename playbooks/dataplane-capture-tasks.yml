# Invoked by the validation helper using the checkpointed inventory/delegate.
- name: "[GROUP A] Manage Group A capture on compute"
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "[GROUP A] Create run-owned capture directory"
      ansible.builtin.file:
        path: "{{ capture_checkpoint.directory }}"
        state: directory
        mode: '0700'
      delegate_to: "{{ capture_checkpoint.compute_host }}"
      when: capture_action in ['resolve', 'start']
    - name: "[GROUP A] [SAVE] Refresh capture identity helper"
      ansible.builtin.copy:
        src: "../scripts/{{ item }}"
        dest: "{{ capture_checkpoint.directory }}/{{ item }}"
        mode: '0700'
        force: true
      loop: [dataplane_capture.py, run_layout.py]
      delegate_to: "{{ capture_checkpoint.compute_host }}"
      when: capture_action != 'remove'
    - name: "[GROUP A] Start, reuse, inspect or stop Group A capture"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ capture_checkpoint.directory }}/dataplane_capture.py"
          - "{{ capture_action }}"
          - "{{ capture_checkpoint.directory }}"
          - "{{ capture_checkpoint | to_json }}"
      delegate_to: "{{ capture_checkpoint.compute_host }}"
      register: capture_operation
      when: capture_action != 'remove'
    - name: "[GROUP A] [SAVE] Save capture process state"
      ansible.builtin.copy:
        dest: "{{ capture_root | run_file('capture-remote-state.json') }}"
        content: "{{ capture_operation.stdout }}"
        mode: '0600'
      when: capture_action != 'remove'
    - name: "[GROUP A] [SAVE] Fetch original PCAP and capture logs"
      ansible.builtin.fetch:
        src: "{{ capture_checkpoint.directory }}/{{ item }}"
        dest: "{{ capture_root | run_file(item) }}"
        flat: true
      loop: [measure0.pcap, tcpdump.log, capture-state.json, supervisor.log]
      delegate_to: "{{ capture_checkpoint.compute_host }}"
      when: capture_action == 'stop'
    - name: "[GROUP A] Remove stopped capture copy after successful reporting"
      ansible.builtin.file:
        path: "{{ capture_checkpoint.directory }}"
        state: absent
      delegate_to: "{{ capture_checkpoint.compute_host }}"
      when: capture_action == 'remove'
