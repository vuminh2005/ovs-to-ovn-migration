---
- name: Work Item 2 - Collect all intended host identities and retention scopes before destruction
  hosts: control:network:compute
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars:
    ansible_ssh_common_args: "-o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ reset_management_known_hosts | quote }}"
  tasks:
    - name: Create controller-only private host evidence directory
      ansible.builtin.file:
        path: "{{ reset_output }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      run_once: true

    - name: Inspect only current host and Docker storage through the reviewed read-only helper
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/../scripts/reset_host_preflight.py {{ (({'action': 'identity'} if reset_probe_identity_only else reset_probe[inventory_hostname]) | to_json | b64encode) | quote }}"
        executable: python3
      register: reset_host_query
      changed_when: false
      # Helper emits path/identity/mount metadata only. Keep its sanitized failure
      # reason in the private stage log so retention refusals are actionable.

    - name: Save private host retention evidence on the deployment controller
      ansible.builtin.copy:
        dest: "{{ reset_output }}/{{ inventory_hostname }}"
        content: "{{ reset_host_query.stdout | from_json | to_nice_json }}"
        mode: '0600'
      delegate_to: localhost
      no_log: true
