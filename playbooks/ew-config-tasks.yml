---
- name: Require verified existing EW management access and bounded observation settings
  ansible.builtin.assert:
    that:
      - ew_guest_ssh_key | length > 0
      - ew_guest_known_hosts | length > 0
      - ew_host_known_hosts | length > 0
      - ew_stable_samples | int >= 3
      - ew_stable_samples | int <= 10
      - ew_recovery_observation_seconds | float < ew_readiness_timeout_seconds | float
      - ew_drain_seconds | float > 0
      - ew_baseline_seconds | float > 0
      - ew_baseline_seconds | float <= ew_maximum_lifetime_seconds | float
      - ew_tcp_experiment_ports | length == 2
      - ew_tcp_experiment_ports | unique | length == 2
      - ew_tcp_experiment_ports | map('int') | min > 1024
      - ew_tcp_experiment_ports | map('int') | max <= 65535
      - 8080 not in ew_tcp_experiment_ports
      - 5432 not in ew_tcp_experiment_ports
      - 5672 not in ew_tcp_experiment_ports
    fail_msg: Configure verified EW guest/host SSH access; measurement does not create access ports, keys, security rules or namespaces.

- name: Persist non-secret EW measurement and transport configuration
  ansible.builtin.copy:
    dest: "{{ migration_run_dir }}/ew-measurement-config.json"
    mode: '0600'
    content: >-
      {{ {'enabled': true, 'inventory': kolla_inventory_runtime,
          'namespace_hosts': ew_namespace_hosts if ew_namespace_hosts | length > 0 else ((groups['network'] + groups['compute']) | unique | list),
          'guest_user': ew_guest_ssh_user, 'guest_key': ew_guest_ssh_key, 'guest_known_hosts': ew_guest_known_hosts,
          'host_key': ew_host_ssh_key, 'host_known_hosts': ew_host_known_hosts,
          'host_access': ew_host_access, 'direct_access': ew_guest_direct_access,
          'baseline_seconds': ew_baseline_seconds | float, 'maximum_lifetime': ew_maximum_lifetime_seconds | float,
          'drain': ew_drain_seconds | float, 'transport_timeout': ew_transport_timeout_seconds | float,
          'collection_timeout': ew_collection_timeout_seconds | float, 'readiness_timeout': ew_readiness_timeout_seconds | float,
          'recovery_seconds': ew_recovery_observation_seconds | float, 'interval': ew_probe_interval_seconds | float,
          'api_interval': ew_api_probe_interval_seconds | float, 'max_rate': ew_max_jobs_per_second | float,
          'slo': ew_task_slo_seconds | float, 'stable_samples': ew_stable_samples | int,
          'tcp_experiment_enabled': ew_tcp_experiment_enabled | bool, 'tcp_ports': ew_tcp_experiment_ports,
          'maximum_collection_bytes': ew_maximum_collection_bytes | int} | to_nice_json }}
