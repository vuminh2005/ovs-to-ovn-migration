---
- name: Prepare or verify additive OpenFlow15 support on the original br-int
  ansible.builtin.script: "../scripts/openflow_prepare.py {{ openflow_protocols | quote }} {{ '--check' if openflow_check_only | default(false) | bool else '' }}"
  args:
    executable: python3
  register: prepared_openflow
  changed_when: prepared_openflow.rc == 0 and (prepared_openflow.stdout | from_json).changed | bool

- name: Persist OpenFlow bridge identity and protocol evidence
  ansible.builtin.copy:
    dest: "{{ openflow_evidence_directory }}/openflow-{{ openflow_evidence_stage | default('preparation') }}-{{ inventory_hostname }}.json"
    content: "{{ prepared_openflow.stdout | from_json | to_nice_json }}"
    mode: '0600'
  delegate_to: localhost
