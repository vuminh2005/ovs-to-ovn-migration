- name: "Phase 06 - Prepare metadata and finish target configuration"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../../group_vars/all.yml
  tasks:
    - name: "[06] Prepare disabled OVN metadata containers before API freeze"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/migration/prepare_metadata.py"
          - "{{ migration_run_dir }}"
          - --kolla-ansible
          - "{{ kolla_ansible_bin_runtime }}"
          - --inventory
          - "{{ kolla_inventory_runtime }}"
          - --globals
          - "{{ kolla_globals_path }}"
      register: metadata_preparation_result

    - name: "[06] Require preparation for every configured metadata host"
      ansible.builtin.assert:
        that:
          - (metadata_preparation_result.stdout | from_json).status == 'PASS'
          - (metadata_preparation_result.stdout | from_json).hosts.keys() | list | sort == groups['neutron-ovn-metadata-agent'] | sort
          - groups['neutron-ovn-metadata-agent'] | length > 0
          - groups['neutron-ovn-metadata-agent'] | difference(chassis_hosts_runtime) | length == 0

- name: "Phase 06 - Resolve generated OVN database endpoints"
  hosts: control
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../../group_vars/all.yml
  tasks:
    - name: "[06] Read generated Neutron settings"
      ansible.builtin.shell: |
        set -euo pipefail
        ml2=/etc/kolla/neutron-server/ml2_conf.ini
        neutron=/etc/kolla/neutron-server/neutron.conf
        grep -Eq '^mechanism_drivers[[:space:]]*=[[:space:]]*ovn' "$ml2"
        grep -Eq '^tenant_network_types[[:space:]]*=[[:space:]]*geneve' "$ml2"
        grep -Eq '^service_plugins[[:space:]]*=[[:space:]]*ovn-router' "$neutron"
        nb=$(awk -F= '/^ovn_nb_connection[[:space:]]*=/{sub(/^[^=]*=[[:space:]]*/,""); print; exit}' "$ml2")
        sb=$(awk -F= '/^ovn_sb_connection[[:space:]]*=/{sub(/^[^=]*=[[:space:]]*/,""); print; exit}' "$ml2")
        test -n "$nb" && test -n "$sb"
        printf '%s\n%s\n' "$nb" "$sb"
      args:
        executable: /bin/bash
      register: generated_ovn_connections
      run_once: true
      changed_when: false

    - name: "[06] Load OVN database endpoints"
      ansible.builtin.set_fact:
        ovn_nb_connection_runtime: "{{ generated_ovn_connections.stdout_lines[0] }}"
        ovn_sb_connection_runtime: "{{ generated_ovn_connections.stdout_lines[1] }}"
      delegate_to: localhost
      delegate_facts: true
      run_once: true

    - name: "[06] [SAVE] Save generated target configuration"
      ansible.builtin.fetch:
        src: "{{ item.src }}"
        dest: "{{ hostvars['localhost']['migration_run_dir'] | run_file(item.dest) }}"
        flat: true
      loop:
        - {src: /etc/kolla/neutron-server/ml2_conf.ini, dest: ml2_conf.ini.target}
        - {src: /etc/kolla/neutron-server/neutron.conf, dest: neutron.conf.target}
      run_once: true

- name: "Phase 06 - Start OVN database monitoring"
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - ../../group_vars/all.yml
  tasks:
    - name: "[06] [SAVE] Save database monitor endpoints"
      ansible.builtin.copy:
        dest: "{{ migration_run_dir | run_file('diagnostics-central-config.json') }}"
        content: "{{ {'nb': ovn_nb_connection_runtime, 'sb': ovn_sb_connection_runtime} | to_nice_json }}"
        mode: '0600'
    - name: "[06] Start Northbound and Southbound change monitors"
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../../scripts/diagnostics/diagnostics_control.py", start, "{{ migration_run_dir }}", --role, central]
      changed_when: false
      when: migration_diagnostics_enabled | bool
    - name: "[06] [TIMER] End phase 06"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/common/phase_schema.py"
          - mark
          - "{{ hostvars['localhost']['migration_run_dir'] }}"
          - '06'
          - end
      delegate_to: localhost
      run_once: true
      changed_when: false
