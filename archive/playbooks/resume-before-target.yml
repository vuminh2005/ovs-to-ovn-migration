# Archived reference: unsupported by the current metadata/capture workflow.
- name: Stop archived migration recovery before any checkpoint or host action
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse execution of an archived migration recovery route
      ansible.builtin.fail:
        msg: This recovery route is archived and unsupported by the current metadata/capture workflow. See README.md for the fresh lab baseline procedure; preserve existing run evidence.

- name: Recover a failed phase 05 before any target configuration or freeze
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - ../../group_vars/all.yml
  tasks:
    - name: Require an explicit checkpoint and full original inventory
      ansible.builtin.assert:
        that:
          - migration_resume_run_dir is match('^/')
          - ansible_inventory_sources | length == 1
          - ansible_limit | default('') | length == 0
          - not ansible_check_mode

    - name: Require an incomplete phase 05 without target changes or later markers
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/recovery/pre_stage_recovery.py", inspect, "{{ migration_resume_run_dir }}", --inventory, "{{ ansible_inventory_sources[0] }}"]
      register: pre_stage_checkpoint
      changed_when: false

    - name: Restore original runtime workload settings and measurement identity
      ansible.builtin.set_fact:
        pre_stage_runtime: "{{ (pre_stage_checkpoint.stdout | from_json).runtime }}"
        pre_stage_workload: "{{ (pre_stage_checkpoint.stdout | from_json).workload_config }}"
        migration_run_dir: "{{ (pre_stage_checkpoint.stdout | from_json).root }}"
        migration_run_id: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.run_id }}"
        kolla_inventory_runtime: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.inventory }}"
        kolla_ansible_bin_runtime: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.kolla_ansible }}"
        kolla_globals_path: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.globals }}"
        openrc_path: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.openrc }}"
        ovn_cli_host_runtime: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.ovn_cli_host }}"
        db_sync_host_runtime: "{{ (pre_stage_checkpoint.stdout | from_json).runtime.db_sync_host }}"
        chassis_hosts_runtime: "{{ ((groups['network'] | default([])) + (groups['compute'] | default([]))) | unique | list }}"
        chassis_count_runtime: "{{ ((groups['network'] | default([])) + (groups['compute'] | default([]))) | unique | length }}"
        source_network_count_runtime: "{{ (pre_stage_checkpoint.stdout | from_json).source_network_count }}"
        validation_workloads_enabled: "{{ (pre_stage_checkpoint.stdout | from_json).workloads_enabled }}"

    - name: Require unchanged inventory topology and live source image selectors
      ansible.builtin.assert:
        that:
          - groups['control'] | sort == pre_stage_runtime.control_hosts | sort
          - groups['network'] | sort == pre_stage_runtime.network_hosts | sort
          - groups['compute'] | sort == pre_stage_runtime.compute_hosts | sort
          - (lookup('file', kolla_globals_path) | from_yaml).neutron_plugin_agent == 'openvswitch'
          - (lookup('file', kolla_globals_path) | from_yaml).openstack_release | string == supported_openstack_release

    - name: Restore workload options without recreating workloads or baselines
      ansible.builtin.set_fact:
        validation_pair_compute_hosts: "{{ [pre_stage_workload.placement['0'].inventory_host, pre_stage_workload.placement['1'].inventory_host] }}"
        validation_pair_d_enabled: "{{ pre_stage_workload.pair_d_enabled | bool }}"
        validation_ns_enabled: "{{ pre_stage_workload.get('ns', {}).get('enabled', false) | bool }}"
        validation_ew_matrix_enabled: "{{ pre_stage_workload.get('ew_matrix_enabled', false) | bool }}"
        target_geneve_mtu: "{{ pre_stage_workload.target_mtu | int }}"
        validation_allow_pre_cutover_guest_reboot: "{{ pre_stage_workload.allow_pre_cutover_guest_reboot | bool }}"
        validation_allow_post_cutover_guest_reboot: "{{ pre_stage_workload.allow_post_cutover_guest_reboot | bool }}"
        validation_post_cutover_dhcp_timeout_seconds: "{{ pre_stage_workload.post_cutover_timeout | int }}"
      when: validation_workloads_enabled | bool

- name: Verify the live OVS source is still running before continuing phase 05
  hosts: control:network:compute
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Require the live Neutron API process and OVS mechanism before target config
      ansible.builtin.shell: |
        set -euo pipefail
        docker inspect neutron_server | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
        docker exec neutron_server python3 -c 'import configparser; c=configparser.ConfigParser(); c.read("/etc/neutron/plugins/ml2/ml2_conf.ini"); drivers={v.strip() for v in c.get("ml2", "mechanism_drivers").split(",")}; assert "openvswitch" in drivers and "ovn" not in drivers; assert c.get("ml2", "tenant_network_types").strip()=="vxlan"'
      args:
        executable: /bin/bash
      changed_when: false
      when: inventory_hostname in groups['control']

    - name: Require source OVS agents on every original chassis
      ansible.builtin.shell: |
        set -euo pipefail
        docker inspect neutron_openvswitch_agent | python3 -c 'import json,sys; assert json.load(sys.stdin)[0]["State"]["Running"] is True'
        docker exec openvswitch_vswitchd ovs-vsctl br-exists br-int
      args:
        executable: /bin/bash
      changed_when: false
      when: inventory_hostname in (groups['network'] + groups['compute'])

- name: Retain recovery timing before resuming staging
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Record recovery pause without rewriting original run or probe baselines
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../scripts/recovery/pre_stage_recovery.py", record, "{{ migration_run_dir }}", --inventory, "{{ kolla_inventory_runtime }}"]
      changed_when: true

- import_playbook: ../../playbooks/05-stage-ovn-db.yml
- import_playbook: ../../playbooks/06-target-config.yml
- import_playbook: ../../playbooks/07-migrate-db.yml
- import_playbook: ../../playbooks/08-cutover.yml
- import_playbook: ../../playbooks/09-cleanup.yml
- import_playbook: ../../playbooks/10-restore-neutron.yml
- import_playbook: ../../playbooks/11-validate.yml
- import_playbook: ../../playbooks/12-workload-validation.yml
- import_playbook: ../../playbooks/13-report.yml
