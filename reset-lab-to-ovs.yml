---
# Destructive lab reset:
#   post-migration OpenStack/Kolla -> clean ML2/OVS source deployment
#
# Run from lab2-controller:
#   source /root/venvs/kolla-2024.1/bin/activate
#   ansible-playbook -i /root/multinode reset-lab-to-ovs.yml \
#     -e reset_lab_confirm=true
#
# Optional: also remove /root/ovs-to-ovn-backup
#   -e reset_delete_migration_backups=true
#
# Intentionally preserved:
#   /root/venvs/kolla-2024.1
#   /root/multinode
#   /etc/kolla/passwords.yml
#   Docker images
#   SSH keys / users / hostnames
#   neutron-ext

- name: Guard destructive reset and save controller-side configuration snapshot
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    reset_lab_confirm: false
    reset_kolla_venv: /root/venvs/kolla-2024.1
    reset_kolla_inventory: /root/multinode
    reset_globals_path: /etc/kolla/globals.yml
    reset_config_path: /etc/kolla/config
    reset_backup_root: /root/ovs-to-ovn-backup
    reset_delete_migration_backups: false
    reset_snapshot_root: /root/kolla-reset-snapshots
  tasks:
    - name: Require explicit destructive reset confirmation
      ansible.builtin.assert:
        that:
          - reset_lab_confirm | bool
        fail_msg: >-
          This playbook destroys the current Kolla/OpenStack deployment.
          Re-run with -e reset_lab_confirm=true.

    - name: Verify required local files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ reset_kolla_venv }}/bin/kolla-ansible"
        - "{{ reset_kolla_inventory }}"
        - /etc/kolla/passwords.yml
      register: reset_required_files

    - name: Fail when required local files are missing
      ansible.builtin.assert:
        that:
          - reset_required_files.results | map(attribute='stat.exists') | min
        fail_msg: "Kolla venv, inventory, or /etc/kolla/passwords.yml is missing."

    - name: Create one reset snapshot identifier
      ansible.builtin.set_fact:
        reset_snapshot_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    - name: Create reset snapshot directory
      ansible.builtin.file:
        path: "{{ reset_snapshot_root }}/{{ reset_snapshot_id }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Preserve current globals.yml before reset
      ansible.builtin.copy:
        src: "{{ reset_globals_path }}"
        dest: "{{ reset_snapshot_root }}/{{ reset_snapshot_id }}/globals.yml.before"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: lookup('ansible.builtin.fileglob', reset_globals_path, wantlist=True) | length > 0

    - name: Preserve current custom Kolla config before reset
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -d {{ reset_config_path | quote }} ]; then
          tar -C /etc/kolla -czf \
            {{ (reset_snapshot_root + '/' + reset_snapshot_id + '/config.before.tgz') | quote }} \
            config
          chmod 0600 \
            {{ (reset_snapshot_root + '/' + reset_snapshot_id + '/config.before.tgz') | quote }}
        fi
      args:
        executable: /bin/bash
      changed_when: true


- name: Stop running libvirt guests before Kolla destroy
  hosts: compute
  gather_facts: false
  become: true
  tasks:
    - name: Stop all running guests only when nova_libvirt container exists
      ansible.builtin.shell: |
        set -euo pipefail

        if [ -n "$(docker ps -q --filter name=^/nova_libvirt$)" ]; then
          running="$(docker exec nova_libvirt virsh list --name)"
          if [ -n "$running" ]; then
            while IFS= read -r vm; do
              [ -n "$vm" ] || continue
              docker exec nova_libvirt virsh destroy "$vm"
            done <<< "$running"
          fi
        fi
      args:
        executable: /bin/bash
      changed_when: true


- name: Destroy the current Kolla deployment from the deployment host
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    reset_kolla_venv: /root/venvs/kolla-2024.1
    reset_kolla_inventory: /root/multinode
  tasks:
    - name: Run kolla-ansible destroy
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_kolla_venv + '/bin/activate') | quote }}
        kolla-ansible -i {{ reset_kolla_inventory | quote }} destroy \
          --yes-i-really-really-mean-it
      args:
        executable: /bin/bash
      register: reset_destroy
      changed_when: true

    - name: Show destroy summary
      ansible.builtin.debug:
        var: reset_destroy.stdout_lines


- name: Verify Kolla runtime residue after destroy
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: List remaining containers
      ansible.builtin.command: docker ps -a
      register: reset_containers
      changed_when: false

    - name: List remaining Docker volumes
      ansible.builtin.command: docker volume ls
      register: reset_volumes
      changed_when: false

    - name: Show remaining Docker objects for inspection
      ansible.builtin.debug:
        msg:
          - "Containers on {{ inventory_hostname }}:"
          - "{{ reset_containers.stdout }}"
          - "Volumes on {{ inventory_hostname }}:"
          - "{{ reset_volumes.stdout }}"


    - name: Check for residual RabbitMQ Docker volumes
      ansible.builtin.shell: |
        set -euo pipefail
        docker volume ls -q | grep -i 'rabbitmq' || true
      args:
        executable: /bin/bash
      register: reset_rabbitmq_residual_volumes
      changed_when: false

    - name: Fail if RabbitMQ persistent volume survived destroy
      ansible.builtin.assert:
        that:
          - reset_rabbitmq_residual_volumes.stdout | trim == ''
        fail_msg: >-
          RabbitMQ persistent Docker volume(s) remain after kolla-ansible destroy:
          {{ reset_rabbitmq_residual_volumes.stdout_lines }}.
          A clean lab reset must not reuse old RabbitMQ Mnesia/Raft state.


- name: Verify Neutron namespaces are gone after destroy
  hosts: network:compute
  gather_facts: false
  become: true
  tasks:
    - name: Fail if qrouter qdhcp or ovnmeta namespaces remain
      ansible.builtin.shell: |
        set -euo pipefail
        bad="$(ip netns list 2>/dev/null \
          | awk '{print $1}' \
          | grep -E '^(qrouter-|qdhcp-|ovnmeta-)' || true)"

        if [ -n "$bad" ]; then
          echo "Residual namespaces:"
          echo "$bad"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false


- name: Reboot network and compute nodes to clear kernel datapath residue
  hosts: network:compute
  gather_facts: false
  become: true
  serial: 1
  tasks:
    - name: Reboot host and wait for it to return
      ansible.builtin.reboot:
        reboot_timeout: 900
        connect_timeout: 10
        post_reboot_delay: 10


- name: Verify clean host networking after reboot
  hosts: network:compute
  gather_facts: false
  become: true
  tasks:
    - name: Show compact interface state
      ansible.builtin.command: ip -br link
      register: reset_links
      changed_when: false

    - name: Print compact interface state
      ansible.builtin.debug:
        var: reset_links.stdout_lines

    - name: Verify eth0 and eth1 exist
      ansible.builtin.command: "ip link show {{ item }}"
      loop:
        - eth0
        - eth1
      changed_when: false

    - name: Verify network host retains neutron-ext
      ansible.builtin.command: ip link show neutron-ext
      when: inventory_hostname in groups.get('network', [])
      changed_when: false

    - name: Fail if OVS OVN datapath residue remains
      ansible.builtin.shell: |
        set -euo pipefail
        bad="$(ip -o link show \
          | awk -F': ' '{print $2}' \
          | cut -d@ -f1 \
          | grep -E '^(br-int|br-ex|br-tun|genev_sys_6081)$' || true)"

        if [ -n "$bad" ]; then
          echo "Residual datapath interfaces:"
          echo "$bad"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Recheck Neutron namespaces after reboot
      ansible.builtin.shell: |
        set -euo pipefail
        bad="$(ip netns list 2>/dev/null \
          | awk '{print $1}' \
          | grep -E '^(qrouter-|qdhcp-|ovnmeta-)' || true)"

        if [ -n "$bad" ]; then
          echo "Residual namespaces:"
          echo "$bad"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false


- name: Restore source ML2 OVS configuration on deployment host
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    reset_globals_path: /etc/kolla/globals.yml
    reset_config_path: /etc/kolla/config
    reset_backup_root: /root/ovs-to-ovn-backup
    reset_delete_migration_backups: false
  tasks:
    - name: Replace globals.yml with source ML2 OVS configuration
      ansible.builtin.copy:
        dest: "{{ reset_globals_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          ---
          ###############################################################################
          # Kolla / OpenStack release
          ###############################################################################

          kolla_base_distro: "ubuntu"
          kolla_base_distro_version: "noble"
          distro_python_version: "3.12"

          openstack_release: "2024.1"

          ###############################################################################
          # API / management endpoint
          ###############################################################################

          kolla_internal_vip_address: "10.0.0.213"
          kolla_external_vip_address: "10.0.0.213"

          enable_haproxy: "no"
          enable_keepalived: "no"

          ###############################################################################
          # Host networking
          ###############################################################################

          network_interface: "eth0"
          api_interface: "eth0"

          tunnel_interface: "eth1"

          ###############################################################################
          # Neutron external networking
          ###############################################################################

          neutron_external_interface: "neutron-ext"
          neutron_bridge_name: "br-ex"

          enable_neutron_provider_networks: "no"

          ###############################################################################
          # Neutron ML2/OVS
          ###############################################################################

          neutron_plugin_agent: "openvswitch"

          neutron_type_drivers: "flat,vlan,vxlan"
          neutron_tenant_network_types: "vxlan"

          enable_ovn: "no"
          enable_openvswitch: "yes"

          enable_neutron_dvr: "no"
          enable_neutron_agent_ha: "no"

          ###############################################################################
          # Open vSwitch host integration
          ###############################################################################

          openvswitch_ovs_vsctl_wrapper_enabled: true

          ###############################################################################
          # Container resource limits
          ###############################################################################

          memcached_dimensions:
            ulimits:
              nofile:
                soft: 131072
                hard: 131072

          ###############################################################################
          # Nova
          ###############################################################################

          nova_compute_virt_type: "qemu"
          nova_console: "novnc"

          ###############################################################################
          # OpenStack services
          ###############################################################################

          enable_openstack_core: "yes"

          enable_keystone: "yes"
          enable_glance: "yes"
          enable_nova: "yes"
          enable_neutron: "yes"
          enable_placement: "yes"
          enable_horizon: "yes"

          enable_heat: "no"
          enable_cinder: "no"

          ###############################################################################
          # Optional / non-required services
          ###############################################################################

          enable_prometheus: "no"
          enable_grafana: "no"
          enable_central_logging: "no"
          enable_octavia: "no"
          enable_swift: "no"
          enable_ironic: "no"
          enable_manila: "no"
          enable_barbican: "no"
          enable_designate: "no"
          enable_magnum: "no"
          enable_trove: "no"
          enable_zun: "no"

          ###############################################################################
          # Logging
          ###############################################################################

          openstack_logging_debug: "False"

    - name: Remove old custom Kolla overrides
      ansible.builtin.file:
        path: "{{ reset_config_path }}"
        state: absent

    - name: Recreate Neutron custom config directory
      ansible.builtin.file:
        path: "{{ reset_config_path }}/neutron"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Restore OVS native firewall override
      ansible.builtin.copy:
        dest: "{{ reset_config_path }}/neutron/openvswitch_agent.ini"
        owner: root
        group: root
        mode: "0644"
        content: |
          [securitygroup]
          firewall_driver = openvswitch

    - name: Optionally remove migration backup/runtime artifacts
      ansible.builtin.file:
        path: "{{ reset_backup_root }}"
        state: absent
      when: reset_delete_migration_backups | bool

    - name: Validate source globals contain no OVN migration override
      ansible.builtin.shell: |
        set -euo pipefail
        grep -Fx 'neutron_plugin_agent: "openvswitch"' {{ reset_globals_path | quote }}
        grep -Fx 'neutron_tenant_network_types: "vxlan"' {{ reset_globals_path | quote }}
        grep -Fx 'enable_ovn: "no"' {{ reset_globals_path | quote }}
        grep -Fx 'enable_openvswitch: "yes"' {{ reset_globals_path | quote }}

        if grep -q '^neutron_enable_ovn_agent:' {{ reset_globals_path | quote }}; then
          echo "Unexpected neutron_enable_ovn_agent override remains"
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false


- name: Deploy clean source ML2 OVS cloud
  hosts: localhost
  gather_facts: false
  become: true
  vars:
    reset_kolla_venv: /root/venvs/kolla-2024.1
    reset_kolla_inventory: /root/multinode
  tasks:
    - name: Bootstrap servers
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_kolla_venv + '/bin/activate') | quote }}
        kolla-ansible -i {{ reset_kolla_inventory | quote }} bootstrap-servers
      args:
        executable: /bin/bash
      changed_when: true

    - name: Run Kolla prechecks
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_kolla_venv + '/bin/activate') | quote }}
        kolla-ansible -i {{ reset_kolla_inventory | quote }} prechecks
      args:
        executable: /bin/bash
      changed_when: false

    - name: Record RabbitMQ log offset before deploy
      ansible.builtin.shell: |
        set -euo pipefail
        log="/var/log/kolla/rabbitmq/rabbit@$(hostname -s).log"
        if [ -f "$log" ]; then
          wc -l < "$log"
        else
          echo 0
        fi
      args:
        executable: /bin/bash
      register: reset_rabbitmq_log_offset
      changed_when: false

    - name: Deploy OpenStack
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_kolla_venv + '/bin/activate') | quote }}
        kolla-ansible -i {{ reset_kolla_inventory | quote }} deploy
      args:
        executable: /bin/bash
      register: reset_deploy
      changed_when: true
      failed_when: false

    - name: Verify RabbitMQ container is running after deploy attempt
      ansible.builtin.shell: |
        set -euo pipefail
        test -n "$(docker ps -q --filter name=^/rabbitmq$)"
      args:
        executable: /bin/bash
      register: reset_rabbitmq_container
      changed_when: false
      failed_when: false

    - name: Wait for RabbitMQ application startup
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - rabbitmq
          - rabbitmqctl
          - await_startup
      register: reset_rabbitmq_await
      changed_when: false
      failed_when: false
      when: reset_rabbitmq_container.rc == 0

    - name: Read RabbitMQ cluster status
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - rabbitmq
          - rabbitmqctl
          - cluster_status
      register: reset_rabbitmq_cluster
      changed_when: false
      failed_when: false
      when:
        - reset_rabbitmq_container.rc == 0
        - reset_rabbitmq_await.rc | default(1) == 0

    - name: Read RabbitMQ queue state
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - rabbitmq
          - rabbitmqctl
          - list_queues
          - name
          - type
          - state
      register: reset_rabbitmq_queues
      changed_when: false
      failed_when: false
      when:
        - reset_rabbitmq_container.rc == 0
        - reset_rabbitmq_await.rc | default(1) == 0

    - name: Verify Nova conductor quorum queue is running
      ansible.builtin.shell: |
        set -euo pipefail
        docker exec rabbitmq rabbitmqctl -q list_queues name type state           | awk '
              $1 == "conductor" && $2 == "quorum" && $3 == "running" { ok=1 }
              END { exit(ok ? 0 : 1) }
            '
      args:
        executable: /bin/bash
      register: reset_rabbitmq_conductor_queue
      changed_when: false
      failed_when: false
      when:
        - reset_rabbitmq_container.rc == 0
        - reset_rabbitmq_await.rc | default(1) == 0

    - name: Check new RabbitMQ log lines for quorum Raft failures
      ansible.builtin.shell: |
        set -euo pipefail
        log="/var/log/kolla/rabbitmq/rabbit@$(hostname -s).log"
        start=$(( {{ reset_rabbitmq_log_offset.stdout | int }} + 1 ))

        if [ ! -f "$log" ]; then
          exit 0
        fi

        tail -n +"$start" "$log"           | grep -Ei "cluster_not_formed|already_started|failed to form a new cluster"           || true
      args:
        executable: /bin/bash
      register: reset_rabbitmq_raft_errors
      changed_when: false
      failed_when: false

    - name: Show RabbitMQ diagnostics after deploy attempt
      ansible.builtin.debug:
        msg:
          - "kolla-ansible deploy rc={{ reset_deploy.rc }}"
          - "RabbitMQ container running rc={{ reset_rabbitmq_container.rc }}"
          - "RabbitMQ await_startup rc={{ reset_rabbitmq_await.rc | default('not-run') }}"
          - "RabbitMQ cluster status:"
          - "{{ reset_rabbitmq_cluster.stdout_lines | default([]) }}"
          - "RabbitMQ queues:"
          - "{{ reset_rabbitmq_queues.stdout_lines | default([]) }}"
          - "New RabbitMQ quorum/Raft errors:"
          - "{{ reset_rabbitmq_raft_errors.stdout_lines | default([]) }}"

    - name: Fail when deploy or RabbitMQ validation failed
      ansible.builtin.assert:
        that:
          - reset_deploy.rc == 0
          - reset_rabbitmq_container.rc == 0
          - reset_rabbitmq_await.rc | default(1) == 0
          - reset_rabbitmq_cluster.rc | default(1) == 0
          - reset_rabbitmq_queues.rc | default(1) == 0
          - reset_rabbitmq_conductor_queue.rc | default(1) == 0
          - reset_rabbitmq_raft_errors.stdout | default('') | trim == ''
        fail_msg: >-
          Deployment or RabbitMQ validation failed. Inspect the diagnostics above.
          In particular, cluster_not_formed / already_started / failed-to-form
          errors indicate stale or broken RabbitMQ quorum/Raft state.

    - name: Run post-deploy
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ (reset_kolla_venv + '/bin/activate') | quote }}
        kolla-ansible -i {{ reset_kolla_inventory | quote }} post-deploy
      args:
        executable: /bin/bash
      changed_when: true


- name: Verify source ML2 OVS service containers
  hosts: network:compute
  gather_facts: false
  become: true
  tasks:
    - name: Verify neutron_openvswitch_agent is running
      ansible.builtin.shell: |
        set -euo pipefail
        test -n "$(docker ps -q --filter name=^/neutron_openvswitch_agent$)"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify no OVN runtime containers are running
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "$(docker ps -q --filter name=ovn)" ]; then
          echo "Unexpected OVN containers:"
          docker ps --filter name=ovn
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false


- name: Verify source ML2 OVS network services
  hosts: network
  gather_facts: false
  become: true
  tasks:
    - name: Verify DHCP L3 and metadata agents are running
      ansible.builtin.shell: |
        set -euo pipefail
        for c in \
          neutron_dhcp_agent \
          neutron_l3_agent \
          neutron_metadata_agent \
          neutron_openvswitch_agent
        do
          if [ -z "$(docker ps -q --filter name=^/${c}$)" ]; then
            echo "Required source container is not running: $c"
            exit 1
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify generated OVS firewall driver
      ansible.builtin.shell: |
        set -euo pipefail
        grep -Eq '^[[:space:]]*firewall_driver[[:space:]]*=[[:space:]]*openvswitch[[:space:]]*$' \
          /etc/kolla/neutron-openvswitch-agent/openvswitch_agent.ini
      args:
        executable: /bin/bash
      changed_when: false


- name: Final source-cloud validation
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Show Neutron agents
      ansible.builtin.shell: |
        set -euo pipefail
        source /etc/kolla/admin-openrc.sh
        openstack network agent list
      args:
        executable: /bin/bash
      register: reset_agents
      changed_when: false

    - name: Show source cloud resources
      ansible.builtin.shell: |
        set -euo pipefail
        source /etc/kolla/admin-openrc.sh

        echo "=== SERVERS ==="
        openstack server list --all-projects

        echo
        echo "=== NETWORKS ==="
        openstack network list

        echo
        echo "=== ROUTERS ==="
        openstack router list
      args:
        executable: /bin/bash
      register: reset_cloud
      changed_when: false

    - name: Print final validation
      ansible.builtin.debug:
        msg:
          - "=== NETWORK AGENTS ==="
          - "{{ reset_agents.stdout }}"
          - "=== SOURCE CLOUD RESOURCES ==="
          - "{{ reset_cloud.stdout }}"
          - >-
            Reset complete: source cloud is redeployed as ML2/OVS + VXLAN
            with OVS native firewall. The migration repository, Kolla venv,
            inventory, passwords.yml, Docker images and host neutron-ext are preserved.
