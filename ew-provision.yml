---
- name: Work Item 1 - Validate provisioning invocation
  hosts: localhost
  gather_facts: false
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Validate provisioning action and configured compute placement
      ansible.builtin.assert:
        that:
          - ew_provision_action in ['inspect', 'apply', 'verify']
          - ew_workload_config.servers | map(attribute='compute_host') | difference(groups['compute'] | default([])) | length == 0
        fail_msg: See docs-ew-provisioning.md for reviewed configuration and private access inputs; inspect is the default action.

- name: Discover source runtime for provisioning only
  ansible.builtin.import_playbook: playbooks/00-bootstrap.yml

- name: Reuse source scope and effective MTU checks before creating EW resources
  ansible.builtin.import_playbook: playbooks/02-precheck.yml
  vars:
    ew_provisioning_precheck: true

- name: Work Item 1 - Provision or verify persistent East-West workloads
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Reuse verified namespace SSH configuration
      ansible.builtin.include_tasks: playbooks/ew-config-tasks.yml

    - name: Persist the authoritative non-secret six-guest topology
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/ew-config.json"
        mode: '0600'
        content: "{{ ew_workload_config | to_nice_json }}"

    - name: Persist confirmed provisioning configuration with local input paths
      ansible.builtin.copy:
        dest: "{{ migration_run_dir }}/ew-provision-spec.json"
        mode: '0600'
        content: "{{ ew_provision_spec | to_nice_json }}"
      when: ew_provision_spec_file | length == 0

    - name: Inspect, provision or verify the six persistent EW guests
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/scripts/ew_provision.py') | quote }} \
          {{ ew_provision_action | quote }} {{ migration_run_dir | quote }} \
          --spec {{ (ew_provision_spec_file if ew_provision_spec_file | length > 0 else migration_run_dir + '/ew-provision-spec.json') | quote }} --state {{ ew_provision_state_dir | quote }} \
          --timeout {{ ew_provision_timeout_seconds | int }} --zone {{ ew_provision_availability_zone | quote }} \
          --excluded-root {{ migration_backup_root | quote }}
      args:
        executable: /bin/bash
      register: ew_provision_result
      changed_when: ew_provision_action == 'apply' and (ew_provision_result.stdout | from_json).changed

    - name: Show provisioning evidence location and outcome
      ansible.builtin.debug:
        msg: "{{ ew_provision_result.stdout | from_json }}"
