---
# Standalone maintenance. Never imported by migrate-to-ovn.yml or reset.
- name: Plan verify or explicitly apply a coordinated cold lab checkpoint
  hosts: localhost
  gather_facts: false
  become: true
  vars_files:
    - group_vars/all.yml
  vars:
    lab_checkpoint_action: plan
    lab_checkpoint_id: ''
    lab_checkpoint_confirm: ''
    lab_checkpoint_root: /root/ovs-to-ovn-checkpoints
    lab_checkpoint_venv: /root/venvs/kolla-2024.1
    lab_checkpoint_validation_runs: []
    lab_checkpoint_recovery_mode: api
    lab_checkpoint_offline_scope_file: ''
    lab_checkpoint_headroom_bytes: 5368709120
    lab_checkpoint_guest_timeout_seconds: 300
    lab_checkpoint_health_timeout_seconds: 600
    lab_checkpoint_archive_timeout_seconds: 3600
  tasks:
    - name: Require explicit checkpoint identity and a real inventory file
      ansible.builtin.assert:
        that:
          - lab_checkpoint_id is match('^[A-Za-z0-9][A-Za-z0-9_-]{5,63}$')
          - ansible_inventory_sources | length == 1
          - lab_checkpoint_action in ['plan', 'create', 'verify', 'restore-plan', 'restore-apply', 'restore-finish']
          - lab_checkpoint_recovery_mode in ['api', 'offline']
          - lab_checkpoint_action in ['plan', 'verify', 'restore-plan'] or lab_checkpoint_confirm == lab_checkpoint_id
          - ew_guest_ssh_key | length > 0
          - ew_guest_known_hosts | length > 0
          - ew_host_known_hosts | length > 0
        fail_msg: Supply a checkpoint ID and existing verified EW SSH access. Maintenance actions additionally require lab_checkpoint_confirm equal to that ID.

    - name: Run standalone bounded tool with private configuration and credentials
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        {{ (lab_checkpoint_venv + '/bin/python3') | quote }} {{ (playbook_dir + '/scripts/lab_checkpoint.py') | quote }} {{ lab_checkpoint_action | quote }} --config - --confirm {{ lab_checkpoint_confirm | quote }}
      args:
        executable: /bin/bash
        stdin: >-
          {{ {'id': lab_checkpoint_id, 'root': lab_checkpoint_root,
              'inventory': ansible_inventory_sources[0], 'venv': lab_checkpoint_venv,
              'validation_runs': lab_checkpoint_validation_runs,
              'recovery_mode': lab_checkpoint_recovery_mode,
              'offline_scope_file': lab_checkpoint_offline_scope_file,
              'headroom_bytes': lab_checkpoint_headroom_bytes | int,
              'guest_timeout': lab_checkpoint_guest_timeout_seconds | int,
              'health_timeout': lab_checkpoint_health_timeout_seconds | int,
              'archive_timeout': lab_checkpoint_archive_timeout_seconds | int,
              'transport_timeout': ew_transport_timeout_seconds | int,
              'guest_user': ew_guest_ssh_user, 'guest_key': ew_guest_ssh_key,
              'guest_known_hosts': ew_guest_known_hosts, 'host_key': ew_host_ssh_key,
              'host_known_hosts': ew_host_known_hosts, 'ew_workload_config': ew_workload_config} | to_json }}
      register: cold_checkpoint_result
      no_log: true
      changed_when: lab_checkpoint_action not in ['plan', 'verify', 'restore-plan']
      failed_when: false

    - name: Show only sanitized checkpoint result
      ansible.builtin.debug:
        msg: "{{ (cold_checkpoint_result.stdout | from_json) if (cold_checkpoint_result.stdout | default('') | trim is match('^\\{')) else 'Checkpoint operation failed. Inspect private controller/node journals; no success or seal is implied.' }}"

    - name: Fail on incomplete checkpoint or restoration
      ansible.builtin.assert:
        that: cold_checkpoint_result.rc == 0
        fail_msg: Checkpoint operation failed. Preserve all artifacts and inspect journals before further maintenance.
