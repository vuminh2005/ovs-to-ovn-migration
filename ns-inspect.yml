---
# Read-only cloud/host inspection; writes only private controller run evidence.
# No probes, workload creation, networking changes or migration phases are run.
- import_playbook: playbooks/00-bootstrap.yml

- name: Work Item 3 - Inspect explicit N-S source without starting probes or migration
  hosts: localhost
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files: [group_vars/all.yml]
  vars:
    ns_scripts_directory: "{{ playbook_dir }}/scripts"
  tasks:
    - name: Require an explicitly enabled existing external topology
      ansible.builtin.assert:
        that: ns_enabled | bool
        fail_msg: Supply reviewed N-S inputs and verified transport paths; no addresses are inferred.
    - name: Run read-only existing-resource and exact host-path checks
      ansible.builtin.include_tasks: playbooks/ns-config-tasks.yml
    - name: Show private inspection evidence directory
      ansible.builtin.debug:
        msg: "Read-only N-S inspection: {{ migration_run_dir }}. No probes or migration were started."

- name: Work Item 3 - Inspect running source ML2 external support on every controller
  hosts: control
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Inspect source flat VLAN and physical MTU configuration
      ansible.builtin.include_tasks: playbooks/ns-controller-tasks.yml
      vars:
        ns_controller_mode: source
