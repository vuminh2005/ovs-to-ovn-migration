---
# TEMPLATE ONLY. Replace every REQUIRED value from read-only operator evidence.
# No resource provisioning, uplink setup, SG changes or guest remediation is implied.
ns_enabled: true
ns_config:
  schema_version: 1
  network: REQUIRED_EXTERNAL_NETWORK_UUID
  subnet: REQUIRED_EXTERNAL_SUBNET_UUID
  router: REQUIRED_CENTRALIZED_ROUTER_UUID
  gateway_port: REQUIRED_ROUTER_GATEWAY_PORT_UUID
  type: REQUIRED_flat_OR_vlan
  segmentation_id: null  # VLAN requires the exact integer VLAN ID
  physnet: REQUIRED_VERIFIED_PHYSNET  # first scope requires Kolla's single-bridge physnet1
  cidr: REQUIRED_EXTERNAL_IPV4_CIDR
  gateway: REQUIRED_UPSTREAM_GATEWAY_IP
  allocation_pools: [{start: REQUIRED_POOL_START, end: REQUIRED_POOL_END}]
  mtu: null  # required integer: verified external segment MTU, not tenant MTU
  snat: true
  gateway_hosts: [REQUIRED_NETWORK_INVENTORY_HOST_1, REQUIRED_NETWORK_INVENTORY_HOST_2]
  gateways:
    REQUIRED_NETWORK_INVENTORY_HOST_1:
      chassis_hostname: REQUIRED_OBSERVED_OVS_CHASSIS_HOSTNAME
      bridge: REQUIRED_EXTERNAL_BRIDGE
      uplink: REQUIRED_PHYSICAL_OR_VLAN_UPLINK
      uplink_mac: REQUIRED_OBSERVED_UPLINK_MAC
      uplink_mtu: null
      upstream_routes_verified: false
      nested_forwarding_verified: false
    REQUIRED_NETWORK_INVENTORY_HOST_2:
      chassis_hostname: REQUIRED_OBSERVED_OVS_CHASSIS_HOSTNAME
      bridge: REQUIRED_EXTERNAL_BRIDGE
      uplink: REQUIRED_PHYSICAL_OR_VLAN_UPLINK
      uplink_mac: REQUIRED_OBSERVED_UPLINK_MAC
      uplink_mtu: null
      upstream_routes_verified: false
      nested_forwarding_verified: false
  interval: 0.5
  timeout: 1.0
  stable_samples: 5
  lifetime: 14400
  readiness_timeout: 180
  egress:
    guest:
      server: REQUIRED_EXISTING_SERVER_UUID
      port: REQUIRED_EXISTING_PORT_UUID
      network: REQUIRED_TENANT_NETWORK_UUID
      subnet: REQUIRED_TENANT_SUBNET_UUID
      ip: REQUIRED_FIXED_IP
      mac: REQUIRED_PORT_MAC
      compute: REQUIRED_COMPUTE_INVENTORY_HOST
    probe:
      address: REQUIRED_CONTROLLED_EXTERNAL_ENDPOINT_IP
      port: null
      path: /probe
      endpoint_id: REQUIRED_NONSECRET_ENDPOINT_ID
      session_port: null  # optional pre-existing dedicated TCP echo service
  ingress: null  # outbound-only mode. Enable only with reviewed FIP/service/observer.
# For optional ingress replace null above with this mapping:
# ingress:
#   fip: REQUIRED_FIP_UUID
#   floating_ip: REQUIRED_FIP_ADDRESS
#   guest: {server: REQUIRED_UUID, port: REQUIRED_UUID, network: REQUIRED_UUID,
#           subnet: REQUIRED_UUID, ip: REQUIRED_FIXED_IP, mac: REQUIRED_MAC, compute: REQUIRED_HOST}
#   observer: {address: REQUIRED_MANAGEMENT_ADDRESS, user: REQUIRED_SSH_USER,
#              key: REQUIRED_PRIVATE_KEY_PATH, known_hosts: REQUIRED_VERIFIED_TRUST_FILE,
#              product_uuid: REQUIRED_VERIFIED_DMI_UUID, boot: REQUIRED_BOOT_UUID,
#              ip: REQUIRED_EXTERNAL_OBSERVER_SOURCE_IP}
#   probe: {address: REQUIRED_FIP_ADDRESS, port: REQUIRED_PERMITTED_SERVICE_PORT,
#           path: /probe, endpoint_id: REQUIRED_ENDPOINT_ID, session_port: null}
# ns_transport may reuse the existing private EW strict SSH paths/host overrides.
# Keep these paths/overrides in private extra-vars, never commit access inputs.
