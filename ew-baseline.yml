---
# Read-only cloud/host discovery, then guest-owned measurement services only.
# Does not import backup, genconfig, DB migration, cutover, or cleanup phases.
- name: Enable the dedicated EW baseline without requiring validation VMs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Select existing EW topology for finite baseline measurement
      ansible.builtin.set_fact:
        ew_workloads_enabled: true

- import_playbook: playbooks/00-bootstrap.yml
- import_playbook: playbooks/02-precheck.yml

- name: Measure finite source EW baseline and retain raw evidence
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: true
  vars_files:
    - group_vars/all.yml
  tasks:
    - name: Configure finite existing workload measurement
      ansible.builtin.include_tasks: playbooks/ew-config-tasks.yml

    - name: Start wait drain collect and evaluate source baseline
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/scripts/ew_workload.py') | quote }} baseline {{ migration_run_dir | quote }}
      args:
        executable: /bin/bash
      register: ew_baseline_result
      failed_when: false

    - name: Show baseline evidence location
      ansible.builtin.debug:
        msg: "EW baseline: {{ migration_run_dir }}/ew-report.json; raw guest/controller evidence: {{ migration_run_dir }}/ew/baseline"

    - name: Fail after retaining an incomplete or unsuccessful baseline
      ansible.builtin.assert:
        that: ew_baseline_result.rc == 0
        fail_msg: Baseline failed or collection is incomplete; retain guest evidence and inspect ew-lifecycle.json and ew-report.json.
