---
# Conservative rollback helper. After DB migrate, a true rollback requires the
# MariaDB backup and source Kolla configuration. This helper intentionally does
# not restore MariaDB automatically.
- name: Restore source Kolla globals and stop target Neutron API
  hosts: localhost
  gather_facts: false
  become: true
  vars_prompt:
    - name: migration_run_dir_to_rollback
      prompt: "Full migration run directory to roll back (for example /root/ovs-to-ovn-backup/20260930-161200)"
      private: false
    - name: confirm_rollback
      prompt: "Type ROLLBACK to continue"
      private: false
  tasks:
    - ansible.builtin.assert:
        that: confirm_rollback == 'ROLLBACK'

    - name: Restore globals on deployment host
      ansible.builtin.copy:
        src: "{{ migration_run_dir_to_rollback }}/globals.yml.before"
        dest: "{{ kolla_globals_path }}"
        remote_src: true
        mode: "0600"

    - name: Warn about DB rollback boundary
      ansible.builtin.debug:
        msg: >-
          Source globals restored. If neutron-ovn-db-sync-util migrate already ran,
          restore the Kolla MariaDB backup for this run before bringing ML2/OVS back.
