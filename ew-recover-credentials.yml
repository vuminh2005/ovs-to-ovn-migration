---
- name: Work Item 1 - Recover matching existing credentials to private controller files
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  become: true
  vars_files: [group_vars/all.yml]
  tasks:
    - name: Require a reviewed identity reference and explicit private recovery destination
      ansible.builtin.assert:
        that:
          - ew_bootstrap_reference_file | length > 0
          - ew_provision_private_dir | length > 0
    - name: Allocate private transport evidence outside the repository
      ansible.builtin.tempfile:
        state: directory
        prefix: ew-private-recovery-
      register: ew_private_recovery_directory
    - name: Reuse verified namespace access without installing guest helpers
      ansible.builtin.include_tasks: playbooks/ew-config-tasks.yml
      vars:
        migration_run_dir: "{{ ew_private_recovery_directory.path }}"
        kolla_inventory_runtime: "{{ ansible_inventory_sources[0] }}"
    - name: Save only the non-secret authoritative topology
      ansible.builtin.copy:
        dest: "{{ ew_private_recovery_directory.path }}/ew-config.json"
        content: "{{ ew_workload_config | to_nice_json }}"
        mode: '0600'
    - name: Compare existing guest passwords privately and save without overwrite
      ansible.builtin.shell: |
        set -euo pipefail
        source {{ openrc_path | quote }}
        python3 {{ (playbook_dir + '/scripts/ew_recover_credentials.py') | quote }} {{ ew_private_recovery_directory.path | quote }} --reference {{ ew_bootstrap_reference_file | quote }} --private-dir {{ ew_provision_private_dir | quote }}
      args:
        executable: /bin/bash
      no_log: true
      register: ew_private_recovery_result
      changed_when: (ew_private_recovery_result.stdout | from_json).changed
    - name: Show only the private input mapping path
      ansible.builtin.debug:
        msg: "Private inputs prepared at {{ ew_provision_private_dir }}/ew-provision-inputs.yml; no guest files/services changed."
